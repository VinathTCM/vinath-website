<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINATH · 电子收据（概念原型）</title>
<style>
:root{
  --clay:#BC6E4E; --clay-soft:rgba(188,110,78,.12);
  --tan:#C9A876; --line:#E6E1D6; --ink:#332A21; --ink-soft:#7A6F60;
  --white:#FFFFFF; --shadow:0 3px 14px rgba(51,42,33,.07);
  --amber:#B8863C; --amber-soft:rgba(184,134,60,.13);
  --font-serif:"Noto Serif SC",serif;
}
*{box-sizing:border-box;}
body{ margin:0; font-family:"Noto Sans SC",sans-serif; background:#FBF8F3; color:var(--ink); }
.wrap{ max-width:900px; margin:0 auto; padding:26px 20px 80px; }
h1{ font-family:var(--font-serif); font-size:22px; margin:0 0 4px; }
.sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:20px; }
.proto-banner{ background:var(--amber-soft); border:1px solid rgba(184,134,60,.3); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.65; color:#6B4E1E; margin-bottom:22px; }
.card{ background:var(--white); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; margin-bottom:16px; }
.section-title{ font-weight:700; font-size:15px; margin-bottom:12px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:7px; }
.field input[type=text], .field input[type=number], .field textarea, .field select{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:13.5px; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.three-col{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; }
@media (max-width:640px){ .two-col, .three-col{ grid-template-columns:1fr; } }
.btn-primary{ background:var(--clay); color:#fff; border:none; border-radius:10px; padding:11px 22px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-secondary{ background:none; border:1.5px solid var(--line); color:var(--ink); border-radius:10px; padding:10px 20px; font-size:13.5px; cursor:pointer; }
.top-actions{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
.receipt-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; }
.receipt-row:hover{ border-color:var(--clay); background:var(--clay-soft); }
.receipt-row .rno{ font-weight:700; font-size:14px; }
.receipt-row .rmeta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.receipt-row .ramt{ font-weight:700; color:var(--clay); font-size:15px; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px; }
.warn{ color:#B0503A; font-size:12.5px; margin-top:6px; display:none; }
.warn.show{ display:block; }
.login-gate{ max-width:480px; margin:80px auto; text-align:center; padding:0 20px; }
.admin-toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 22px; border-radius:100px; font-size:13.5px; box-shadow:0 10px 28px rgba(0,0,0,.22); z-index:200; opacity:0; pointer-events:none; transition:.25s; }
.admin-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* 收据本身的版式 */
.receipt-doc{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:36px 40px; }
.receipt-doc-hd{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:18px; margin-bottom:20px; }
.receipt-doc-hd .brand{ font-family:var(--font-serif); font-size:24px; font-weight:700; }
.receipt-doc-hd .doctype{ text-align:right; }
.receipt-doc-hd .doctype .big{ font-size:18px; font-weight:700; }
.receipt-doc-hd .doctype .small{ font-size:12px; color:var(--ink-soft); }
.receipt-meta-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:13px; margin-bottom:20px; }
.receipt-meta-grid .rlabel{ color:var(--ink-soft); }
.receipt-table{ width:100%; border-collapse:collapse; margin-bottom:20px; }
.receipt-table th{ text-align:left; font-size:12px; color:var(--ink-soft); border-bottom:1.5px solid var(--ink); padding:6px 4px; text-transform:uppercase; letter-spacing:.03em; }
.receipt-table td{ padding:9px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
.receipt-table .amt-col{ text-align:right; }
.receipt-total-row td{ font-weight:700; font-size:15px; border-bottom:none; border-top:2px solid var(--ink); }
.receipt-footer{ display:flex; justify-content:space-between; align-items:flex-end; margin-top:26px; }
.qr-placeholder{ width:96px; height:96px; border:1.5px dashed var(--line); border-radius:8px; display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:repeat(5,1fr); padding:8px; gap:2px; }
.qr-placeholder div{ background:var(--ink); opacity:.08; border-radius:1px; }
.qr-placeholder div:nth-child(3n){ opacity:.2; }
.qr-caption{ font-size:10.5px; color:var(--ink-soft); text-align:center; margin-top:6px; max-width:110px; }
.receipt-disclaimer{ font-size:11px; color:var(--ink-soft); margin-top:24px; line-height:1.6; border-top:1px solid var(--line); padding-top:14px; }
@media print{
  body{ background:#fff; }
  .no-print{ display:none !important; }
  .receipt-doc{ border:none; box-shadow:none; padding:0; }
  .wrap{ max-width:none; padding:0; }
}
.vinath-admin-nav{ background:#332A21; }
.vinath-admin-nav-inner{ max-width:1200px; margin:0 auto; display:flex; gap:2px; padding:0 20px; overflow-x:auto; }
.van-item{ color:rgba(255,255,255,.62); font-size:13px; padding:13px 14px; text-decoration:none; white-space:nowrap; border-bottom:2.5px solid transparent; display:inline-block; }
.van-item:hover{ color:#fff; }
.van-item.current{ color:#fff; border-bottom-color:#BC6E4E; font-weight:700; }
</style>
</head>
<body>

<div class="vinath-admin-nav no-print" id="vinathAdminNav"></div>
<div id="app"></div>
<div class="admin-toast" id="adminToast"></div>

<script>
if(window.history.scrollRestoration) window.history.scrollRestoration = "manual";
window.scrollTo(0,0);

(function(){
  async function renderVinathAdminNav(navAdmin){
    if(!navAdmin) return;
    var ALL_ADMIN_TOOLS = [
      {label:'订单预约管理', file:'VINATH_订单预约管理_概念示意.html', roles:['senior','practitioner','fulfillment','support']},
      {label:'商品管理', file:'VINATH_商品管理_概念示意.html', roles:['senior']},
      {label:'内容管理', file:'VINATH_内容管理_概念示意.html', roles:['senior']},
      {label:'电子病历', file:'VINATH_电子病历_概念示意.html', roles:['senior','practitioner'], gated:'medicalRecords'},
      {label:'电子处方', file:'VINATH_电子处方_概念示意.html', roles:['senior','practitioner'], gated:'prescriptions'},
      {label:'电子收据', file:'VINATH_电子收据_概念示意.html', roles:['senior','practitioner'], gated:'receipts'},
      {label:'智能排班', file:'VINATH_智能排班_概念示意.html', roles:['senior','practitioner']}
    ];
    var myRole = navAdmin.type==='senior' ? 'senior' : (navAdmin.adminType||'practitioner');
    var visible = ALL_ADMIN_TOOLS.filter(function(t){ return t.roles.indexOf(myRole)!==-1; });
    // I类执业医师看到的导航栏，要跟实际的功能开关状态一致——开关没打开的工具，不该在导航栏
    // 里出现让人点了才发现进不去。大管理员不受这个开关影响，不用过滤。
    if(myRole==='practitioner'){
      try {
        var apiBase = window.VINATH_API_BASE || 'https://vinath-backend.onrender.com/api';
        var res = await fetch(apiBase + '/site-settings/module_access');
        var access = res.ok ? (await res.json() || {}) : {};
        visible = visible.filter(function(t){ return !t.gated || access[t.gated]===true; });
      } catch(e){ console.error('拉取功能开关状态失败:', e); }
    }
    var currentFile = decodeURIComponent(window.location.pathname.split('/').pop());
    var navEl = document.getElementById('vinathAdminNav');
    if(!navEl) return;
    navEl.innerHTML = '<div class="vinath-admin-nav-inner">' + visible.map(function(t){
      return (currentFile === t.file) ? '<span class="van-item current">'+t.label+'</span>' : '<a class="van-item" href="'+t.file+'">'+t.label+'</a>';
    }).join('') + '</div>';
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById('adminToast');
    el.textContent = msg;
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function getCurrentAdmin(){
    try { var raw = localStorage.getItem('vinath_current_admin'); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  var cur = getCurrentAdmin();
  var isPractitioner = cur && (cur.type==='senior' || (cur.type==='junior' && (cur.adminType||'practitioner')==='practitioner'));

  if(!isPractitioner){
    document.getElementById('app').innerHTML =
      '<div class="wrap"><div class="login-gate"><h1>请先登录</h1>'
      + '<div class="sub" style="margin-top:10px;">电子收据只对执业医师（大管理员 / I类小管理员）开放。请先在 <a href="VINATH_订单预约管理_概念示意.html" style="color:var(--clay);font-weight:700;">订单预约管理</a> 页面登录，登录后回到这个页面即可看到内容——同一个浏览器里，两边共享登录状态。</div></div></div>';
    return;
  }
  renderVinathAdminNav(cur);
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var API_BASE = window.VINATH_API_BASE || 'https://vinath-backend.onrender.com/api';
  var authToken = null;
  try { authToken = sessionStorage.getItem('vinath_auth_token'); } catch(e){}

  async function getBizInfo(){
    try {
      var res = await fetch(API_BASE + '/site-settings/business_info');
      var data = res.ok ? await res.json() : null;
      return data || {};
    } catch(e){ return {}; }
  }

  var view = 'list';
  var editingReceipt = null;

  // 从订单预约管理的预约详情页跳转过来时，带着这条预约的患者、医师、诊断信息——
  // 直接预填表单，不需要重新手动输入
  var urlParams = new URLSearchParams(window.location.search);
  if(urlParams.get('patientPhone')){
    editingReceipt = {
      patientName: urlParams.get('patientName') || '',
      patientPhone: (urlParams.get('patientPhone') || '').replace(/[^0-9]/g,''),
      prefillPractitionerName: urlParams.get('practitionerName') || '',
      tcmDiagnosis: urlParams.get('diagnosis') || ''
    };
    view = 'form';
  }

  function render(){
    if(view==='list') renderList();
    else if(view==='form') renderForm();
    else if(view==='print') renderPrintView();
  }

  async function renderList(){
    var receipts = [];
    if(authToken){
      try {
        var res = await fetch(API_BASE + '/admin/receipts', { headers: { 'Authorization': 'Bearer ' + authToken } });
        if(res.ok){
          var rows = await res.json();
          receipts = rows.map(function(r){ return { id:r.id, receiptNo:r.receipt_no, patientName:r.patient_name, patientPhone:r.patient_phone,
            practitionerId:r.practitioner_id, practitionerNameSnapshot:r.practitioner_name_snapshot,
            practitionerMohRegNo:r.practitioner_moh_reg_no, practitionerApcNo:r.practitioner_apc_no,
            items:r.items, totalAmount:r.total_amount, tcmDiagnosisSnapshot:r.tcm_diagnosis_snapshot,
            paymentMethod:r.payment_method, paymentStatus:r.payment_status, issuedAt:r.issued_at }; });
        }
      } catch(e){ console.error('拉取收据列表失败:', e); }
    }
    receipts.sort(function(a,b){ return b.issuedAt.localeCompare(a.issuedAt); });
    var html = '<div class="wrap">'
      + '<div class="top-actions"><div><h1>电子收据</h1><div class="sub">开具收据、导出PDF，方便患者报销。</div></div>'
      + '<button class="btn-primary" id="newReceiptBtn">+ 开具新收据</button></div>'
      + '<div class="proto-banner"><b>收据数据已存进真实后端数据库，但这还不是符合LHDN e-Invoice标准的正式电子发票系统。</b>真正的e-Invoice合规需要对接大马税收局MyInvois系统的官方接口，这里生成的PDF字段格式是参照标准准备的，但二维码位置目前只是占位——没有真正提交给LHDN，不能作为正式报税凭证使用，仅供内部记录和向患者提供费用明细参考。</div>'
      + '<div class="card">'
      + (receipts.length ? receipts.map(function(rc){
          return '<div class="receipt-row" data-id="'+rc.id+'"><div><div class="rno">'+rc.receiptNo+' · '+escapeHtml(rc.patientName)+'</div><div class="rmeta">'+rc.issuedAt.slice(0,10)+' · '+escapeHtml(rc.practitionerNameSnapshot)+'</div></div><span class="ramt">RM '+rc.totalAmount.toFixed(2)+'</span></div>';
        }).join('') : '<div class="empty-state">还没有开过收据，点右上角"开具新收据"开始</div>')
      + '</div></div>';
    document.getElementById('app').innerHTML = html;

    document.getElementById('newReceiptBtn').addEventListener('click', function(){
      editingReceipt = {};
      view = 'form';
      render();
    });
    document.querySelectorAll('.receipt-row').forEach(function(row){
      row.addEventListener('click', function(){
        var id = this.getAttribute('data-id');
        editingReceipt = receipts.find(function(x){ return x.id===id; });
        view = 'print';
        render();
      });
    });
  }

  async function renderForm(){
    var rc = editingReceipt;
    rc.items = rc.items || {consultation:0, transport:0, medication:0, other:0};

    var practitioners = [];
    try {
      var pres = await fetch(API_BASE + '/auth/practitioners');
      practitioners = pres.ok ? await pres.json() : [];
    } catch(e){ console.error('拉取医师列表失败:', e); }

    var html = '<div class="wrap">'
      + '<div class="top-actions"><h1>开具新收据</h1><button class="btn-secondary" id="cancelFormBtn">← 取消</button></div>'

      + '<div class="card"><div class="section-title">患者信息</div>'
      + '<div class="two-col">'
      + '<div class="field"><label>患者姓名</label><input type="text" id="rcPatientNameInput" value="'+escapeHtml(rc.patientName||'')+'"></div>'
      + '<div class="field"><label>患者手机号（不带0）</label><input type="text" id="rcPatientPhoneInput" value="'+escapeHtml(rc.patientPhone||'')+'"></div>'
      + '</div>'
      + '<div class="field"><label>关联病历（可选——选了会自动带出诊断名称）</label><select id="rcRecordSelect"><option value="">不关联病历</option></select></div>'
      + '</div>'

      + '<div class="card"><div class="section-title">医师信息</div>'
      + '<div class="field"><label>接诊医师</label><select id="rcPractitionerSelect">'+practitioners.map(function(p){ return '<option value="'+p.id+'">'+p.name+'</option>'; }).join('')+'</select></div>'
      + '<div class="two-col">'
      + '<div class="field"><label>MOH T&CM 注册编号</label><input type="text" id="rcMohRegInput" value="'+escapeHtml(rc.practitionerMohRegNo||'')+'"></div>'
      + '<div class="field"><label>APC 执业证号</label><input type="text" id="rcApcInput" value="'+escapeHtml(rc.practitionerApcNo||'')+'"></div>'
      + '</div></div>'

      + '<div class="card"><div class="section-title">费用明细（马币 RM）</div>'
      + '<div class="three-col">'
      + '<div class="field"><label>诊费</label><input type="number" step="0.01" id="rcFeeConsultInput" value="'+rc.items.consultation+'"></div>'
      + '<div class="field"><label>车马费</label><input type="number" step="0.01" id="rcFeeTransportInput" value="'+rc.items.transport+'"></div>'
      + '<div class="field"><label>药费</label><input type="number" step="0.01" id="rcFeeMedicationInput" value="'+rc.items.medication+'"></div>'
      + '<div class="field"><label>其他</label><input type="number" step="0.01" id="rcFeeOtherInput" value="'+rc.items.other+'"></div>'
      + '</div>'
      + '<div style="text-align:right;font-size:15px;font-weight:700;margin-top:6px;">合计：RM <span id="rcTotalDisplay">0.00</span></div>'
      + '</div>'

      + '<div class="card"><div class="section-title">诊断与付款</div>'
      + '<div class="field"><label>中医诊断名称</label><input type="text" id="rcDiagnosisInput" value="'+escapeHtml(rc.tcmDiagnosis||'')+'"></div>'
      + '<div class="two-col">'
      + '<div class="field"><label>付款方式</label><select id="rcPaymentMethodInput"><option value="cash">现金</option><option value="whatsapp_transfer">转账</option><option value="fpx">FPX</option><option value="tng">Touch \'n Go</option><option value="card">信用卡</option></select></div>'
      + '<div class="field"><label>付款状态</label><select id="rcPaymentStatusInput"><option value="paid">已付款</option><option value="pending">待付款</option></select></div>'
      + '</div></div>'

      + '<button class="btn-primary" id="generateReceiptBtn" style="width:100%;padding:14px;font-size:15px;">生成收据</button>'
      + '</div>';
    document.getElementById('app').innerHTML = html;

    document.getElementById('cancelFormBtn').addEventListener('click', function(){ view='list'; render(); });

    // 选医师时自动带出该医师资料里存的注册编号（现在直接从医师列表接口返回的数据里取，不用再单独查一份资料表）
    function fillPractitionerInfo(){
      var pid = document.getElementById('rcPractitionerSelect').value;
      var prof = practitioners.find(function(p){ return p.id===pid; }) || {};
      if(prof.mohRegNo) document.getElementById('rcMohRegInput').value = prof.mohRegNo;
      if(prof.apcNo) document.getElementById('rcApcInput').value = prof.apcNo;
    }
    document.getElementById('rcPractitionerSelect').addEventListener('change', fillPractitionerInfo);
    if(rc.practitionerId){
      document.getElementById('rcPractitionerSelect').value = rc.practitionerId;
    } else if(rc.prefillPractitionerName){
      // 从预约详情页跳转过来时带的是医师姓名（预约记录本身存的就是姓名，不是id），按姓名找出对应的id选中
      var matched = practitioners.find(function(p){ return p.name===rc.prefillPractitionerName; });
      if(matched) document.getElementById('rcPractitionerSelect').value = matched.id;
    }
    fillPractitionerInfo();

    var latestRecords = [];
    // 手机号填好后，列出这个患者名下的病历供关联选择
    async function refreshRecordOptions(){
      var phone = document.getElementById('rcPatientPhoneInput').value.trim().replace(/[^0-9]/g,'');
      if(!phone || !authToken){ latestRecords = []; return; }
      try {
        var rres = await fetch(API_BASE + '/admin/medical-records?patientPhone=' + encodeURIComponent(phone), { headers: { 'Authorization': 'Bearer ' + authToken } });
        var rows = rres.ok ? await rres.json() : [];
        latestRecords = rows.map(function(r){ return Object.assign({ id:r.id, visitDate:r.visit_date }, r.data); });
      } catch(e){ latestRecords = []; }
      var sel = document.getElementById('rcRecordSelect');
      sel.innerHTML = '<option value="">不关联病历</option>' + latestRecords.map(function(r){
        return '<option value="'+r.id+'">'+r.visitDate+' · '+(r.tcmDiagnosis||'未填写诊断')+'</option>';
      }).join('');
    }
    document.getElementById('rcPatientPhoneInput').addEventListener('blur', refreshRecordOptions);
    refreshRecordOptions();
    document.getElementById('rcRecordSelect').addEventListener('change', function(){
      var recordId = this.value;
      if(!recordId) return;
      var record = latestRecords.find(function(r){ return r.id===recordId; });
      if(record && record.tcmDiagnosis) document.getElementById('rcDiagnosisInput').value = record.tcmDiagnosis;
    });

    // 实时算合计
    function refreshTotal(){
      var total = ['rcFeeConsultInput','rcFeeTransportInput','rcFeeMedicationInput','rcFeeOtherInput']
        .reduce(function(sum, id){ return sum + (Number(document.getElementById(id).value) || 0); }, 0);
      document.getElementById('rcTotalDisplay').textContent = total.toFixed(2);
    }
    ['rcFeeConsultInput','rcFeeTransportInput','rcFeeMedicationInput','rcFeeOtherInput'].forEach(function(id){
      document.getElementById(id).addEventListener('input', refreshTotal);
    });
    refreshTotal();

    document.getElementById('generateReceiptBtn').addEventListener('click', async function(){
      var patientName = document.getElementById('rcPatientNameInput').value.trim();
      var patientPhone = document.getElementById('rcPatientPhoneInput').value.trim().replace(/[^0-9]/g,'');
      if(!patientName || !patientPhone){ showToast('请填写患者姓名和手机号'); return; }
      var pid = document.getElementById('rcPractitionerSelect').value;
      var pname = practitioners.find(function(p){ return p.id===pid; }).name;
      var items = {
        consultation: Number(document.getElementById('rcFeeConsultInput').value)||0,
        transport: Number(document.getElementById('rcFeeTransportInput').value)||0,
        medication: Number(document.getElementById('rcFeeMedicationInput').value)||0,
        other: Number(document.getElementById('rcFeeOtherInput').value)||0
      };

      var payload = {
        patientName: patientName, patientPhone: patientPhone,
        practitionerId: pid, practitionerNameSnapshot: pname,
        practitionerMohRegNo: document.getElementById('rcMohRegInput').value.trim(),
        practitionerApcNo: document.getElementById('rcApcInput').value.trim(),
        items: items,
        tcmDiagnosisSnapshot: document.getElementById('rcDiagnosisInput').value.trim(),
        paymentMethod: document.getElementById('rcPaymentMethodInput').value,
        paymentStatus: document.getElementById('rcPaymentStatusInput').value
      };
      var btn = this;
      btn.disabled = true;
      try {
        var res = await fetch(API_BASE + '/admin/receipts', {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
          body: JSON.stringify(payload)
        });
        if(!res.ok){
          var err = await res.json();
          showToast(err.error || '生成失败，请重试');
          btn.disabled = false;
          return;
        }
        var saved = await res.json();
        editingReceipt = { id:saved.id, receiptNo:saved.receipt_no, patientName:saved.patient_name, patientPhone:saved.patient_phone,
          practitionerId:saved.practitioner_id, practitionerNameSnapshot:saved.practitioner_name_snapshot,
          practitionerMohRegNo:saved.practitioner_moh_reg_no, practitionerApcNo:saved.practitioner_apc_no,
          items:saved.items, totalAmount:saved.total_amount, tcmDiagnosisSnapshot:saved.tcm_diagnosis_snapshot,
          paymentMethod:saved.payment_method, paymentStatus:saved.payment_status, issuedAt:saved.issued_at };
        view = 'print';
        render();
        showToast('收据已生成');
      } catch(e){
        showToast('连不上服务器，请检查网络后重试');
        btn.disabled = false;
      }
    });
  }

  var PAYMENT_METHOD_LABELS = {cash:'现金', whatsapp_transfer:'转账', fpx:'FPX', tng:'Touch \'n Go', card:'信用卡'};
  var FEE_LABELS = {consultation:'诊费', transport:'车马费', medication:'药费', other:'其他'};

  async function renderPrintView(){
    var rc = editingReceipt;
    var biz = await getBizInfo();
    var itemRows = Object.keys(FEE_LABELS).filter(function(k){ return rc.items[k] > 0; }).map(function(k){
      return '<tr><td>'+FEE_LABELS[k]+'</td><td class="amt-col">RM '+rc.items[k].toFixed(2)+'</td></tr>';
    }).join('');

    var html = '<div class="wrap">'
      + '<div class="top-actions no-print"><button class="btn-secondary" id="backToListBtn">← 返回收据列表</button>'
      + '<button class="btn-primary" id="printBtn">导出 PDF / 打印</button></div>'

      + '<div class="receipt-doc">'
      + '<div class="receipt-doc-hd"><div class="brand">VINATH<span style="font-size:12px;vertical-align:super;">™</span></div>'
      + '<div class="doctype"><div class="big">收据 / RECEIPT</div><div class="small">收据编号：'+rc.receiptNo+(biz.taxId?'<br>税号 Tax ID：'+biz.taxId:'')+'</div></div></div>'

      + '<div class="receipt-meta-grid">'
      + '<div><span class="rlabel">开票日期：</span>'+rc.issuedAt.slice(0,10)+'</div>'
      + '<div><span class="rlabel">付款状态：</span>'+(rc.paymentStatus==='paid'?'已付款':'待付款')+'</div>'
      + '<div><span class="rlabel">患者姓名：</span>'+escapeHtml(rc.patientName)+'</div>'
      + '<div><span class="rlabel">付款方式：</span>'+PAYMENT_METHOD_LABELS[rc.paymentMethod]+'</div>'
      + '<div><span class="rlabel">接诊医师：</span>'+escapeHtml(rc.practitionerNameSnapshot)+'</div>'
      + '<div><span class="rlabel">中医诊断：</span>'+escapeHtml(rc.tcmDiagnosisSnapshot||'—')+'</div>'
      + (rc.practitionerMohRegNo ? '<div><span class="rlabel">MOH T&CM 注册编号：</span>'+escapeHtml(rc.practitionerMohRegNo)+'</div>' : '')
      + (rc.practitionerApcNo ? '<div><span class="rlabel">APC 执业证号：</span>'+escapeHtml(rc.practitionerApcNo)+'</div>' : '')
      + '</div>'

      + '<table class="receipt-table"><thead><tr><th>项目</th><th class="amt-col">金额</th></tr></thead><tbody>'
      + itemRows
      + '<tr class="receipt-total-row"><td>合计</td><td class="amt-col">RM '+rc.totalAmount.toFixed(2)+'</td></tr>'
      + '</tbody></table>'

      + '<div class="receipt-footer">'
      + '<div style="font-size:12px;color:var(--ink-soft);">感谢您选择 VINATH 居家中医服务。<br>如需咨询本次收据内容，请通过网站「相约」联系我们。</div>'
      + '<div style="text-align:center;"><div class="qr-placeholder">'+'<div></div>'.repeat(25)+'</div><div class="qr-caption">二维码位置（对接LHDN e-Invoice后，由官方系统生成真实验证码）</div></div>'
      + '</div>'

      + '<div class="receipt-disclaimer">本收据由 VINATH 内部系统生成，用于记录本次居家中医服务的费用明细，可作为向公司或保险公司报销时的费用证明参考。本收据目前未对接马来西亚内陆税收局（LHDN）e-Invoice 官方系统，不具备正式电子发票的法律效力；如贵司/保险公司要求正式电子发票，请与我们联系另行处理。</div>'

      + '</div></div>';
    document.getElementById('app').innerHTML = html;

    document.getElementById('backToListBtn').addEventListener('click', function(){ view='list'; render(); });
    document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  }

  // 用列表接口本身做一次探测——大管理员永远通过；I类医师则要看大管理员有没有为这个工具打开
  // 开关。被拒绝的话直接换成清晰的提示页面，不显示成"还没有开过收据"这种容易让人误会的空状态。
  // 只在页面首次加载时查一次，不在每次内部刷新界面(render())时重复查。
  (async function(){
    try {
      var res = await fetch(API_BASE + '/admin/receipts', { headers: { 'Authorization': 'Bearer ' + authToken } });
      if(res.status === 403){
        document.getElementById('app').innerHTML =
          '<div class="wrap"><div class="login-gate"><h1>这个功能还没有对你开放</h1>'
          + '<div class="sub" style="margin-top:10px;">电子收据目前只开放给大管理员使用，I类执业医师是否能用由大管理员按需开关——如果需要用到这个工具，请联系大管理员开启。</div></div></div>';
        return;
      }
    } catch(e){}
    render();
  })();
})();
</script>
</body>
</html>
