<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINATH · 商店</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100vh; background:#F7F3EC; font-family:"Noto Sans SC","PingFang SC",sans-serif; color:#3B2E22; }

:root{
  --tan:#C9A876; --tan-deep:#A07A45; --espresso:#3B2E22; --espresso-soft:#6E5F4E;
  --clay:#BC6E4E; --white-warm:#FFFDF9; --cream:#F7F3EC; --line:rgba(59,46,34,.10); --shadow:rgba(59,46,34,.13);
  --font-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --font-en:"Cormorant Garamond",Georgia,serif;
  --pad: clamp(18px, 4.5vw, 44px);
}

.page{ max-width:960px; margin:0 auto; position:relative; }

.vh-header{ display:flex; align-items:center; justify-content:space-between; padding: clamp(16px,3vw,24px) var(--pad) clamp(14px,2.5vw,18px); }
.vh-header .side{ display:flex; align-items:center; gap:10px; min-width:0; }
.vh-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:clamp(24px,4vw,28px); letter-spacing:.15em; color:var(--espresso); white-space:nowrap; cursor:pointer; transition:letter-spacing .3s ease; }
.vh-tm{ font-variant:normal; font-size:.34em; vertical-align:super; opacity:.65; margin-left:1px; }
.vh-footer{ border-top:1px solid var(--line); margin-top:60px; padding:36px var(--pad) 30px; }
.vh-footer-top{ margin-bottom:16px; }
.vh-footer-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:15px; letter-spacing:.12em; color:var(--espresso); }
.vh-footer-bottom{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--espresso-soft); opacity:.8; }
.vh-footer-my{ font-weight:600; letter-spacing:.03em; white-space:nowrap; }
@media (max-width:480px){ .vh-footer-bottom{ flex-direction:column; align-items:flex-start; gap:5px; } }
.vh-brand:hover{ letter-spacing:.26em; }
.vh-icons{ display:flex; gap:18px; flex:none; }
.vh-ibtn{ display:flex; align-items:center; justify-content:center; color:var(--espresso); cursor:pointer; transition:opacity .15s, transform .15s; flex:none; position:relative; }
.vh-ibtn:hover{ opacity:.65; } .vh-ibtn:active{ transform:scale(.9); }
.cart-badge{ position:absolute; top:-7px; right:-9px; background:var(--clay); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
.vh-acct-wrap{ position:relative; display:flex; }
.vh-acct-menu{ position:absolute; top:calc(100% + 12px); right:-6px; background:var(--white-warm); border-radius:14px; box-shadow:0 14px 34px rgba(59,46,34,.18);
  padding:8px; min-width:140px; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:60; }
.vh-acct-menu.open{ opacity:1; pointer-events:auto; }
.vham-item{ padding:11px 14px; font-size:14px; border-radius:9px; cursor:pointer; color:var(--espresso); white-space:nowrap; }
.vham-item:hover{ background:var(--cream); }

.breadcrumb{ padding:0 var(--pad) 14px; font-size:13.5px; color:var(--espresso-soft); }
.breadcrumb .bc-link{ color:var(--tan-deep); cursor:pointer; font-weight:600; }
.breadcrumb .bc-link:hover{ text-decoration:underline; }
.breadcrumb .sep{ margin:0 7px; opacity:.5; }
.breadcrumb .bc-current{ color:var(--espresso-soft); }

.content{ padding: 4px var(--pad) clamp(48px,6vw,64px); }
.shop-title{ font-family:var(--font-serif); font-weight:700; font-size:clamp(30px,5.4vw,38px); margin:6px 0 26px; }
.global-search-wrap{ display:flex; align-items:center; gap:10px; background:var(--white-warm); border:1.5px solid var(--line); border-radius:100px; padding:13px 20px; margin-bottom:26px; color:var(--espresso-soft); box-shadow:var(--shadow); }
.global-search-wrap svg{ flex:none; }
.global-search-wrap input{ border:none; outline:none; background:transparent; font-size:15px; font-family:inherit; color:var(--espresso); flex:1; min-width:0; }
.global-search-wrap input::placeholder{ color:var(--espresso-soft); }
.global-search-wrap .gs-clear{ flex:none; cursor:pointer; opacity:.6; font-size:13px; display:none; }
.global-search-wrap .gs-clear.show{ display:block; }

/* ---- category row ---- */
.cat-section{ position:relative; margin-bottom:34px; }
.cat-scroll{ display:flex; gap:14px; overflow-x:auto; scroll-behavior:smooth; scroll-snap-type:x proximity; padding-bottom:4px; scrollbar-width:none; }
.cat-scroll::-webkit-scrollbar{ display:none; }
.cat-card{ flex:1 1 0; min-width:104px; cursor:pointer; scroll-snap-align:start; }
.cat-thumb{ width:100%; aspect-ratio:1/1; border-radius:18px; overflow:hidden; position:relative; box-shadow:0 4px 16px var(--shadow); transition:transform .18s ease, box-shadow .18s ease; }
.cat-card.on .cat-thumb{ transform:translateY(-3px); box-shadow:0 8px 22px rgba(59,46,34,.22); }
.cat-thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s cubic-bezier(.22,.61,.36,1); }
.cat-card:hover .cat-thumb img, .cat-card:active .cat-thumb img{ transform:scale(1.09); }

.prod-thumb img, .prod-thumb .pt-icon{ transition:transform .35s cubic-bezier(.22,.61,.36,1); }
.prod-card:hover .prod-thumb img, .prod-card:active .prod-thumb img,
.prod-card:hover .prod-thumb .pt-icon, .prod-card:active .prod-thumb .pt-icon{ transform:scale(1.09); }

.feat-card .pt-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--tan-deep); opacity:.85; }
.feat-card .pt-icon svg{ width:20%; height:20%; }
.feat-card img, .feat-card .pt-icon{ transition:transform .4s cubic-bezier(.22,.61,.36,1); }
.feat-card:hover img, .feat-card:active img,
.feat-card:hover .pt-icon, .feat-card:active .pt-icon{ transform:scale(1.08); }
.prod-thumb .pt-icon, .qv-hero .pt-icon, .feat-card .pt-icon{ background:linear-gradient(135deg, #F3EFE6, #EAE2D2); }
.cat-thumb .cat-ring{ position:absolute; inset:0; border-radius:18px; border:2.5px solid transparent; transition:border-color .18s ease; }
.cat-card.on .cat-thumb .cat-ring{ border-color:var(--clay); }
.cat-name{ text-align:center; font-family:var(--font-serif); font-weight:700; font-size:14.5px; margin-top:10px; }
.cat-count{ text-align:center; font-size:11.5px; color:var(--espresso-soft); margin-top:2px; }
.cat-nav{ position:absolute; right:-6px; top:38%; transform:translateY(-50%); width:34px; height:34px; border-radius:50%;
  background:var(--white-warm); box-shadow:0 3px 10px var(--shadow); display:flex; align-items:center; justify-content:center;
  color:var(--espresso); cursor:pointer; transition:opacity .2s; }
.cat-nav.hide{ opacity:0; pointer-events:none; }

/* ---- expand zone ---- */
.expand-zone{ max-height:0; overflow:hidden; transition:max-height .45s cubic-bezier(.22,.61,.36,1); margin-bottom:0; }
.expand-zone.open{ max-height:6000px; margin-bottom:34px; }
.expand-inner{ padding-top:4px; }
.expand-hd{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:14px; flex-wrap:wrap; }
.expand-hd .eh-title{ font-family:var(--font-serif); font-weight:700; font-size:19px; flex:none; }
.eh-search-wrap{ display:flex; align-items:center; gap:8px; background:var(--white-warm); border:1.5px solid var(--line); border-radius:20px; padding:8px 14px; flex:1 1 200px; max-width:280px; color:var(--espresso-soft); }
.eh-search-wrap input{ border:none; outline:none; background:transparent; font-size:13.5px; font-family:inherit; color:var(--espresso); flex:1; min-width:0; }
.eh-search-wrap input::placeholder{ color:var(--espresso-soft); }
.eh-count{ font-size:12px; color:var(--espresso-soft); white-space:nowrap; flex:none; }
.eh-chips{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:14px; margin-bottom:6px; border-bottom:1px solid var(--line); }
.eh-chips::-webkit-scrollbar{ display:none; }
.eh-chip{ flex:none; font-size:12.5px; font-weight:600; padding:7px 14px; border-radius:16px; border:1.5px solid var(--line); color:var(--espresso-soft); cursor:pointer; white-space:nowrap; scroll-snap-align:start; transition:.15s; }
.eh-chip.on{ border-color:var(--clay); background:rgba(188,110,78,.09); color:var(--clay); }
.prod-group{ margin-bottom:26px; }
.prod-group-hd{ display:flex; align-items:baseline; gap:8px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line); }
.prod-group-journey{ font-family:var(--font-serif); font-weight:700; font-size:13px; color:var(--tan-deep); }
.prod-group-cond{ font-size:15px; font-weight:700; color:var(--espresso); }
.prod-group-count{ font-size:12px; color:var(--espresso-soft); margin-left:auto; }
.prod-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px; }
.prod-card{ cursor:pointer; }
.prod-thumb{ width:100%; aspect-ratio:4/3; border-radius:14px; overflow:hidden; position:relative; box-shadow:0 3px 12px var(--shadow); }
.prod-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.prod-thumb .pt-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--tan-deep); opacity:.85; }
.prod-thumb .pt-icon svg{ width:26%; height:26%; }
.prod-thumb .oos-badge{ position:absolute; top:8px; left:8px; background:rgba(40,31,22,.82); color:#fdf8f0; font-size:10.5px; padding:3px 9px; border-radius:12px; font-weight:600; }
.prod-wish{ position:absolute; top:8px; right:8px; width:29px; height:29px; border-radius:50%; background:rgba(255,253,249,.92); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; transition:.15s; }
.prod-wish svg{ stroke:var(--espresso-soft); transition:.15s; }
.prod-wish.on svg{ fill:var(--clay); stroke:var(--clay); }
.wish-filter-chip{ display:inline-flex; align-items:center; gap:5px; font-size:13px; padding:8px 15px; border-radius:100px; border:1.5px solid var(--line); background:var(--white-warm); color:var(--espresso); cursor:pointer; margin-bottom:18px; }
.wish-filter-chip.on{ background:var(--clay); border-color:var(--clay); color:#fff; }
.wish-filter-chip svg{ flex:none; }
.prod-name{ font-family:var(--font-serif); font-weight:700; font-size:14.5px; margin-top:9px; }
.prod-price{ font-size:13px; color:var(--tan-deep); font-weight:600; margin-top:2px; }
.prod-empty{ font-size:14px; color:var(--espresso-soft); padding:20px 0; text-align:center; }

/* ---- featured section ---- */
.feat-title{ font-family:var(--font-serif); font-weight:700; font-size:22px; margin:0 0 4px; }
.feat-sub{ font-family:var(--font-en); font-variant:small-caps; letter-spacing:.22em; font-size:12.5px; color:var(--tan-deep); margin-bottom:18px; }
.feat-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
@media (max-width:640px){ .feat-grid{ grid-template-columns:1fr; } }
.feat-card{ cursor:pointer; border-radius:20px; overflow:hidden; box-shadow:0 6px 20px var(--shadow); position:relative; aspect-ratio:3/4; }
.feat-card img{ width:100%; height:100%; object-fit:cover; display:block; }
.feat-scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(24,17,10,0) 45%, rgba(24,17,10,.62) 100%); }
.feat-pin{ position:absolute; top:12px; left:12px; background:rgba(255,253,249,.92); color:var(--clay); font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:12px; letter-spacing:.05em; }
.feat-body{ position:absolute; left:0; right:0; bottom:0; padding:16px; color:#fff; }
.feat-body.feat-body-plain{ color:var(--espresso); background:linear-gradient(180deg, rgba(243,239,230,0) 0%, rgba(240,235,222,.95) 45%); padding-top:36px; }
.feat-body.feat-body-plain .feat-name{ text-shadow:none; }
.feat-name{ font-family:var(--font-serif); font-weight:700; font-size:19px; text-shadow:0 2px 8px rgba(0,0,0,.3); }
.feat-price{ font-size:14px; margin-top:4px; opacity:.95; }

/* ---- quick view modal ---- */
.qv-overlay{ position:fixed; inset:0; background:rgba(30,24,18,.4); opacity:0; pointer-events:none; transition:opacity .25s; z-index:60; }
.qv-overlay.open{ opacity:1; pointer-events:auto; }
.qv-sheet{ position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:min(480px,100%); max-height:88vh; overflow-y:auto;
  background:#fff; border-radius:24px 24px 0 0; z-index:61; transition:transform .34s cubic-bezier(.22,.61,.36,1); box-shadow:0 -10px 34px rgba(30,24,18,.2); }
.qv-sheet.open{ transform:translate(-50%,0); }
.qv-hero{ width:100%; aspect-ratio:16/10; position:relative; overflow:hidden; touch-action:pan-y; }
.qv-hero-track{ display:flex; width:100%; height:100%; transition:transform .4s cubic-bezier(.22,.61,.36,1); }
.qv-hero-slide{ flex:0 0 100%; height:100%; position:relative; }
.qv-hero-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
.qv-hero .pt-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--tan-deep); opacity:.85; }
.qv-hero .pt-icon svg{ width:22%; height:22%; }
.qv-dots{ position:absolute; bottom:12px; left:0; right:0; display:flex; justify-content:center; gap:5px; z-index:2; }
.qv-dot{ width:5px; height:5px; border-radius:3px; background:rgba(255,255,255,.55); transition:width .25s, background .25s; }
.qv-dot.on{ width:15px; background:#fff; }
.qv-hero-nav{ position:absolute; top:50%; transform:translateY(-50%); width:30px; height:30px; border-radius:50%; background:rgba(255,253,249,.85); display:flex; align-items:center; justify-content:center; color:var(--espresso); cursor:pointer; z-index:2; transition:opacity .2s; }
.qv-hero-nav.prev{ left:10px; } .qv-hero-nav.next{ right:10px; }
.qv-hero-nav.hide{ opacity:0; pointer-events:none; }

.qv-qty-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
.qv-qty-label{ font-size:13px; font-weight:700; color:var(--espresso-soft); }
.qv-stepper{ display:flex; align-items:center; gap:0; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; }
.qv-step-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--espresso); font-size:17px; user-select:none; background:var(--white-warm); }
.qv-step-btn:active{ background:var(--clay-soft, rgba(188,110,78,.1)); }
.qv-qty-num{ width:42px; text-align:center; font-weight:700; font-size:15px; }
.qv-close{ position:absolute; top:14px; right:14px; width:32px; height:32px; border-radius:50%; background:rgba(255,253,249,.92); border:none; display:flex; align-items:center; justify-content:center; color:var(--espresso); cursor:pointer; }
.qv-body{ padding:22px 24px 28px; }
.qv-type{ font-size:11.5px; font-weight:700; color:var(--tan-deep); letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
.qv-name{ font-family:var(--font-serif); font-weight:700; font-size:24px; margin-bottom:8px; }
.qv-desc{ font-size:14.5px; color:var(--espresso-soft); line-height:1.75; margin-bottom:20px; }
.qv-full-link{ font-size:13px; color:var(--tan-deep); font-weight:600; cursor:pointer; margin:-12px 0 20px; }
.qv-full-link:hover{ text-decoration:underline; }
.qv-variants{ display:flex; gap:10px; margin-bottom:22px; }
.qv-variant{ flex:1; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; cursor:pointer; transition:.15s; }
.qv-variant.on{ border-color:var(--clay); background:rgba(188,110,78,.07); }
.qv-variant .vv-lbl{ font-size:12.5px; color:var(--espresso-soft); font-weight:600; }
.qv-variant .vv-price{ font-family:var(--font-serif); font-weight:700; font-size:17px; margin-top:3px; }
.qv-oos{ font-size:13px; color:var(--clay); background:rgba(188,110,78,.08); border-radius:10px; padding:10px 14px; margin-bottom:16px; }
.qv-add{ width:100%; background:var(--espresso); color:#fff; border:none; padding:15px; border-radius:14px; font-size:15.5px; font-weight:700; cursor:pointer; transition:opacity .15s; }
.qv-add:hover{ opacity:.9; }
.qv-add:disabled{ opacity:.4; cursor:not-allowed; }

.vh-toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px); background:rgba(40,31,22,.94); color:#FDF8F0; font-size:15px; padding:11px 20px;
  border-radius:20px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:70; max-width:88vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vh-toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="page">
  <div class="vh-header">
    <div class="side">
      <div class="vh-brand" id="brandBtn">VINATH<span class="vh-tm">™</span></div>
    </div>
    <div class="vh-icons">
      <div class="vh-ibtn" id="searchBtn" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.3" cy="10.3" r="6.3"/><line x1="19.5" y1="19.5" x2="15" y2="15"/></svg>
      </div>
      <span class="vh-acct-wrap">
        <div class="vh-ibtn" id="acctBtn" aria-label="查询">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.3"/><path d="M5 19.5c1.2-3.8 3.9-5.7 7-5.7s5.8 1.9 7 5.7"/></svg>
        </div>
        <div class="vh-acct-menu" id="vhAcctMenu">
          <div class="vham-item" id="vhamOrder">查询订单</div>
          <div class="vham-item" id="vhamBooking">查询预约</div>
        </div>
      </span>
      <div class="vh-ibtn" id="cartBtn" aria-label="购物包">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </div>
    </div>
  </div>

  <div class="breadcrumb"><span class="bc-link" id="bcHome">首页</span><span class="sep">›</span><span class="bc-current">商店</span></div>

  <div class="content">
    <h1 class="shop-title">商店</h1>

    <div class="global-search-wrap">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.3" cy="10.3" r="6.3"/><line x1="19.5" y1="19.5" x2="15" y2="15"/></svg>
      <input type="text" id="globalSearchInput" placeholder="搜索全部商品，例如：茶、痛经、月舒贴">
      <span class="gs-clear" id="gsClearBtn">✕</span>
    </div>

    <div class="wish-filter-chip" id="wishFilterChip"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2 0 3.5 1 4 2 .5-1 2-2 4-2 4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z"/></svg><span id="wishFilterLabel">我的收藏</span></div>

    <div class="cat-section">
      <div class="cat-scroll" id="catScroll"></div>
      <div class="cat-nav" id="catNav">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5l7 7-7 7"/></svg>
      </div>
    </div>

    <div class="expand-zone" id="expandZone">
      <div class="expand-inner">
        <div class="expand-hd">
          <div class="eh-title" id="ehTitle"></div>
          <div class="eh-search-wrap">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.3" cy="10.3" r="6.3"/><line x1="19.5" y1="19.5" x2="15" y2="15"/></svg>
            <input type="text" id="ehSearch" placeholder="搜索这个系列的商品">
            <span class="eh-count" id="ehCount"></span>
          </div>
        </div>
        <div id="prodGroups"></div>
      </div>
    </div>

    <div class="feat-title">当季主打</div>
    <div class="feat-sub">SEASONAL PICKS</div>
    <div class="feat-grid" id="featGrid"></div>
  </div>
</div>

<div class="qv-overlay" id="qvOverlay"></div>
<div class="qv-sheet" id="qvSheet">
  <div class="qv-hero" id="qvHero">

  // [stated bug fix] this page used to run entirely off its own frozen copy of PRODUCTS with zero
  // connection to 商品管理 — not just description, NOTHING synced (name/price/stock/active/tags
  // all included). Now overlays whatever's in the shared catalog (published by 商品管理's
  // syncCatalogToStorage) onto this page's own copy at load time, so an edit made in the admin
  // tool shows up here the next time this page is opened in the same browser.
  function mergeCatalogFromStorage(){
    try {
      var raw = localStorage.getItem('vinath_product_catalog');
      if(!raw) return;
      var byId = {};
      JSON.parse(raw).forEach(function(c){ byId[c.id] = c; });
      PRODUCTS.forEach(function(p){
        var c = byId[p.id];
        if(!c) return;
        if(typeof c.stockQty === 'number'){ p.stockQty = c.stockQty; p.inStock = c.stockQty > 0; }
        if(c.name) p.name = c.name;
        if(c.nameEn !== undefined) p.nameEn = c.nameEn;
        if(typeof c.price === 'number') p.price = c.price;
        if(c.type) p.type = c.type;
        if(typeof c.trial === 'number') p.trial = c.trial;
        if(c.desc !== undefined) p.desc = c.desc;
        if(typeof c.active === 'boolean') p.active = c.active;
        if(typeof c.featured === 'boolean') p.featured = c.featured;
        if(c.tags) p.tags = c.tags;
        if(c.journeys) p.journeys = c.journeys;
        if(c.form !== undefined) p.form = c.form;
        if(c.herbs) p.herbs = c.herbs;
        if(c.usage !== undefined) p.usage = c.usage;
        if(c.imgs && c.imgs.length) p.imgs = c.imgs;
      });
    } catch(e){}
  }

  function cartFromURL(){
    var raw = new URLSearchParams(window.location.search).get('cart');
    if(!raw) return cartFromStorage(); // no cart in the URL (e.g. opened this page directly) — fall back to the last-saved cart
    return raw.split(',').map(function(chunk){
      var parts = chunk.split(':'); var id = Number(parts[0]);
      return id ? {id:id, variant:(parts[1]==='t'?'trial':'full'), qty:Number(parts[2])||1} : null;
    }).filter(Boolean);
  }
  function cartToParam(items){ return items.map(function(it){ return it.id+':'+(it.variant==='trial'?'t':'f')+':'+it.qty; }).join(','); }
  function withCart(url, items){
    var cartStr = cartToParam(items);
    if(!cartStr) return url;
    var hashIdx = url.indexOf('#');
    var hash = hashIdx === -1 ? '' : url.slice(hashIdx);
    var base = hashIdx === -1 ? url : url.slice(0, hashIdx);
    return base + (base.indexOf('?')===-1 ? '?' : '&') + 'cart=' + encodeURIComponent(cartStr) + hash;
  }

    imgIdx = Math.max(0, Math.min(qvImgs.length-1, i));
    renderQvImage();
  }
  qvPrev.addEventListener('click', function(){ goImg(imgIdx-1); });
  qvNext.addEventListener('click', function(){ goImg(imgIdx+1); });
  var qvSx=0, qvDx=0, qvTouching=false;
  document.getElementById('qvHero').addEventListener('touchstart', function(e){
    qvSx=e.touches[0].clientX; qvDx=0; qvTouching=true; qvTrack.style.transition='none';
  }, {passive:true});
  document.getElementById('qvHero').addEventListener('touchmove', function(e){
    if(!qvTouching) return;
    qvDx = e.touches[0].clientX - qvSx;
    var eff = qvDx;
    if((imgIdx===0 && qvDx>0) || (imgIdx===qvImgs.length-1 && qvDx<0)) eff = qvDx*0.35;
    qvTrack.style.transform = 'translateX(calc(-'+(imgIdx*100)+'% + '+eff+'px))';
  }, {passive:true});
  document.getElementById('qvHero').addEventListener('touchend', function(){
    qvTouching=false; qvTrack.style.transition='';
    if(Math.abs(qvDx)>40){ qvDx<0 ? goImg(imgIdx+1) : goImg(imgIdx-1); } else { renderQvImage(); }
    qvDx=0;
  });

  function setQty(n){
    qty = Math.max(1, n);
    qvQtyNum.textContent = qty;
  }
  document.getElementById('qvMinus').addEventListener('click', function(){ setQty(qty-1); });
  document.getElementById('qvPlus').addEventListener('click', function(){ setQty(qty+1); });

  function openQuickView(id){
    var p = PRODUCTS.find(function(x){ return x.id===id; });
    if(!p) return;
    currentProduct = p;
    selectedVariant = 'full';
    setQty(1);
    var meta = TYPE_META[p.type];
    var hasImgs = p.imgs && p.imgs.length;
    qvImgs = hasImgs ? p.imgs.slice() : [null];
    imgIdx = 0;
    qvTrack.style.transition = 'none';
    qvTrack.innerHTML = qvImgs.map(function(src){
      return '<div class="qv-hero-slide">' + (src ? '<img src="'+src+'" alt="'+p.name+'">' : '<div class="pt-icon">'+(ICON[p.type]||GENERIC_CAT_ICON)+'</div>') + '</div>';
    }).join('');
    qvDots.innerHTML = qvImgs.length>1 ? qvImgs.map(function(_,i){ return '<span class="qv-dot'+(i===0?' on':'')+'"></span>'; }).join('') : '';
    requestAnimationFrame(function(){ qvTrack.style.transition = ''; renderQvImage(); });

    qvType.textContent = meta.label;
    var qvWishBtn = document.getElementById('qvWishBtn');
    qvWishBtn.innerHTML = WISH_HEART_SVG;
    qvWishBtn.classList.toggle('on', isWishlisted(p.id));
    qvWishBtn.onclick = function(e){
      e.stopPropagation();
      toggleWishlist(p.id);
      qvWishBtn.classList.toggle('on');
      updateWishFilterCount();
      var card = document.querySelector('.prod-card[data-id="'+p.id+'"] .prod-wish');
      if(card) card.classList.toggle('on', isWishlisted(p.id));
    };
    document.getElementById('qvFullLink').onclick = function(){
      window.location.href = withCart('/product/?id=' + p.id, cartItems);
    };
    qvName.textContent = p.name;
    qvDesc.textContent = p.desc;
    qvOosMsg.innerHTML = p.inStock ? '' : '<div class="qv-oos">这款暂时缺货，补货后会自动恢复上架。</div>';
    qvVariants.innerHTML =
      '<div class="qv-variant on" data-v="full"><div class="vv-lbl">正装</div><div class="vv-price">MYR '+p.price+'</div></div>'
      + '<div class="qv-variant" data-v="trial"><div class="vv-lbl">试用装</div><div class="vv-price">MYR '+p.trial+'</div></div>';
    qvVariants.querySelectorAll('.qv-variant').forEach(function(v){
      v.addEventListener('click', function(){
        selectedVariant = this.getAttribute('data-v');
        qvVariants.querySelectorAll('.qv-variant').forEach(function(x){ x.classList.remove('on'); });
        this.classList.add('on');
      });
    });
    qvAdd.disabled = !p.inStock;
    qvAdd.textContent = p.inStock ? '加入购物车' : '暂时缺货';
    qvOverlay.classList.add('open');
    qvSheet.classList.add('open');
  }
  function closeQuickView(){ qvOverlay.classList.remove('open'); qvSheet.classList.remove('open'); }
  document.getElementById('qvClose').addEventListener('click', closeQuickView);
  qvOverlay.addEventListener('click', closeQuickView);

  function cartTotalQty(){ return cartItems.reduce(function(s,it){ return s+it.qty; }, 0); }
  function updateCartBadge(){
    saveCartToStorage(cartItems);
    var total = cartTotalQty();
    var badge = document.getElementById('cartBadge');
    badge.textContent = total;
    badge.style.display = total > 0 ? 'flex' : 'none';
  }

  qvAdd.addEventListener('click', function(){
    if(!currentProduct || !currentProduct.inStock) return;
    var existing = cartItems.find(function(it){ return it.id===currentProduct.id && it.variant===selectedVariant; });
    if(existing){ existing.qty += qty; } else { cartItems.push({id:currentProduct.id, variant:selectedVariant, qty:qty}); }
    updateCartBadge();
    var variantLbl = selectedVariant === 'trial' ? '试用装' : '正装';
    showToast('已加入购物车：'+currentProduct.name+'（'+variantLbl+'）×'+qty);
    closeQuickView();
  });

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1900);
  }

  document.getElementById('brandBtn').addEventListener('click', function(){ window.location.href = withCart('/', cartItems); });
  document.getElementById('bcHome').addEventListener('click', function(){ window.location.href = withCart('/', cartItems); });
  document.getElementById('searchBtn').addEventListener('click', function(){ showToast('搜索 · 功能开发中'); });
  var vhAcctMenu = document.getElementById('vhAcctMenu');
  document.getElementById('acctBtn').addEventListener('click', function(e){
    e.stopPropagation();
    vhAcctMenu.classList.toggle('open');
  });
  document.getElementById('vhamOrder').addEventListener('click', function(){
    window.location.href = withCart('/orders/', cartItems);
  });
  document.getElementById('vhamBooking').addEventListener('click', function(){
    window.location.href = withCart('/bookings/', cartItems);
  });
  document.addEventListener('click', function(){ vhAcctMenu.classList.remove('open'); });
  vhAcctMenu.addEventListener('click', function(e){ e.stopPropagation(); });
  document.getElementById('cartBtn').addEventListener('click', function(){
    if(!cartItems.length){ showToast('购物车是空的'); return; }
    var encoded = cartItems.map(function(it){ return it.id+':'+(it.variant==='trial'?'t':'f')+':'+it.qty; }).join(',');
    window.location.href = '/checkout/?cart=' + encodeURIComponent(encoded);
  });

})();
</script>
<style>

.vh-chat-input-row button{ flex:none; width:36px; height:36px; border-radius:50%; background:var(--forest,#26362B); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
</style>
<div class="vh-chat-fab" id="vhChatFab">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
  <span class="vh-chat-badge" id="vhChatBadge"></span>
</div>
<div class="vh-chat-panel" id="vhChatPanel">
  <div class="vh-chat-hd">
    <div class="vh-chat-hd-title" id="vhChatTitle">在线咨询</div>
    <div class="vh-chat-hd-sub" id="vhChatSub">正在与 龚诗宏医师 对话</div>
    <span class="vh-chat-close" id="vhChatClose"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>
  </div>
  <div class="vh-chat-body" id="vhChatBody"></div>
  <div class="vh-chat-input-row">
    <input type="text" id="vhChatInput" placeholder="输入消息…" maxlength="300">
    <button type="button" id="vhChatSend"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>
<script>
(function(){
  var API_BASE = window.VINATH_API_BASE || 'https://api.vinathtcm.com/api';
  // 聊天消息是任何匿名访客都能提交的内容，管理员打开对话时会看到——不转义就直接拼进innerHTML
  // 的话，访客可以在消息里塞HTML/脚本，在管理员已登录的浏览器里执行（存储型XSS）。
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var CUSTOMER_ID_KEY = 'vinath_customer_chat_id';
  var pollTimer = null;
  var currentThread = null;
  var currentMessages = [];

  function getCustomerId(){
    try {
      var id = localStorage.getItem(CUSTOMER_ID_KEY);
      if(!id){ id = 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem(CUSTOMER_ID_KEY, id); }
      return id;
    } catch(e){ return 'cust_temp'; }
  }
  // 客户端第一次打开聊天面板时调用——后端会自动处理"这个人是不是第一次来"、要不要插入欢迎语，
  // 前端不用再自己判断这些
  async function ensureMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/ensure-thread', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerId: getCustomerId() })
      });
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ console.error('聊天初始化失败:', e); return null; }
  }
  async function refreshMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/threads/' + getCustomerId());
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ return null; }
  }

  function renderMessages(){
    var body = document.getElementById('vhChatBody');
    var sub = document.getElementById('vhChatSub');
    if(!currentThread || !currentMessages.length){
      body.innerHTML = '<div class="vh-chat-empty">您好，有任何问题都可以在这里留言，我们会尽快回复您。</div>';
    } else {
      body.innerHTML = currentMessages.map(function(m){
        return '<div class="vh-chat-msg '+m.from+'">'+escapeHtml(m.text)+'</div>';
      }).join('');
      body.scrollTop = body.scrollHeight;
    }
    if(currentThread) sub.textContent = '正在与 ' + currentThread.assignedToName + ' 对话';
    updateBadge();
  }
  function updateBadge(){
    var badge = document.getElementById('vhChatBadge');
    var panelOpen = document.getElementById('vhChatPanel').classList.contains('open');
    if(currentThread && currentThread.unreadForCustomer && !panelOpen){
      badge.style.display = 'flex'; badge.textContent = '1';
    } else {
      badge.style.display = 'none';
    }
  }

  document.getElementById('vhChatFab').addEventListener('click', async function(){
    var panel = document.getElementById('vhChatPanel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      await ensureMyThread();
      renderMessages();
    }
    updateBadge();
  });
  document.getElementById('vhChatClose').addEventListener('click', function(){
    document.getElementById('vhChatPanel').classList.remove('open');
  });
  async function sendMsg(){
    var input = document.getElementById('vhChatInput');
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    input.disabled = true;
    try {
      await fetch(API_BASE + '/chat/threads/' + getCustomerId() + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      await refreshMyThread();
      renderMessages();
    } catch(e){ console.error('发送失败:', e); }
    input.disabled = false;
    input.focus();
  }
  document.getElementById('vhChatSend').addEventListener('click', sendMsg);
  document.getElementById('vhChatInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendMsg(); });

  // poll for admin replies / handoff changes while the widget is on screen
  pollTimer = setInterval(async function(){
    if(!currentThread) return; // 还没打开过聊天面板，没必要轮询
    await refreshMyThread();
    renderMessages();
  }, 4000);
})();
</script>
