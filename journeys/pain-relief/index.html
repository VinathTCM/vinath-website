<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">VINATH · 旅程</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100vh;
  background:#F7F3EC;
  font-family:"Noto Sans SC","PingFang SC",sans-serif;
  color:#3B2E22;
}

:root{
  --tan:#C9A876;
  --tan-deep:#A07A45;
  --espresso:#3B2E22;
  --espresso-soft:#6E5F4E;
  --clay:#BC6E4E;
  --white-warm:#FFFDF9;
  --cream:#F7F3EC;
  --line:rgba(59,46,34,.10);
  --shadow:rgba(59,46,34,.13);
  --font-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --font-en:"Cormorant Garamond",Georgia,serif;
  --pad: clamp(18px, 4.5vw, 44px);
}

.page{ max-width:960px; margin:0 auto; position:relative; }

/* ---------- header ---------- */
.vh-header{
  display:flex; align-items:center; justify-content:space-between;
  padding: clamp(16px,3vw,24px) var(--pad) clamp(14px,2.5vw,18px);
}
.vh-header .side{ display:flex; align-items:center; gap:10px; min-width:0; }
.vh-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:clamp(24px,4vw,28px); letter-spacing:.15em; color:var(--espresso); white-space:nowrap; cursor:pointer; transition:letter-spacing .3s ease; }
.vh-tm{ font-variant:normal; font-size:.34em; vertical-align:super; opacity:.65; margin-left:1px; }
.vh-footer{ border-top:1px solid var(--line); margin-top:60px; padding:36px var(--pad) 30px; }
.vh-footer-top{ margin-bottom:16px; }
.vh-footer-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:15px; letter-spacing:.12em; color:var(--espresso); }
.vh-footer-bottom{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--espresso-soft); opacity:.8; }
.vh-footer-my{ font-weight:600; letter-spacing:.03em; white-space:nowrap; }
@media (max-width:480px){ .vh-footer-bottom{ flex-direction:column; align-items:flex-start; gap:5px; } }
.vh-brand:hover{ letter-spacing:.26em; }
.vh-icons{ display:flex; gap:18px; flex:none; }
.vh-ibtn{ display:flex; align-items:center; justify-content:center; color:var(--espresso);
  cursor:pointer; transition:opacity .15s, transform .15s; flex:none; position:relative; }
.cart-badge{ position:absolute; top:-7px; right:-9px; background:var(--clay); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
.vh-acct-wrap{ position:relative; display:flex; }
.vh-acct-menu{ position:absolute; top:calc(100% + 12px); right:-6px; background:var(--white-warm); border-radius:14px; box-shadow:0 14px 34px rgba(59,46,34,.18);
  padding:8px; min-width:140px; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:60; }
.vh-acct-menu.open{ opacity:1; pointer-events:auto; }
.vham-item{ padding:11px 14px; font-size:14px; border-radius:9px; cursor:pointer; color:var(--espresso); white-space:nowrap; }
.vham-item:hover{ background:var(--cream); }
.vh-ibtn:hover{ opacity:.65; }
.vh-ibtn:active{ transform:scale(.9); }

/* ---------- hero (static, single image) ---------- */
.breadcrumb{ padding:0 var(--pad) 14px; font-size:13.5px; color:var(--espresso-soft); }
.breadcrumb .bc-link{ color:var(--tan-deep); cursor:pointer; font-weight:600; }
.breadcrumb .bc-link:hover{ text-decoration:underline; }
.breadcrumb .sep{ margin:0 7px; opacity:.5; }
.breadcrumb .bc-current{ color:var(--espresso-soft); }
.hero-wrap{ padding: 0 var(--pad); }
.hero{ position:relative; width:100%; padding-top:66.67%; overflow:hidden; border-radius:20px; background:#DCD3BF; }
.hero img{ position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; object-position:50% 38%; display:block; }
.hero-scrim{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(24,17,10,0) 62%, rgba(24,17,10,.34) 100%); }

/* ---------- content ---------- */
.content{ padding: clamp(32px,5.5vw,48px) var(--pad) clamp(44px,6vw,60px); }
.j-title{ font-family:var(--font-serif); font-weight:700; font-size:clamp(38px,6.8vw,50px); margin:0; line-height:1.18; }
.j-en{ font-family:var(--font-en); font-variant:small-caps; letter-spacing:.28em; font-size:clamp(17px,2.6vw,19px); color:var(--tan-deep); margin:10px 0 24px; }
.j-intro{ font-size:clamp(18.5px,2.4vw,20px); line-height:1.85; color:var(--espresso-soft); margin:0 0 8px; }
.cond-section-note{ font-size:14px; line-height:1.75; color:var(--espresso-soft); background:var(--white-warm); border:1px solid var(--line); border-radius:14px; padding:14px 18px; margin-top:22px; }
.cond-disclaimer{ font-size:12px; line-height:1.8; color:var(--espresso-soft); opacity:.85; border-top:1px solid var(--line); padding-top:18px; margin-top:8px; }

.cond-list{ display:flex; flex-direction:column; margin-top:20px; }
.cond-row{ display:flex; gap:20px; padding:28px 0; border-top:1px solid var(--line); }
.cond-row:last-child{ border-bottom:1px solid var(--line); }
.cond-ico{ flex:none; width:50px; height:50px; border-radius:50%; background:rgba(201,168,118,.14);
  display:flex; align-items:center; justify-content:center; color:var(--clay); }
.cond-text{ max-width:640px; }
.cond-name{ font-family:var(--font-serif); font-weight:700; font-size:clamp(21px,3.1vw,24px); margin:0 0 8px; }
.symptom-tags{ display:flex; flex-wrap:wrap; gap:10px; margin:16px 0 4px; }
.symptom-tag{ font-size:15.5px; font-weight:500; padding:10px 18px; border:1.5px solid var(--tan); border-radius:22px;
  color:var(--tan-deep); background:transparent; cursor:pointer; user-select:none;
  transition:background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease; }
.symptom-tag:active{ transform:scale(.96); }
.symptom-tag.selected{ background:var(--clay); border-color:var(--clay); color:#FFFDF9; }

.cond-cards{ display:flex; flex-wrap:wrap; gap:11px; margin-top:18px; }
.product-slot{ display:contents; }
@keyframes cardIn{ from{ opacity:0; transform:scale(.92) translateY(4px); } to{ opacity:1; transform:scale(1) translateY(0); } }
.product-card{ animation:cardIn .3s ease; }
.mini-card{ display:inline-flex; align-items:center; gap:9px; background:var(--white-warm); border:1px solid var(--line);
  border-radius:13px; padding:12px 17px; cursor:pointer; box-shadow:0 3px 10px var(--shadow);
  transition:transform .15s, box-shadow .15s; font-size:15.5px; font-weight:600; color:var(--espresso); }
.mini-card:active{ transform:scale(.96); box-shadow:0 1px 4px var(--shadow); }
.mini-card .mico{ color:var(--clay); display:flex; }
.mini-card .mchev{ color:var(--tan-deep); display:flex; transition:transform .3s ease; margin-left:1px; }
.mini-card.open .mchev{ transform:rotate(180deg); }

.mini-expand{ max-height:0; overflow:hidden; margin-top:0; width:100%; transition:max-height .35s ease, margin-top .35s ease; }
.mini-expand.open{ max-height:170px; margin-top:11px; }
.mini-expand-item{ display:flex; align-items:center; gap:10px; background:var(--cream); border:1px solid var(--line);
  border-radius:11px; padding:13px 16px; font-size:15px; font-weight:500; cursor:pointer; margin-bottom:9px;
  color:var(--espresso); transition:transform .15s; max-width:320px; text-decoration:none; }
.mini-expand-item:active{ transform:scale(.97); }
.mini-expand-item .eico{ color:var(--clay); flex:none; }

.shop-all{ display:flex; align-items:center; justify-content:center; gap:10px; margin-top:44px;
  padding:18px 20px; border:1.5px solid var(--tan); border-radius:16px; cursor:pointer; color:var(--tan-deep);
  font-family:var(--font-serif); font-weight:700; font-size:17px; transition:background .15s, transform .15s; }
.shop-all:hover{ background:rgba(201,168,118,.08); }
.shop-all:active{ transform:scale(.99); }

.vh-toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px);
  background:rgba(40,31,22,.94); color:#FDF8F0; font-size:16px; padding:12px 20px;
  border-radius:20px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
  z-index:50; max-width:88vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vh-toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>

  };
  // [stated bug fix] this used to seed localStorage once and then NEVER touch it again, so any
  // wording fix I made to the embedded seed (like this note text) would never reach a browser
  // that had already been seeded from an earlier version. Now the seed carries a version number —
  // on load, any of the 6 default journeys that the admin HASN'T customized via 内容管理 gets
  // refreshed from the current file's seed; anything the admin has actually edited (marked
  // `customized`) is left alone, and any journey the admin added beyond the default 6 is untouched.
  var JOURNEYS_SEED_VERSION = 3;
  function getJourneys(){
    var API_BASE = window.VINATH_API_BASE || 'https://api.vinathtcm.com/api';
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', API_BASE + '/site-settings/health_journeys', false); // false = 同步，跟商品详情页用的是同一套稳妥模式
      xhr.send(null);
      if(xhr.status === 200){
        var fromBackend = JSON.parse(xhr.responseText);
        if(fromBackend) return fromBackend;
      }
    } catch(e){ console.error('拉取健康旅程失败，使用本地兜底数据:', e); }
    var fresh = {};
    for(var k in JOURNEYS_SEED){ fresh[k] = JOURNEYS_SEED[k]; }
    fresh.__seedVersion = JOURNEYS_SEED_VERSION;
    return fresh;
  }
  var journeyKey = new URLSearchParams(window.location.search).get('j') || 'pain'; // this file's own default
  var journeys = getJourneys();
  var journeyData = journeys[journeyKey];
  var JOURNEY_NAME = journeyData ? journeyData.name : '';
  if(journeyData){
    CONDITIONS = journeyData.conditions || [];
    document.getElementById('pageTitle').textContent = 'VINATH · ' + journeyData.name;
    document.getElementById('bcCurrent').textContent = journeyData.name;
    document.getElementById('heroImg').src = journeyData.hero || '';
    document.getElementById('heroImg').alt = journeyData.name;
    document.getElementById('jTitle').textContent = journeyData.name;
    document.getElementById('jEn').textContent = journeyData.en || '';
    document.getElementById('jIntro').textContent = journeyData.intro || '';
    document.getElementById('condSectionNote').textContent = journeyData.note || '';
    document.getElementById('shopAllText').textContent = '浏览' + journeyData.name + '相关全部商品';
  } else {
    document.querySelector('.content').innerHTML = '<div class="cond-disclaimer" style="margin-top:40px;">找不到这个旅程——链接可能有误，或者这个旅程还没有在"内容管理"里发布内容。</div>';
    return;
  }


  var selectedTags = {}; // condIdx -> Set of selected tag labels

  function condRow(c, idx){
    var tagsHTML = '<div class="symptom-tags">';
    for(var t=0;t<c.tags.length;t++){
      tagsHTML += '<span class="symptom-tag" data-cond="'+idx+'" data-tag="'+c.tags[t]+'" aria-pressed="false">'+c.tags[t]+'</span>';
    }
    tagsHTML += '</div>';

    var cardsHTML = '<div class="cond-cards">'
      + '<div class="mini-card consult" id="consult-'+idx+'-btn" data-target="consult-'+idx+'-exp">'
      + '<span class="mico">'+ICON.cal+'</span><span>相约</span><span class="mchev">'+ICON.chev+'</span></div>'
      + '</div>';
    cardsHTML += '<div class="mini-expand" id="consult-'+idx+'-exp">'
      + '<a class="mini-expand-item" id="waLink-'+idx+'" data-lbl="个人定制" rel="noopener"><span class="eico">'+ICON.tune+'</span>个人定制</a>'
      + '<div class="mini-expand-item" data-lbl="居家会诊"><span class="eico">'+ICON.home+'</span>居家会诊</div>'
      + '</div>';

    return '<div class="cond-row">'
      + '<div class="cond-ico">'+(ICON[c.icon]||'')+'</div>'
      + '<div class="cond-text"><div class="cond-name">'+c.name+'</div>'
      + tagsHTML
      + cardsHTML
      + '</div></div>';
  }

  var listEl = document.getElementById('condList');
  var html = '';
  for(var i=0;i<CONDITIONS.length;i++){ html += condRow(CONDITIONS[i], i); }
  listEl.innerHTML = html;

  document.querySelectorAll('.symptom-tag').forEach(function(tag){
    tag.addEventListener('click', function(){
      var condIdx = this.getAttribute('data-cond');
      var label = this.getAttribute('data-tag');
      if(!selectedTags[condIdx]) selectedTags[condIdx] = new Set();
      var sel = selectedTags[condIdx];
      var nowSelected;
      if(sel.has(label)){ sel.delete(label); nowSelected = false; }
      else { sel.add(label); nowSelected = true; }
      this.classList.toggle('selected', nowSelected);
      this.setAttribute('aria-pressed', nowSelected ? 'true' : 'false');
      updateWaLink(condIdx);
    });
  });

  document.querySelectorAll('.mini-card.consult').forEach(function(btn){
    btn.addEventListener('click', function(){
      var exp = document.getElementById(this.getAttribute('data-target'));
      var open = exp.classList.toggle('open');
      this.classList.toggle('open', open);
      this.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
  function getWhatsappNumber(){
    try {
      var raw = localStorage.getItem('vinath_business_info');
      if(raw){ var info = JSON.parse(raw); if(info.whatsapp) return info.whatsapp; }
    } catch(e){}
    return '60138092888'; // fallback if 内容管理's 基本信息 tab has never been opened yet
  }
  var WHATSAPP_NUMBER = getWhatsappNumber();
  function updateWaLink(condIdx){
    var link = document.getElementById('waLink-'+condIdx);
    if(!link) return;
    var tags = selectedTags[condIdx] ? Array.from(selectedTags[condIdx]) : [];
    var msg = tags.length
      ? '您好，我想咨询「'+JOURNEY_NAME+'」相关的调理方案，我目前的情况：'+tags.join('、')+'。'
      : '您好，我想咨询「'+JOURNEY_NAME+'」相关的调理方案。';
    link.setAttribute('href', 'https://wa.me/'+WHATSAPP_NUMBER+'?text='+encodeURIComponent(msg));
  }
  for(var wi=0; wi<CONDITIONS.length; wi++){ updateWaLink(wi); }
  document.querySelectorAll('.mini-expand-item').forEach(function(item){
    item.addEventListener('click', function(){
      var lbl = this.getAttribute('data-lbl');
      if(lbl === '个人定制') return; // native <a href> handles navigation now
      if(lbl === '居家会诊'){
        var expId = this.closest('.mini-expand').id;
        var condIdx = expId.match(/consult-(\d+)-exp/)[1];
        var tags = selectedTags[condIdx] ? Array.from(selectedTags[condIdx]) : [];
        var url = '/consult/?journey=' + encodeURIComponent(JOURNEY_NAME) + (tags.length ? '&tags=' + encodeURIComponent(tags.join(',')) : '');
        window.location.href = withCart(url, cartItems);
        return;
      }
      showToast('跳转至「'+lbl+'」页面');
    });
  });

  var toast = document.getElementById('toast');
  var toastTimer=null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }

  function cartFromURL(){
    var raw = new URLSearchParams(window.location.search).get('cart');
    if(!raw) return [];
    return raw.split(',').map(function(chunk){
      var parts = chunk.split(':'); var id = Number(parts[0]);
      return id ? {id:id, variant:(parts[1]==='t'?'trial':'full'), qty:Number(parts[2])||1} : null;
    }).filter(Boolean);
  }
  function cartToParam(items){ return items.map(function(it){ return it.id+':'+(it.variant==='trial'?'t':'f')+':'+it.qty; }).join(','); }
  function withCart(url, items){
    var cartStr = cartToParam(items);
    if(!cartStr) return url;
    var hashIdx = url.indexOf('#');
    var hash = hashIdx === -1 ? '' : url.slice(hashIdx);
    var base = hashIdx === -1 ? url : url.slice(0, hashIdx);
    return base + (base.indexOf('?')===-1 ? '?' : '&') + 'cart=' + encodeURIComponent(cartStr) + hash;
  }
  var cartItems = cartFromURL();
  function updateCartBadge(){
    var total = cartItems.reduce(function(s,it){ return s+it.qty; }, 0);
    var badge = document.getElementById('cartBadge');
    badge.textContent = total;
    badge.style.display = total > 0 ? 'flex' : 'none';
  }
  updateCartBadge();

  document.getElementById('brandBtn').addEventListener('click', function(){ window.location.href = withCart('/', cartItems); });
  document.getElementById('bcHome').addEventListener('click', function(){ window.location.href = withCart('/', cartItems); });
  document.getElementById('searchBtn').addEventListener('click', function(){ showToast('搜索 · 功能开发中'); });
  var vhAcctMenu = document.getElementById('vhAcctMenu');
  document.getElementById('acctBtn').addEventListener('click', function(e){
    e.stopPropagation();
    vhAcctMenu.classList.toggle('open');
  });
  document.getElementById('vhamOrder').addEventListener('click', function(){
    window.location.href = withCart('/orders/', cartItems);
  });
  document.getElementById('vhamBooking').addEventListener('click', function(){
    window.location.href = withCart('/bookings/', cartItems);
  });
  document.addEventListener('click', function(){ vhAcctMenu.classList.remove('open'); });
  vhAcctMenu.addEventListener('click', function(e){ e.stopPropagation(); });
  document.getElementById('cartBtn').addEventListener('click', function(){ window.location.href = withCart('/checkout/', cartItems); });
  document.getElementById('shopAllBtn').addEventListener('click', function(){ window.location.href = withCart('/shop/', cartItems); });
})();
</script>

.vh-chat-fab:hover{ transform:scale(1.06); }
.vh-chat-fab .vh-chat-badge{ position:absolute; top:-3px; right:-3px; background:#C0503A; color:#fff; font-size:10.5px; font-weight:700; min-width:18px; height:18px; border-radius:9px; display:none; align-items:center; justify-content:center; padding:0 4px; }
.vh-chat-panel{ position:fixed; right:22px; bottom:90px; width:328px; max-width:calc(100vw - 44px); height:440px; max-height:calc(100vh - 140px); background:#fff; border-radius:18px; box-shadow:0 20px 50px rgba(32,29,25,.28); z-index:9000; display:none; flex-direction:column; overflow:hidden; font-family:'Noto Sans SC',sans-serif; }
.vh-chat-panel.open{ display:flex; }
.vh-chat-hd{ background:var(--forest,#26362B); color:#fff; padding:14px 16px; flex:none; }
.vh-chat-hd-title{ font-size:14px; font-weight:700; }
.vh-chat-hd-sub{ font-size:11.5px; opacity:.8; margin-top:2px; }
.vh-chat-close{ position:absolute; top:14px; right:14px; cursor:pointer; opacity:.75; }
.vh-chat-body{ flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; background:#FAF7F1; }
.vh-chat-msg{ max-width:78%; padding:9px 12px; border-radius:14px; font-size:13px; line-height:1.5; }
.vh-chat-msg.customer{ align-self:flex-end; background:var(--forest,#26362B); color:#fff; border-bottom-right-radius:4px; }
.vh-chat-msg.admin{ align-self:flex-start; background:#fff; color:#222; border:1px solid #E6E1D6; border-bottom-left-radius:4px; }
.vh-chat-empty{ margin:auto; text-align:center; color:#8a8478; font-size:12.5px; padding:0 20px; line-height:1.7; }
.vh-chat-input-row{ flex:none; display:flex; gap:8px; padding:11px; border-top:1px solid #E6E1D6; background:#fff; }
.vh-chat-input-row input{ flex:1; border:1.5px solid #E6E1D6; border-radius:100px; padding:9px 14px; font-size:13px; font-family:inherit; outline:none; }
.vh-chat-input-row input:focus{ border-color:var(--forest,#26362B); }
.vh-chat-input-row button{ flex:none; width:36px; height:36px; border-radius:50%; background:var(--forest,#26362B); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
</style>
<div class="vh-chat-fab" id="vhChatFab">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
  <span class="vh-chat-badge" id="vhChatBadge"></span>
</div>
<div class="vh-chat-panel" id="vhChatPanel">
  <div class="vh-chat-hd">
    <div class="vh-chat-hd-title" id="vhChatTitle">在线咨询</div>
    <div class="vh-chat-hd-sub" id="vhChatSub">正在与 龚诗宏医师 对话</div>
    <span class="vh-chat-close" id="vhChatClose"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>
  </div>
  <div class="vh-chat-body" id="vhChatBody"></div>
  <div class="vh-chat-input-row">
    <input type="text" id="vhChatInput" placeholder="输入消息…" maxlength="300">
    <button type="button" id="vhChatSend"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>
<script>
(function(){
  var API_BASE = window.VINATH_API_BASE || 'https://api.vinathtcm.com/api';
  // 聊天消息是任何匿名访客都能提交的内容，管理员打开对话时会看到——不转义就直接拼进innerHTML
  // 的话，访客可以在消息里塞HTML/脚本，在管理员已登录的浏览器里执行（存储型XSS）。
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var CUSTOMER_ID_KEY = 'vinath_customer_chat_id';
  var pollTimer = null;
  var currentThread = null;
  var currentMessages = [];

  function getCustomerId(){
    try {
      var id = localStorage.getItem(CUSTOMER_ID_KEY);
      if(!id){ id = 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem(CUSTOMER_ID_KEY, id); }
      return id;
    } catch(e){ return 'cust_temp'; }
  }
  // 客户端第一次打开聊天面板时调用——后端会自动处理"这个人是不是第一次来"、要不要插入欢迎语，
  // 前端不用再自己判断这些
  async function ensureMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/ensure-thread', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerId: getCustomerId() })
      });
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ console.error('聊天初始化失败:', e); return null; }
  }
  async function refreshMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/threads/' + getCustomerId());
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ return null; }
  }

  function renderMessages(){
    var body = document.getElementById('vhChatBody');
    var sub = document.getElementById('vhChatSub');
    if(!currentThread || !currentMessages.length){
      body.innerHTML = '<div class="vh-chat-empty">您好，有任何问题都可以在这里留言，我们会尽快回复您。</div>';
    } else {
      body.innerHTML = currentMessages.map(function(m){
        return '<div class="vh-chat-msg '+m.from+'">'+escapeHtml(m.text)+'</div>';
      }).join('');
      body.scrollTop = body.scrollHeight;
    }
    if(currentThread) sub.textContent = '正在与 ' + currentThread.assignedToName + ' 对话';
    updateBadge();
  }
  function updateBadge(){
    var badge = document.getElementById('vhChatBadge');
    var panelOpen = document.getElementById('vhChatPanel').classList.contains('open');
    if(currentThread && currentThread.unreadForCustomer && !panelOpen){
      badge.style.display = 'flex'; badge.textContent = '1';
    } else {
      badge.style.display = 'none';
    }
  }

  document.getElementById('vhChatFab').addEventListener('click', async function(){
    var panel = document.getElementById('vhChatPanel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      await ensureMyThread();
      renderMessages();
    }
    updateBadge();
  });
  document.getElementById('vhChatClose').addEventListener('click', function(){
    document.getElementById('vhChatPanel').classList.remove('open');
  });
  async function sendMsg(){
    var input = document.getElementById('vhChatInput');
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    input.disabled = true;
    try {
      await fetch(API_BASE + '/chat/threads/' + getCustomerId() + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      await refreshMyThread();
      renderMessages();
    } catch(e){ console.error('发送失败:', e); }
    input.disabled = false;
    input.focus();
  }
  document.getElementById('vhChatSend').addEventListener('click', sendMsg);
  document.getElementById('vhChatInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendMsg(); });

  // poll for admin replies / handoff changes while the widget is on screen
  pollTimer = setInterval(async function(){
    if(!currentThread) return; // 还没打开过聊天面板，没必要轮询
    await refreshMyThread();
    renderMessages();
  }, 4000);
})();
</script>

</body>
</html>
