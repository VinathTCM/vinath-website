<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINATH · 结算</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100vh; background:#F7F3EC; font-family:"Noto Sans SC","PingFang SC",sans-serif; color:#3B2E22; }

:root{
  --tan:#C9A876; --tan-deep:#A07A45; --espresso:#3B2E22; --espresso-soft:#6E5F4E;
  --clay:#BC6E4E; --white-warm:#FFFDF9; --cream:#F7F3EC; --line:rgba(59,46,34,.10); --shadow:rgba(59,46,34,.13);
  --amber:#B8863C; --amber-soft:rgba(184,134,60,.13);
  --font-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --font-en:"Cormorant Garamond",Georgia,serif;
  --pad: clamp(18px, 4.5vw, 44px);
}

.page{ max-width:760px; margin:0 auto; position:relative; }

.vh-header{ display:flex; align-items:center; justify-content:space-between; padding: clamp(16px,3vw,24px) var(--pad) clamp(14px,2.5vw,18px); }
.vh-header .side{ display:flex; align-items:center; gap:10px; min-width:0; }
.vh-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:clamp(24px,4vw,28px); letter-spacing:.15em; color:var(--espresso); white-space:nowrap; cursor:pointer; transition:letter-spacing .3s ease; }
.vh-tm{ font-variant:normal; font-size:.34em; vertical-align:super; opacity:.65; margin-left:1px; }
.vh-footer{ border-top:1px solid var(--line); margin-top:60px; padding:36px var(--pad) 30px; }
.vh-footer-top{ margin-bottom:16px; }
.vh-footer-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:15px; letter-spacing:.12em; color:var(--espresso); }
.vh-footer-bottom{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--espresso-soft); opacity:.8; }
.vh-footer-my{ font-weight:600; letter-spacing:.03em; white-space:nowrap; }
@media (max-width:480px){ .vh-footer-bottom{ flex-direction:column; align-items:flex-start; gap:5px; } }
.vh-brand:hover{ letter-spacing:.26em; }
.vh-icons{ display:flex; gap:18px; flex:none; }
.vh-ibtn{ display:flex; align-items:center; justify-content:center; color:var(--espresso); cursor:pointer; transition:opacity .15s, transform .15s; flex:none; position:relative; }
.vh-ibtn:hover{ opacity:.65; } .vh-ibtn:active{ transform:scale(.9); }
.cart-badge{ position:absolute; top:-7px; right:-9px; background:var(--clay); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
.vh-acct-wrap{ position:relative; display:flex; }
.vh-acct-menu{ position:absolute; top:calc(100% + 12px); right:-6px; background:var(--white-warm); border-radius:14px; box-shadow:0 14px 34px rgba(59,46,34,.18);
  padding:8px; min-width:140px; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:60; }
.vh-acct-menu.open{ opacity:1; pointer-events:auto; }
.vham-item{ padding:11px 14px; font-size:14px; border-radius:9px; cursor:pointer; color:var(--espresso); white-space:nowrap; }
.vham-item:hover{ background:var(--cream); }

.breadcrumb{ padding:0 var(--pad) 14px; font-size:13.5px; color:var(--espresso-soft); }
.breadcrumb .bc-link{ color:var(--tan-deep); cursor:pointer; font-weight:600; }
.breadcrumb .bc-link:hover{ text-decoration:underline; }
.breadcrumb .sep{ margin:0 7px; opacity:.5; }
.breadcrumb .bc-current{ color:var(--espresso-soft); }

.content{ padding: 4px var(--pad) clamp(48px,6vw,64px); }
.co-title{ font-family:var(--font-serif); font-weight:700; font-size:clamp(28px,5vw,34px); margin:6px 0 22px; }

/* ---- empty state ---- */
.empty-state{ text-align:center; padding:80px 20px; }
.empty-state svg{ color:var(--tan); margin-bottom:16px; }
.empty-state p{ color:var(--espresso-soft); font-size:15px; margin-bottom:22px; }
.empty-btn{ display:inline-block; background:var(--espresso); color:#fff; border:none; padding:13px 26px; border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer; }

/* ---- select-all row ---- */
.select-all-row{ display:flex; align-items:center; gap:10px; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--line); font-size:14px; font-weight:600; color:var(--espresso-soft); }

/* ---- cart item ---- */
.cart-item{ display:flex; gap:13px; align-items:flex-start; padding:16px 0; border-bottom:1px solid var(--line); }
.item-check{ flex:none; margin-top:24px; }
.item-thumb{ flex:none; width:64px; height:64px; border-radius:12px; overflow:hidden; position:relative; background:linear-gradient(135deg,#F3EFE6,#EAE2D2); }
.item-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.item-thumb .pt-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--tan-deep); }
.item-thumb .pt-icon svg{ width:44%; height:44%; }
.item-body{ flex:1; min-width:0; }
.item-top{ display:flex; justify-content:space-between; gap:10px; }
.item-name{ font-family:var(--font-serif); font-weight:700; font-size:16px; }
.item-remove{ font-size:12.5px; color:var(--espresso-soft); cursor:pointer; flex:none; white-space:nowrap; }
.item-remove:hover{ color:var(--clay); }
.item-variant{ font-size:12.5px; color:var(--espresso-soft); margin-top:2px; }
.item-oos{ font-size:12px; color:var(--clay); margin-top:4px; font-weight:600; }
.item-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:11px; }
.item-stepper{ display:flex; align-items:center; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; }
.item-step-btn{ width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--espresso); font-size:14px; background:var(--white-warm); user-select:none; }
.item-qty-num{ width:30px; text-align:center; font-weight:700; font-size:13.5px; }
.item-price{ font-family:var(--font-serif); font-weight:700; font-size:16px; }
.item-checkbox{ width:19px; height:19px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; transition:.15s; background:#fff; }
.item-checkbox.on{ background:var(--clay); border-color:var(--clay); }
.item-checkbox svg{ opacity:0; transition:opacity .1s; }
.item-checkbox.on svg{ opacity:1; }
.cart-item.excluded{ opacity:.5; }

/* ---- summary ---- */
.summary-card{ background:var(--white-warm); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-top:22px; }
.summary-row{ display:flex; justify-content:space-between; font-size:14px; color:var(--espresso-soft); padding:4px 0; }
.coupon-row{ display:flex; gap:8px; margin-bottom:12px; }
.coupon-row input{ flex:1; min-width:0; padding:10px 13px; border:1.5px solid var(--line); border-radius:10px; font-size:13.5px; font-family:inherit; text-transform:uppercase; }
.coupon-row button{ flex:none; background:var(--espresso); color:#fff; border:none; border-radius:10px; padding:0 16px; font-size:13px; font-weight:600; cursor:pointer; }
.coupon-error{ font-size:12px; color:#B0503A; margin:-6px 0 8px; min-height:1px; }
.coupon-applied{ display:flex; justify-content:space-between; align-items:center; width:100%; background:var(--cream); border-radius:10px; padding:10px 13px; font-size:13px; }
.coupon-applied b{ color:var(--clay); }
.coupon-remove{ color:var(--espresso-soft); text-decoration:underline; cursor:pointer; font-size:12px; flex:none; }
.coupon-discount-row{ color:var(--clay); font-weight:600; }
.item-price-orig{ text-decoration:line-through; opacity:.55; margin-right:4px; }
.summary-row.total{ font-size:17px; font-weight:700; color:var(--espresso); padding-top:11px; margin-top:7px; border-top:1px solid var(--line); }
.summary-row.total .sr-price{ font-family:var(--font-serif); }

/* ---- disclaimer ---- */
.contact-field{ margin-top:16px; }
.contact-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--espresso-soft); margin-bottom:7px; }
.contact-field input{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:14.5px; font-family:inherit; color:var(--espresso); background:var(--white-warm); }
.contact-field input:focus{ outline:none; border-color:var(--clay); }
.contact-mode-tabs{ display:flex; gap:8px; margin-bottom:10px; }
.cm-tab{ font-size:12.5px; font-weight:700; padding:6px 14px; border-radius:14px; border:1.5px solid var(--line); color:var(--espresso-soft); cursor:pointer; }
.cm-tab.on{ border-color:var(--clay); background:rgba(188,110,78,.08); color:var(--clay); }
.phone-input-row{ display:flex; align-items:stretch; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; background:var(--white-warm); }
.phone-input-row:focus-within{ border-color:var(--clay); }
.phone-prefix{ display:flex; align-items:center; padding:0 12px; font-size:14.5px; font-weight:700; color:var(--espresso-soft); background:var(--line); flex:none; }
.phone-input-row input{ border:none; background:transparent; flex:1; padding:12px 14px; font-size:14.5px; font-family:inherit; color:var(--espresso); min-width:0; }
.phone-input-row input:focus{ outline:none; }
.field-error{ font-size:12px; color:var(--clay); margin-top:6px; display:none; }
.field-error.show{ display:block; }

.addr-field{ margin-top:16px; }
.addr-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--espresso-soft); margin-bottom:7px; }
.addr-form input, .addr-form select{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:14.5px; font-family:inherit; color:var(--espresso); background:var(--white-warm); margin-bottom:10px; }
.addr-form input:focus, .addr-form select:focus{ outline:none; border-color:var(--clay); }
.addr-form .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.addr-form .two-col input{ margin-bottom:0; }
.remember-row{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--espresso-soft); cursor:pointer; margin-top:2px; }
.saved-addr-card{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; background:var(--white-warm); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
.sa-text{ font-size:13.5px; line-height:1.7; color:var(--espresso-soft); }
.sa-text b{ color:var(--espresso); }
.sa-tag{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(184,134,60,.15); color:var(--amber); margin-left:4px; }
.sa-tag.west{ background:rgba(140,155,122,.18); color:var(--sage); }
.sa-edit{ flex:none; font-size:13px; color:var(--tan-deep); font-weight:600; cursor:pointer; }
.sa-edit:hover{ text-decoration:underline; }

.os-addr-card{ text-align:left; margin-top:10px; }
.os-addr-label{ font-size:11.5px; font-weight:700; color:var(--espresso-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.os-addr-text{ font-size:13.5px; color:var(--espresso); line-height:1.7; }

.disclaimer-card{ display:flex; gap:12px; background:var(--white-warm); border:1.5px dashed var(--tan); border-radius:16px; padding:18px 20px; margin-top:18px; }
.disc-checkbox{ width:20px; height:20px; border:1.5px solid var(--line); border-radius:6px; cursor:pointer; flex:none; margin-top:1px; display:flex; align-items:center; justify-content:center; transition:.15s; background:#fff; }
.disc-checkbox.on{ background:var(--clay); border-color:var(--clay); }
.disc-checkbox svg{ opacity:0; transition:opacity .1s; }
.disc-checkbox.on svg{ opacity:1; }
.disc-text{ font-size:12.5px; line-height:1.85; color:var(--espresso-soft); }
.disc-text b{ color:var(--espresso); }

.checkout-btn{ width:100%; background:var(--espresso); color:#fff; border:none; padding:16px; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; margin-top:20px; transition:opacity .15s; }
.checkout-btn:disabled{ opacity:.35; cursor:not-allowed; }
.checkout-hint{ text-align:center; font-size:12px; color:var(--espresso-soft); margin-top:10px; }

.payment-view{ padding-top:6px; }
.pay-summary{ display:flex; justify-content:space-between; align-items:baseline; background:var(--white-warm); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:22px; font-size:14px; color:var(--espresso-soft); font-weight:600; }
.pay-total{ font-family:var(--font-serif); font-weight:700; font-size:22px; color:var(--espresso); }
.pay-methods{ margin-bottom:20px; }
.pay-method{ display:flex; align-items:center; gap:14px; border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:.15s; }
.pay-method.on{ border-color:var(--clay); background:rgba(188,110,78,.06); }
.pm-icon{ flex:none; color:var(--tan-deep); display:flex; }
.pm-text{ flex:1; }
.pm-label{ font-weight:700; font-size:14.5px; }
.pm-sub{ font-size:12px; color:var(--espresso-soft); margin-top:2px; }
.pm-radio{ flex:none; width:19px; height:19px; border-radius:50%; border:1.5px solid var(--line); position:relative; }
.pay-method.on .pm-radio{ border-color:var(--clay); }
.pay-method.on .pm-radio::after{ content:''; position:absolute; inset:3px; border-radius:50%; background:var(--clay); }
.pay-form-area{ margin-bottom:6px; }
.pay-field{ margin-bottom:14px; }
.pay-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--espresso-soft); margin-bottom:6px; }
.pay-field input{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; font-size:14.5px; font-family:inherit; color:var(--espresso); background:var(--white-warm); }
.pay-field input:focus{ outline:none; border-color:var(--clay); }
.pay-field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.pay-qr-box{ display:flex; justify-content:center; padding:20px; background:var(--white-warm); border:1px solid var(--line); border-radius:16px; margin-bottom:14px; }
.pay-bank-detail{ background:var(--white-warm); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:14px; }
.pbd-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
.pbd-row:last-child{ border-bottom:none; }
.pbd-l{ color:var(--ink-soft,#7A6F60); }
.pbd-v{ font-weight:700; }
.pay-screenshot-box{ border:1.5px dashed var(--line); border-radius:14px; min-height:120px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft,#7A6F60); font-size:13.5px; overflow:hidden; }
.pay-screenshot-box img{ width:100%; max-height:280px; object-fit:contain; }

.order-consent-overlay{ display:none; position:fixed; inset:0; background:rgba(59,46,34,.45); z-index:400; align-items:center; justify-content:center; padding:20px; }
.order-consent-overlay.show{ display:flex; }
.order-consent-box{ background:var(--white-warm); border-radius:20px; padding:30px 28px; max-width:420px; width:100%; }
.oc-title{ font-family:var(--font-serif); font-size:19px; font-weight:700; margin-bottom:14px; }
.oc-text{ font-size:14px; line-height:1.75; color:var(--espresso-soft); text-align:justify; text-justify:inter-ideograph; }
.oc-text a{ color:var(--clay); font-weight:700; }
.oc-check-row{ display:flex; align-items:flex-start; gap:9px; margin:18px 0 4px; cursor:pointer; font-size:13.5px; }
.oc-check-row input{ margin-top:3px; flex:none; width:16px; height:16px; }
.oc-error{ color:var(--clay); font-size:12.5px; display:none; margin-bottom:8px; }
.oc-error.show{ display:block; }
.oc-cancel{ text-align:center; margin-top:12px; font-size:13.5px; color:var(--espresso-soft); cursor:pointer; text-decoration:underline; }

.pay-qr-hint{ text-align:center; font-size:13px; color:var(--espresso-soft); margin-bottom:6px; line-height:1.7; }

.order-success{ text-align:center; padding:24px 0 10px; }
.os-icon{ width:56px; height:56px; border-radius:50%; background:rgba(184,134,60,.12); color:var(--amber); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.os-title{ font-family:var(--font-serif); font-weight:700; font-size:24px; margin-bottom:8px; }
.os-sub{ font-size:14px; color:var(--espresso-soft); margin-bottom:18px; }
.os-order-no{ font-size:14px; color:var(--espresso-soft); margin-bottom:22px; }
.os-order-no b{ color:var(--espresso); font-family:var(--font-serif); letter-spacing:.03em; }
.os-summary-card{ background:var(--white-warm); border:1px solid var(--line); border-radius:16px; padding:16px 20px; text-align:left; margin-bottom:8px; }
.os-item{ display:flex; justify-content:space-between; font-size:14px; color:var(--espresso-soft); padding:6px 0; }
.os-item.total{ font-weight:700; color:var(--espresso); border-top:1px solid var(--line); margin-top:6px; padding-top:12px; font-size:16px; }
.os-back{ font-size:13px; color:var(--tan-deep); font-weight:600; cursor:pointer; margin-top:16px; }
.os-back:hover{ text-decoration:underline; }

.vh-toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px); background:rgba(40,31,22,.94); color:#FDF8F0; font-size:15px; padding:11px 20px;
  border-radius:20px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:70; max-width:88vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vh-toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

<div class="page">
  <div class="vh-header">
    <div class="side">
      <div class="vh-brand" id="brandBtn">VINATH<span class="vh-tm">™</span></div>
    </div>
    <div class="vh-icons">
      <div class="vh-ibtn" id="searchBtn" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10.3" cy="10.3" r="6.3"/><line x1="19.5" y1="19.5" x2="15" y2="15"/></svg>
      </div>
      <span class="vh-acct-wrap">
        <div class="vh-ibtn" id="acctBtn" aria-label="查询">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.3"/><path d="M5 19.5c1.2-3.8 3.9-5.7 7-5.7s5.8 1.9 7 5.7"/></svg>
        </div>
        <div class="vh-acct-menu" id="vhAcctMenu">
          <div class="vham-item" id="vhamOrder">查询订单</div>
          <div class="vham-item" id="vhamBooking">查询预约</div>
        </div>
      </span>
      <div class="vh-ibtn" id="cartBtn" aria-label="购物包">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
      </div>
    </div>
  </div>

  <div class="breadcrumb"><span class="bc-link" id="bcHome">首页</span><span class="sep">›</span><span class="bc-link" id="bcShop">商店</span><span class="sep">›</span><span class="bc-current">结算</span></div>

  <div class="content">
    <h1 class="co-title">结算</h1>
    <div id="mainArea"></div>
  </div>
</div>

<div class="order-consent-overlay" id="orderConsentModal">
  <div class="order-consent-box">
    <div class="oc-title">提交前，请确认</div>
    <div class="oc-text">我同意本服务收集我的姓名、手机号码与收货地址，如通过银行转账/DuitNow付款还包括我上传的付款截图，这些信息仅用于处理及配送本次订单、核对付款，不会用作广告推销，不会对外泄露。详细说明请见<a href="VINATH_政策页面.html#privacy" target="_blank">隐私政策</a>。</div>
    <label class="oc-check-row">
      <input type="checkbox" id="orderConsentCheckbox">
      <span>我已阅读并同意以上内容</span>
    </label>
    <div class="oc-error" id="orderConsentError">请先勾选同意，才能继续提交</div>
    <button type="button" class="checkout-btn" id="orderConsentAgreeBtn">同意并继续</button>
    <div class="oc-cancel" id="orderConsentCancelBtn">取消</div>
  </div>
</div>

<div class="vh-footer">
  <div class="vh-footer-top">
    <div class="vh-footer-brand">VINATH<span class="vh-tm">™</span></div>
  </div>
  <div class="vh-footer-bottom">
    <span>Copyright &copy; 2026 VINATH TCM HEALTH CARE. All rights reserved.</span>
    <span class="vh-footer-my">Malaysia</span>
  </div>
</div>

<div class="vh-toast" id="toast"></div>

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

  function parseCart(){
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('cart');
    var idList;
    if(raw){
      idList = raw.split(',').map(function(chunk){
        var parts = chunk.split(':');
        if(parts.length !== 3) return null;
        return {id:parts[0], variant:(parts[1]==='t'?'trial':'full'), qty:Math.max(1, Number(parts[2])||1)};
      }).filter(Boolean);
    } else {
      // no cart in the URL (e.g. this page opened directly rather than clicked through from 商店) —
      // fall back to whatever was last saved there, so testing/using this page standalone still works
      idList = cartIdsFromStorage();
    }
    var items = [];
    idList.forEach(function(entry){
      var product = PRODUCTS_BY_ID[entry.id];
      if(!product) return;
      items.push({product:product, variant:entry.variant, qty:entry.qty, checked:true});
    });

    if(confirmBtn){ confirmBtn.disabled = true; confirmBtn.textContent = '提交中…'; }
    try {
      var res = await fetch(API_BASE + '/orders', {
        method: 'POST',

          phone: pendingOrder.contact, name: addr.name, address: addr.line,
          city: addr.city, postcode: addr.postcode,
          state: stateInfo ? stateInfo.name : addr.state, region: stateInfo ? stateInfo.region : 'west',

      render();
    } catch(e){
      console.error(e);
      showToast('连不上服务器，请检查网络后重试');
      if(confirmBtn){ confirmBtn.disabled = false; confirmBtn.textContent = '提交付款凭证 · MYR '+pendingOrder.total; }
    }
  }

  function renderPayment(){
    var methods = getActivePaymentMethods();
    if(!methods.length){
      document.getElementById('mainArea').innerHTML = '<div class="payment-view">'
        + '<div class="pay-summary">应付金额<span class="pay-total">MYR '+pendingOrder.total+'</span></div>'
        + '<div class="empty-state" style="padding:30px 0;">暂时还没有可用的付款方式，请通过「相约」联系我们完成付款安排。</div>'
        + '<div class="os-back" id="backToCartBtn">← 返回购物车</div></div>';
      document.getElementById('backToCartBtn').addEventListener('click', function(){ pendingOrder = null; render(); });
      return;
    }
    selectedPaymentMethodId = selectedPaymentMethodId || methods[0].id;
    paymentScreenshotData = null;
    var html = '<div class="payment-view">'
      + '<div class="pay-summary">应付金额<span class="pay-total">MYR '+pendingOrder.total+'</span></div>'
      + '<div class="pay-methods">';
    methods.forEach(function(m){
      var label = m.type==='bank_transfer' ? '银行转账' : m.type==='duitnow' ? 'DuitNow' : (m.accountName || '其他方式');
      var sub = m.type==='bank_transfer' ? m.bankName : m.type==='duitnow' ? (m.accountName || '扫码支付') : '点击查看付款方式';
      var icon = m.type==='bank_transfer'
        ? '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="19" height="12" rx="1.5"/><path d="M2.5 8l9.5-5 9.5 5"/><line x1="6" y1="12" x2="6" y2="16"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="18" y1="12" x2="18" y2="16"/></svg>'
        : '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/></svg>';
      html += '<div class="pay-method'+(selectedPaymentMethodId===m.id?' on':'')+'" data-m="'+m.id+'">'
        + '<span class="pm-icon">'+icon+'</span>'
        + '<div class="pm-text"><div class="pm-label">'+label+'</div><div class="pm-sub">'+sub+'</div></div>'
        + '<span class="pm-radio"></span></div>';
    });
    html += '</div><div id="paymentFormArea" class="pay-form-area"></div>'
      + '<button class="checkout-btn" id="confirmPayBtn" disabled>提交付款凭证 · MYR '+pendingOrder.total+'</button>'
      + '<div style="font-size:12px;color:var(--ink-soft,#7A6F60);text-align:center;margin-top:10px;">提交后订单会标记为"待核实付款"，我们核对到账后会尽快为您安排发货</div>'
      + '<div class="os-back" id="backToCartBtn">← 返回购物车</div>'
      + '</div>';
    document.getElementById('mainArea').innerHTML = html;
    renderPaymentForm();

    document.querySelectorAll('.pay-method').forEach(function(el){
      el.addEventListener('click', function(){
        selectedPaymentMethodId = this.getAttribute('data-m');
        paymentScreenshotData = null;
        document.querySelectorAll('.pay-method').forEach(function(x){ x.classList.remove('on'); });
        this.classList.add('on');
        renderPaymentForm();
      });
    });
    document.getElementById('confirmPayBtn').addEventListener('click', function(){
      if(!paymentScreenshotData) return;
      openOrderConsentModal(function(){
        finalizeOrderSubmission(methods);
      });
    });
    document.getElementById('backToCartBtn').addEventListener('click', function(){
      pendingOrder = null;
      render();
    });
  }

  function renderOrderSuccess(){
    var addr = completedOrder.address;
    var st = addr ? STATE_BY_CODE[addr.state] : null;
    var html = '<div class="order-success">'
      + '<div class="os-icon"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></div>'
      + '<div class="os-title">订单提交成功</div>'
      + '<div class="os-sub">感谢您的选购，我们会尽快为您安排发货</div>'
      + '<div class="os-order-no">订单号 <b>'+completedOrder.orderNo+'</b></div>'
      + '<div class="os-summary-card">';
    completedOrder.items.forEach(function(it){
      html += '<div class="os-item"><span>'+it.product.name+' × '+it.qty+'</span><span>MYR '+(unitPrice(it)*it.qty)+'</span></div>';
    });
    html += '<div class="os-item"><span>运费'+(st?'（'+(st.region==='east'?'东马':'西马')+'）':'')+'</span><span>MYR '+(completedOrder.shipping||0)+'</span></div>';
    html += '<div class="os-item total"><span>合计</span><span>MYR '+completedOrder.total+'</span></div>'
      + '</div>';
    if(addr && st){
      html += '<div class="os-summary-card os-addr-card"><div class="os-addr-label">收货地址</div>'
        + '<div class="os-addr-text">'+addr.name+' · '+addr.line+'，'+addr.city+' '+addr.postcode+'，'+st.name+'</div></div>';
    }
    html += '<button class="checkout-btn" id="trackOrderBtn">查询订单状态</button>'
      + '<div class="os-back" id="backToShopBtn">继续逛逛 →</div>'
      + '</div>';
    document.getElementById('mainArea').innerHTML = html;
    document.getElementById('trackOrderBtn').addEventListener('click', function(){
      var itemsEncoded = completedOrder.items.map(function(it){ return it.product.id+':'+(it.variant==='trial'?'t':'f')+':'+it.qty; }).join(',');
      var url = 'VINATH_订单查询.html?order=' + completedOrder.orderNo + '&items=' + encodeURIComponent(itemsEncoded) + '&demo=1';
      window.location.href = url;
    });
    document.getElementById('backToShopBtn').addEventListener('click', function(){ window.location.href = 'VINATH_商店.html'; });
    cart = [];
    updateCartBadge();
  }

  function render(){
    saveCartIdsToStorage(cart);
    var titleEl = document.querySelector('.co-title');
    if(completedOrder){ titleEl.textContent = '订单完成'; renderOrderSuccess(); return; }
    if(pendingOrder){ titleEl.textContent = '支付'; renderPayment(); return; }
    titleEl.textContent = '结算';
    if(!cart.length){ renderEmpty(); updateCartBadge(); return; }

    var allChecked = cart.every(function(it){ return it.checked; });
    var html = '<div class="select-all-row">'
      + '<span class="item-checkbox'+(allChecked?' on':'')+'" id="selectAllBox">'+CHECK_SVG+'</span>'
      + '<span>全选（'+cart.length+' 件商品）</span></div>';

    cart.forEach(function(item, idx){
      var p = item.product;
      var hasImg = p.imgs && p.imgs[0];
      var oos = !p.inStock ? '<div class="item-oos">暂时缺货，无法结算此项</div>' : '';
      var origPrice = unitPrice(item);
      var effPrice = effectiveUnitPrice(item);
      var priceHtml = effPrice < origPrice
        ? '<span class="item-price-orig">MYR '+origPrice+'</span> MYR '+effPrice
        : 'MYR '+origPrice;
      html += '<div class="cart-item'+(item.checked?'':' excluded')+'" data-idx="'+idx+'">'
        + '<span class="item-checkbox'+(item.checked?' on':'')+'" data-check="'+idx+'">'+CHECK_SVG+'</span>'
        + '<div class="item-thumb">' + (hasImg ? '<img src="'+p.imgs[0]+'" alt="'+p.name+'">' : '<div class="pt-icon">'+ICON[p.type]+'</div>') + '</div>'
        + '<div class="item-body">'
          + '<div class="item-top"><div class="item-name">'+p.name+'</div><span class="item-remove" data-remove="'+idx+'">移除</span></div>'
          + '<div class="item-variant">'+variantLabel(item)+' · '+priceHtml+' / 件</div>'
          + oos
          + '<div class="item-bottom">'
            + '<div class="item-stepper"><div class="item-step-btn" data-minus="'+idx+'">－</div><div class="item-qty-num">'+item.qty+'</div><div class="item-step-btn" data-plus="'+idx+'">＋</div></div>'
            + '<div class="item-price">MYR '+(effPrice*item.qty)+'</div>'
          + '</div>'
        + '</div></div>';
    });

    var checkedItems = cart.filter(function(it){ return it.checked && it.product.inStock; });
    var subtotal = checkedItems.reduce(function(s,it){ return s+effectiveUnitPrice(it)*it.qty; }, 0);
    var origSubtotal = checkedItems.reduce(function(s,it){ return s+unitPrice(it)*it.qty; }, 0);
    var checkedCount = checkedItems.reduce(function(s,it){ return s+it.qty; }, 0);
    var ship = shippingFee();
    var grandTotal = subtotal + ship;
    var couponSavings = origSubtotal - subtotal;

    html += '<div class="summary-card">'
      + '<div class="coupon-row">'
      + (appliedCoupon
          ? '<div class="coupon-applied"><span>已使用优惠码 <b>'+appliedCoupon.code+'</b>（'+appliedCoupon.name+'）</span><span class="coupon-remove" id="couponRemoveBtn">移除</span></div>'
          : '<input type="text" id="couponInput" placeholder="输入优惠码"><button type="button" id="couponApplyBtn">使用</button>')
      + '</div>'
      + '<div class="coupon-error" id="couponError"></div>'
      + '<div class="summary-row"><span>已选商品</span><span>'+checkedCount+' 件</span></div>'
      + (couponSavings > 0 ? '<div class="summary-row coupon-discount-row"><span>优惠码折扣</span><span>− MYR '+couponSavings.toFixed(2)+'</span></div>' : '')
      + '<div class="summary-row"><span>运费</span><span>'+(addressForm.state ? 'MYR '+ship : '请选择地址') +'</span></div>'
      + '<div class="summary-row total"><span>合计</span><span class="sr-price">MYR '+grandTotal.toFixed(2)+'</span></div>'
      + '</div>';

    // ---- shipping address ----
    html += '<div class="addr-field"><label>收货地址</label>';
    if(!editingAddress && isAddressComplete()){
      var st = STATE_BY_CODE[addressForm.state];
      html += '<div class="saved-addr-card">'
        + '<div class="sa-text"><b>'+addressForm.name+'</b><br>'+addressForm.line+'，'+addressForm.city+' '+addressForm.postcode+'，'+st.name+(st.region==='east'?' <span class="sa-tag">东马</span>':' <span class="sa-tag west">西马</span>')+'</div>'
        + '<span class="sa-edit" id="editAddrBtn">编辑</span>'
        + '</div>';
    } else {
      html += '<div class="addr-form">'
        + '<input type="text" id="addrName" placeholder="收件人姓名" value="'+addressForm.name+'">'
        + '<input type="text" id="addrLine" placeholder="详细地址（门牌号、街道）" value="'+addressForm.line+'">'
        + '<div class="two-col">'
          + '<input type="text" id="addrCity" placeholder="城市" value="'+addressForm.city+'">'
          + '<input type="text" id="addrPostcode" placeholder="邮政编码" maxlength="5" value="'+addressForm.postcode+'">'
        + '</div>'
        + '<select id="addrState">'
          + '<option value="">选择州属</option>'
          + '<optgroup label="西马 Peninsular">'
          + MY_STATES.filter(function(s){ return s.region==='west'; }).map(function(s){ return '<option value="'+s.code+'"'+(addressForm.state===s.code?' selected':'')+'>'+s.name+'</option>'; }).join('')
          + '</optgroup>'
          + '<optgroup label="东马 East Malaysia">'
          + MY_STATES.filter(function(s){ return s.region==='east'; }).map(function(s){ return '<option value="'+s.code+'"'+(addressForm.state===s.code?' selected':'')+'>'+s.name+'</option>'; }).join('')
          + '</optgroup>'
          + '</select>'
        + '<label class="remember-row"><span class="item-checkbox'+(rememberAddr?' on':'')+'" id="rememberBox">'+CHECK_SVG+'</span>记住此地址，下次自动填写</label>'
        + '</div>';
    }
    html += '</div>';

    // ---- contact ----
    html += '<div class="contact-field">'
      + '<label>联系方式</label>'
      + '<div class="contact-mode-tabs">'
        + '<span class="cm-tab'+(contactMode==='phone'?' on':'')+'" data-mode="phone">手机号</span>'
        + '<span class="cm-tab'+(contactMode==='email'?' on':'')+'" data-mode="email">邮箱</span>'
      + '</div>';
    if(contactMode === 'phone'){
      html += '<div class="phone-input-row"><span class="phone-prefix">+60</span><input type="text" id="contactInput" placeholder="0123456789" value="'+contactValue+'"></div>';
    } else {
      html += '<input type="text" id="contactInput" placeholder="you@example.com" value="'+contactValue+'">';
    }
    var contactTouched = contactValue.trim().length > 0;
    var contactOk = isContactValid();
    html += '<div class="field-error'+(contactTouched && !contactOk ? ' show':'')+'" id="contactError">'
      + (contactMode==='phone' ? '请输入正确的马来西亚手机号（0开头，10-11位数字）' : '请输入正确的邮箱地址')
      + '</div>';
    html += '</div>';

    html += '<div class="disclaimer-card">'
      + '<span class="disc-checkbox'+(disclaimerChecked?' on':'')+'" id="discBox">'+CHECK_SVG+'</span>'
      + '<div class="disc-text">'+DISCLAIMER_HTML+'</div>'
      + '</div>';

    var addrOk = isAddressComplete();
    var canCheckout = checkedItems.length > 0 && disclaimerChecked && contactOk && addrOk;
    html += '<button class="checkout-btn" id="checkoutBtn"'+(canCheckout?'':' disabled')+'>去支付 · MYR '+grandTotal+'</button>';
    if(!addrOk){
      html += '<div class="checkout-hint">请填写完整的收货地址</div>';
    } else if(!contactOk){
      html += '<div class="checkout-hint">请填写正确的联系方式</div>';
    } else if(!disclaimerChecked){
      html += '<div class="checkout-hint">请先阅读并勾选上方说明</div>';
    } else if(checkedItems.length === 0){
      html += '<div class="checkout-hint">请至少选择一件商品</div>';
    }

    document.getElementById('mainArea').innerHTML = html;
    bindEvents();
    updateCartBadge();
  }

  function recomputeGating(){
    var checkedItems = cart.filter(function(it){ return it.checked && it.product.inStock; });
    var addrOk = isAddressComplete();
    var contactOk = isContactValid();
    var canCheckout = checkedItems.length > 0 && disclaimerChecked && contactOk && addrOk;
    var btn = document.getElementById('checkoutBtn');
    if(btn) btn.disabled = !canCheckout;
    var hintText = !addrOk ? '请填写完整的收货地址'
      : !contactOk ? '请填写正确的联系方式'
      : !disclaimerChecked ? '请先阅读并勾选上方说明'
      : checkedItems.length===0 ? '请至少选择一件商品'
      : null;
    var hintEl = document.querySelector('.checkout-hint');
    if(hintText){
      if(hintEl){ hintEl.textContent = hintText; }
      else if(btn){ btn.insertAdjacentHTML('afterend', '<div class="checkout-hint">'+hintText+'</div>'); }
    } else if(hintEl){
      hintEl.remove();
    }
    var contactTouched = contactValue.trim().length > 0;
    var errEl = document.getElementById('contactError');
    if(errEl) errEl.classList.toggle('show', contactTouched && !contactOk);
  }

  function bindEvents(){
    var contactInput = document.getElementById('contactInput');
    if(contactInput){
      contactInput.addEventListener('input', function(){
        contactValue = this.value;
        recomputeGating();
      });
    }
    document.querySelectorAll('.cm-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        contactMode = this.getAttribute('data-mode');
        contactValue = '';
        render();
      });
    });
    ['addrName','addrLine','addrCity','addrPostcode'].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      var key = id.replace('addr','').toLowerCase();
      el.addEventListener('input', function(){
        addressForm[key] = this.value;
        recomputeGating();
      });
    });
    var stateSelect = document.getElementById('addrState');
    if(stateSelect){
      stateSelect.addEventListener('change', function(){
        addressForm.state = this.value;
        render();
      });
    }
    var rememberBox = document.getElementById('rememberBox');
    if(rememberBox){
      rememberBox.addEventListener('click', function(){
        rememberAddr = !rememberAddr;
        this.classList.toggle('on', rememberAddr);
      });
    }
    var editAddrBtn = document.getElementById('editAddrBtn');
    if(editAddrBtn){
      editAddrBtn.addEventListener('click', function(){
        editingAddress = true;
        render();
      });
    }
    var selectAll = document.getElementById('selectAllBox');
    if(selectAll){
      selectAll.addEventListener('click', function(){
        var target = !cart.every(function(it){ return it.checked; });
        cart.forEach(function(it){ it.checked = target; });
        render();
      });
    }
    document.querySelectorAll('[data-check]').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = Number(this.getAttribute('data-check'));
        cart[idx].checked = !cart[idx].checked;
        render();
      });
    });
    document.querySelectorAll('[data-remove]').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = Number(this.getAttribute('data-remove'));
        var name = cart[idx].product.name;
        cart.splice(idx, 1);
        showToast('已移除：'+name);
        render();
      });
    });
    document.querySelectorAll('[data-minus]').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = Number(this.getAttribute('data-minus'));
        cart[idx].qty = Math.max(1, cart[idx].qty - 1);
        render();
      });
    });
    document.querySelectorAll('[data-plus]').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = Number(this.getAttribute('data-plus'));
        cart[idx].qty += 1;
        render();
      });
    });
    var couponApplyBtn = document.getElementById('couponApplyBtn');
    if(couponApplyBtn){
      couponApplyBtn.addEventListener('click', async function(){
        var input = document.getElementById('couponInput');
        couponApplyBtn.disabled = true;
        var result = await tryApplyCoupon(input.value);
        couponApplyBtn.disabled = false;
        if(!result.ok){
          document.getElementById('couponError').textContent = result.msg;
          return;
        }
        render();
      });
      document.getElementById('couponInput').addEventListener('keydown', function(e){
        if(e.key==='Enter') couponApplyBtn.click();
      });
    }
    var couponRemoveBtn = document.getElementById('couponRemoveBtn');
    if(couponRemoveBtn){
      couponRemoveBtn.addEventListener('click', function(){
        appliedCoupon = null;
        render();
      });
    }
    var discBox = document.getElementById('discBox');
    if(discBox){
      discBox.addEventListener('click', function(){
        disclaimerChecked = !disclaimerChecked;
        render();
      });
    }
    var checkoutBtn = document.getElementById('checkoutBtn');
    if(checkoutBtn){
      checkoutBtn.addEventListener('click', function(){
        if(checkoutBtn.disabled) return;
        var checkedItems = cart.filter(function(it){ return it.checked && it.product.inStock; });
        var ship = shippingFee();
        var total = checkedItems.reduce(function(s,it){ return s+unitPrice(it)*it.qty; }, 0) + ship;
        pendingOrder = {items: checkedItems, total: total, shipping: ship, contact: contactValue, address: Object.assign({}, addressForm)};
        if(rememberAddr){ saveAddress(addressForm); } else { clearSavedAddress(); }
        editingAddress = false;
        paymentMethod = 'card';
        render();
      });
    }
  }

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  function withCurrentCart(url){
    if(!cart.length) return url;
    var encoded = cart.map(function(it){ return it.product.id+':'+(it.variant==='trial'?'t':'f')+':'+it.qty; }).join(',');
    return url + (url.indexOf('?')===-1 ? '?' : '&') + 'cart=' + encodeURIComponent(encoded);
  }

  document.getElementById('brandBtn').addEventListener('click', function(){ window.location.href = withCurrentCart('VINATH_首页.html'); });
  document.getElementById('bcHome').addEventListener('click', function(){ window.location.href = withCurrentCart('VINATH_首页.html'); });
  document.getElementById('bcShop').addEventListener('click', function(){ window.location.href = withCurrentCart('VINATH_商店.html'); });
  document.getElementById('searchBtn').addEventListener('click', function(){ showToast('搜索 · 功能开发中'); });
  var vhAcctMenu = document.getElementById('vhAcctMenu');
  document.getElementById('acctBtn').addEventListener('click', function(e){
    e.stopPropagation();
    vhAcctMenu.classList.toggle('open');
  });
  document.getElementById('vhamOrder').addEventListener('click', function(){
    window.location.href = withCurrentCart('VINATH_订单查询.html');
  });
  document.getElementById('vhamBooking').addEventListener('click', function(){
    window.location.href = withCurrentCart('VINATH_预约查询.html');
  });
  document.addEventListener('click', function(){ vhAcctMenu.classList.remove('open'); });
  vhAcctMenu.addEventListener('click', function(e){ e.stopPropagation(); });
  document.getElementById('cartBtn').addEventListener('click', function(){
    showToast(cart.length > 0 ? '当前在结算页' : '购物车是空的');
  });

  initFromBackend();
})();
</script>

.vh-chat-empty{ margin:auto; text-align:center; color:#8a8478; font-size:12.5px; padding:0 20px; line-height:1.7; }
.vh-chat-input-row{ flex:none; display:flex; gap:8px; padding:11px; border-top:1px solid #E6E1D6; background:#fff; }
.vh-chat-input-row input{ flex:1; border:1.5px solid #E6E1D6; border-radius:100px; padding:9px 14px; font-size:13px; font-family:inherit; outline:none; }
.vh-chat-input-row input:focus{ border-color:var(--forest,#26362B); }
.vh-chat-input-row button{ flex:none; width:36px; height:36px; border-radius:50%; background:var(--forest,#26362B); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
</style>
<div class="vh-chat-fab" id="vhChatFab">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
  <span class="vh-chat-badge" id="vhChatBadge"></span>
</div>
<div class="vh-chat-panel" id="vhChatPanel">
  <div class="vh-chat-hd">
    <div class="vh-chat-hd-title" id="vhChatTitle">在线咨询</div>
    <div class="vh-chat-hd-sub" id="vhChatSub">正在与 龚诗宏医师 对话</div>
    <span class="vh-chat-close" id="vhChatClose"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>
  </div>
  <div class="vh-chat-body" id="vhChatBody"></div>
  <div class="vh-chat-input-row">
    <input type="text" id="vhChatInput" placeholder="输入消息…" maxlength="300">
    <button type="button" id="vhChatSend"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>
<script>
(function(){
  var API_BASE = window.VINATH_API_BASE || 'https://vinath-backend.onrender.com/api';
  // 聊天消息是任何匿名访客都能提交的内容，管理员打开对话时会看到——不转义就直接拼进innerHTML
  // 的话，访客可以在消息里塞HTML/脚本，在管理员已登录的浏览器里执行（存储型XSS）。
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var CUSTOMER_ID_KEY = 'vinath_customer_chat_id';
  var pollTimer = null;
  var currentThread = null;
  var currentMessages = [];

  function getCustomerId(){
    try {
      var id = localStorage.getItem(CUSTOMER_ID_KEY);
      if(!id){ id = 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem(CUSTOMER_ID_KEY, id); }
      return id;
    } catch(e){ return 'cust_temp'; }
  }
  // 客户端第一次打开聊天面板时调用——后端会自动处理"这个人是不是第一次来"、要不要插入欢迎语，
  // 前端不用再自己判断这些
  async function ensureMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/ensure-thread', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerId: getCustomerId() })
      });
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ console.error('聊天初始化失败:', e); return null; }
  }
  async function refreshMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/threads/' + getCustomerId());
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ return null; }
  }

  function renderMessages(){
    var body = document.getElementById('vhChatBody');
    var sub = document.getElementById('vhChatSub');
    if(!currentThread || !currentMessages.length){
      body.innerHTML = '<div class="vh-chat-empty">您好，有任何问题都可以在这里留言，我们会尽快回复您。</div>';
    } else {
      body.innerHTML = currentMessages.map(function(m){
        return '<div class="vh-chat-msg '+m.from+'">'+escapeHtml(m.text)+'</div>';
      }).join('');
      body.scrollTop = body.scrollHeight;
    }
    if(currentThread) sub.textContent = '正在与 ' + currentThread.assignedToName + ' 对话';
    updateBadge();
  }
  function updateBadge(){
    var badge = document.getElementById('vhChatBadge');
    var panelOpen = document.getElementById('vhChatPanel').classList.contains('open');
    if(currentThread && currentThread.unreadForCustomer && !panelOpen){
      badge.style.display = 'flex'; badge.textContent = '1';
    } else {
      badge.style.display = 'none';
    }
  }

  document.getElementById('vhChatFab').addEventListener('click', async function(){
    var panel = document.getElementById('vhChatPanel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      await ensureMyThread();
      renderMessages();
    }
    updateBadge();
  });
  document.getElementById('vhChatClose').addEventListener('click', function(){
    document.getElementById('vhChatPanel').classList.remove('open');
  });
  async function sendMsg(){
    var input = document.getElementById('vhChatInput');
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    input.disabled = true;
    try {
      await fetch(API_BASE + '/chat/threads/' + getCustomerId() + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      await refreshMyThread();
      renderMessages();
    } catch(e){ console.error('发送失败:', e); }
    input.disabled = false;
    input.focus();
  }
  document.getElementById('vhChatSend').addEventListener('click', sendMsg);
  document.getElementById('vhChatInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendMsg(); });

  // poll for admin replies / handoff changes while the widget is on screen
  pollTimer = setInterval(async function(){
    if(!currentThread) return; // 还没打开过聊天面板，没必要轮询
    await refreshMyThread();
    renderMessages();
  }, 4000);
})();
</script>

</body>
</html>
