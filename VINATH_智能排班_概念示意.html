<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINATH · 智能排班（概念原型）</title>
<style>
:root{
  --clay:#BC6E4E; --clay-soft:rgba(188,110,78,.12);
  --tan:#C9A876; --line:#E6E1D6; --ink:#332A21; --ink-soft:#7A6F60;
  --white:#FFFFFF; --shadow:0 3px 14px rgba(51,42,33,.07);
  --amber:#B8863C; --amber-soft:rgba(184,134,60,.13);
  --sage:#7A8B6F; --sage-soft:rgba(122,139,111,.13);
  --font-serif:"Noto Serif SC",serif;
}
*{box-sizing:border-box;}
body{ margin:0; font-family:"Noto Sans SC",sans-serif; background:#FBF8F3; color:var(--ink); }
.wrap{ max-width:900px; margin:0 auto; padding:26px 20px 80px; }
h1{ font-family:var(--font-serif); font-size:22px; margin:0 0 4px; }
.sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:20px; }
.proto-banner{ background:var(--amber-soft); border:1px solid rgba(184,134,60,.3); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.65; color:#6B4E1E; margin-bottom:22px; }
.card{ background:var(--white); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; margin-bottom:16px; }
.section-title{ font-weight:700; font-size:15px; margin-bottom:12px; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:7px; }
.field input[type=text], .field input[type=number], .field input[type=time], .field select{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:13.5px; }
.btn-primary{ background:var(--clay); color:#fff; border:none; border-radius:10px; padding:11px 22px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-secondary{ background:none; border:1.5px solid var(--line); color:var(--ink); border-radius:10px; padding:10px 20px; font-size:13.5px; cursor:pointer; }
.tabs{ display:flex; gap:8px; margin-bottom:20px; border-bottom:1.5px solid var(--line); }
.tab-btn{ padding:10px 4px; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2.5px solid transparent; margin-right:18px; }
.tab-btn.active{ color:var(--clay); border-bottom-color:var(--clay); }
.day-row{ display:flex; align-items:center; gap:14px; padding:10px 0; border-bottom:1px solid var(--line); }
.day-row:last-child{ border-bottom:none; }
.day-row .day-label{ width:60px; font-weight:700; font-size:13.5px; flex:none; }
.day-row .toggle{ width:38px; height:22px; border-radius:100px; background:var(--line); position:relative; cursor:pointer; flex:none; }
.day-row .toggle.on{ background:var(--clay); }
.day-row .toggle-dot{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s; }
.day-row .toggle.on .toggle-dot{ left:18px; }
.day-row .time-inputs{ display:flex; gap:8px; align-items:center; flex:1; }
.day-row .time-inputs input{ width:110px; padding:7px 10px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:12.5px; }
.stop-card{ border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; gap:14px; align-items:flex-start; }
.stop-num{ width:26px; height:26px; border-radius:50%; background:var(--clay); color:#fff; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; flex:none; }
.stop-info .sname{ font-weight:700; font-size:14px; }
.stop-info .smeta{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.stop-info .saddr{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
.area-group-label{ font-size:12px; font-weight:700; color:var(--clay); text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px; }
.area-group-label:first-child{ margin-top:0; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px; }
.login-gate{ max-width:480px; margin:80px auto; text-align:center; padding:0 20px; }
.admin-toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 22px; border-radius:100px; font-size:13.5px; box-shadow:0 10px 28px rgba(0,0,0,.22); z-index:200; opacity:0; pointer-events:none; transition:.25s; }
.admin-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.deposit-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--clay-soft); border-radius:10px; margin-top:10px; }
.deposit-status{ font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:100px; }
.deposit-status.unpaid{ background:var(--amber-soft); color:var(--amber); }
.deposit-status.paid{ background:var(--sage-soft); color:var(--sage); }
.vinath-admin-nav{ background:#332A21; }
.vinath-admin-nav-inner{ max-width:1200px; margin:0 auto; display:flex; gap:2px; padding:0 20px; overflow-x:auto; }
.van-item{ color:rgba(255,255,255,.62); font-size:13px; padding:13px 14px; text-decoration:none; white-space:nowrap; border-bottom:2.5px solid transparent; display:inline-block; }
.van-item:hover{ color:#fff; }
.van-item.current{ color:#fff; border-bottom-color:#BC6E4E; font-weight:700; }
</style>
</head>
<body>

<div class="vinath-admin-nav" id="vinathAdminNav"></div>
<div id="app"></div>
<div class="admin-toast" id="adminToast"></div>
<div id="depositModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(51,42,33,.4);z-index:300;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:24px 26px;max-width:340px;width:90%;">
    <div style="font-weight:700;font-size:15px;margin-bottom:14px;">请求订金</div>
    <div class="field"><label>金额（RM）</label><input type="number" id="depositAmountInput" value="30"></div>
    <div class="field"><label>支付方式</label><select id="depositMethodInput"></select></div>
    <div style="display:flex;gap:8px;margin-top:6px;"><button class="btn-primary" id="confirmDepositBtn" style="flex:1;">发送请求</button><button class="btn-secondary" id="cancelDepositBtn">取消</button></div>
  </div>
</div>

<script>
if(window.history.scrollRestoration) window.history.scrollRestoration = "manual";
window.scrollTo(0,0);

(function(){
  async function renderVinathAdminNav(navAdmin){
    if(!navAdmin) return;
    var ALL_ADMIN_TOOLS = [
      {label:'订单预约管理', file:'VINATH_订单预约管理_概念示意.html', roles:['senior','practitioner','fulfillment','support']},
      {label:'商品管理', file:'VINATH_商品管理_概念示意.html', roles:['senior']},
      {label:'内容管理', file:'VINATH_内容管理_概念示意.html', roles:['senior']},
      {label:'电子病历', file:'VINATH_电子病历_概念示意.html', roles:['senior','practitioner'], gated:'medicalRecords'},
      {label:'电子处方', file:'VINATH_电子处方_概念示意.html', roles:['senior','practitioner'], gated:'prescriptions'},
      {label:'电子收据', file:'VINATH_电子收据_概念示意.html', roles:['senior','practitioner'], gated:'receipts'},
      {label:'智能排班', file:'VINATH_智能排班_概念示意.html', roles:['senior','practitioner']}
    ];
    var myRole = navAdmin.type==='senior' ? 'senior' : (navAdmin.adminType||'practitioner');
    var visible = ALL_ADMIN_TOOLS.filter(function(t){ return t.roles.indexOf(myRole)!==-1; });
    // I类执业医师看到的导航栏，要跟实际的功能开关状态一致——开关没打开的工具，不该在导航栏
    // 里出现让人点了才发现进不去。大管理员不受这个开关影响，不用过滤。
    if(myRole==='practitioner'){
      try {
        var apiBase = window.VINATH_API_BASE || 'http://localhost:3001/api';
        var res = await fetch(apiBase + '/site-settings/module_access');
        var access = res.ok ? (await res.json() || {}) : {};
        visible = visible.filter(function(t){ return !t.gated || access[t.gated]===true; });
      } catch(e){ console.error('拉取功能开关状态失败:', e); }
    }
    var currentFile = decodeURIComponent(window.location.pathname.split('/').pop());
    var navEl = document.getElementById('vinathAdminNav');
    if(!navEl) return;
    navEl.innerHTML = '<div class="vinath-admin-nav-inner">' + visible.map(function(t){
      return (currentFile === t.file) ? '<span class="van-item current">'+t.label+'</span>' : '<a class="van-item" href="'+t.file+'">'+t.label+'</a>';
    }).join('') + '</div>';
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById('adminToast');
    el.textContent = msg;
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  function getCurrentAdmin(){
    try { var raw = localStorage.getItem('vinath_current_admin'); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  var cur = getCurrentAdmin();
  var isPractitioner = cur && (cur.type==='senior' || (cur.type==='junior' && (cur.adminType||'practitioner')==='practitioner'));
  if(!isPractitioner){
    document.getElementById('app').innerHTML =
      '<div class="wrap"><div class="login-gate"><h1>请先登录</h1>'
      + '<div class="sub" style="margin-top:10px;">智能排班只对执业医师（大管理员 / I类小管理员）开放。请先在 <a href="VINATH_订单预约管理_概念示意.html" style="color:var(--clay);font-weight:700;">订单预约管理</a> 页面登录，登录后回到这个页面即可看到内容。</div></div></div>';
    return;
  }
  renderVinathAdminNav(cur);
  var API_BASE = window.VINATH_API_BASE || 'http://localhost:3001/api';
  var authToken = null;
  try { authToken = sessionStorage.getItem('vinath_auth_token'); } catch(e){}

  var DAY_LABELS = ['周一','周二','周三','周四','周五','周六','周日'];
  var DEFAULT_AVAILABILITY = { radiusKm: 15, days: DAY_LABELS.map(function(){ return {enabled:false, start:'09:00', end:'18:00'}; }) };
  async function getMyAvailability(){
    if(!authToken) return DEFAULT_AVAILABILITY;
    try {
      var res = await fetch(API_BASE + '/admin/availability', { headers: { 'Authorization': 'Bearer ' + authToken } });
      return res.ok ? await res.json() : DEFAULT_AVAILABILITY;
    } catch(e){ return DEFAULT_AVAILABILITY; }
  }

  async function getBookings(){
    if(!authToken) return [];
    try {
      var res = await fetch(API_BASE + '/admin/bookings', { headers: { 'Authorization': 'Bearer ' + authToken } });
      if(!res.ok) return [];
      var rows = await res.json();
      return rows.map(function(b){ return { id:b.id, contact:b.customer_phone, name:b.customer_name, apptDate:b.appt_date,
        apptDateISO:b.appt_date_iso, slot:b.slot, doctor:b.practitioner_name, area:b.area, addressDetail:b.address_detail,
        need:b.need, cancelled:b.cancelled, depositAmount:b.deposit_amount, depositMethod:b.deposit_method, depositStatus:b.deposit_status }; });
    } catch(e){ return []; }
  }

  var tab = 'route';
  function render(){
    if(tab==='route') renderRoute();
    else if(tab==='availability') renderAvailability();
  }
  function renderTabs(){
    return '<div class="tabs"><span class="tab-btn'+(tab==='route'?' active':'')+'" data-tab="route">今日路线</span>'
      + '<span class="tab-btn'+(tab==='availability'?' active':'')+'" data-tab="availability">服务时段与范围</span></div>';
  }
  function wireTabs(){
    document.querySelectorAll('.tab-btn').forEach(function(b){
      b.addEventListener('click', function(){ tab = this.getAttribute('data-tab'); render(); });
    });
  }

  async function renderAvailability(){
    var avail = await getMyAvailability();
    var html = '<div class="wrap"><h1>智能排班</h1><div class="sub">设置每日上门服务时间段与服务区域半径。</div>'
      + renderTabs()
      + '<div class="proto-banner"><b>"服务区域半径"这里先做成一个数字设置项，还没有接入真实地图。</b>真正按半径圈定范围、判断某个预约地址在不在范围内，需要真实的地理编码服务（把地址转成经纬度）才能做到，这个需要 Google Maps 一类的 API Key，属于需要单独申请、单独付费的第三方服务。</div>'
      + '<div class="card"><div class="section-title">服务区域半径</div>'
      + '<div class="field" style="max-width:220px;"><label>公里数</label><input type="number" id="radiusInput" value="'+avail.radiusKm+'"></div>'
      + '</div>'
      + '<div class="card"><div class="section-title">每周上门服务时间段</div>'
      + avail.days.map(function(d, i){
          return '<div class="day-row"><div class="day-label">'+DAY_LABELS[i]+'</div>'
            + '<div class="toggle'+(d.enabled?' on':'')+'" data-day-idx="'+i+'"><div class="toggle-dot"></div></div>'
            + '<div class="time-inputs"><input type="time" data-start-idx="'+i+'" value="'+d.start+'"'+(d.enabled?'':' disabled')+'> 至 <input type="time" data-end-idx="'+i+'" value="'+d.end+'"'+(d.enabled?'':' disabled')+'></div></div>';
        }).join('')
      + '</div>'
      + '<button class="btn-primary" id="saveAvailBtn">保存设置</button>'
      + '</div>';
    document.getElementById('app').innerHTML = html;
    wireTabs();

    document.querySelectorAll('[data-day-idx]').forEach(function(t){
      t.addEventListener('click', function(){
        var i = Number(this.getAttribute('data-day-idx'));
        avail.days[i].enabled = !avail.days[i].enabled;
        this.classList.toggle('on');
        document.querySelector('[data-start-idx="'+i+'"]').disabled = !avail.days[i].enabled;
        document.querySelector('[data-end-idx="'+i+'"]').disabled = !avail.days[i].enabled;
      });
    });
    document.querySelectorAll('[data-start-idx]').forEach(function(inp){
      inp.addEventListener('input', function(){ avail.days[Number(this.getAttribute('data-start-idx'))].start = this.value; });
    });
    document.querySelectorAll('[data-end-idx]').forEach(function(inp){
      inp.addEventListener('input', function(){ avail.days[Number(this.getAttribute('data-end-idx'))].end = this.value; });
    });
    document.getElementById('saveAvailBtn').addEventListener('click', async function(){
      avail.radiusKm = Number(document.getElementById('radiusInput').value) || 0;
      var btn = this;
      btn.disabled = true;
      try {
        await fetch(API_BASE + '/admin/availability', {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
          body: JSON.stringify(avail)
        });
        showToast('设置已保存');
      } catch(e){ showToast('保存失败，请检查网络后重试'); }
      btn.disabled = false;
    });
  }

  async function renderRoute(){
    var todayISO = new Date().toISOString().slice(0,10);
    var allBookings = await getBookings();
    var bookings = allBookings.filter(function(b){
      return b.apptDateISO===todayISO && b.doctor===cur.name && !b.cancelled;
    });
    // 没有真实地图/地理编码，没法算真正的最短路线——用"同一服务区域算相邻"这个更朴素但诚实的
    // 办法做分组排序：同一个区域的预约排在一起，减少来回跑同一片区域的情况
    var byArea = {};
    var areaOrder = [];
    bookings.forEach(function(b){
      if(!byArea[b.area]){ byArea[b.area] = []; areaOrder.push(b.area); }
      byArea[b.area].push(b);
    });
    var stopCounter = 0;

    var html = '<div class="wrap"><h1>智能排班</h1><div class="sub">今日预约按区域分组排列，方便规划路线。</div>'
      + renderTabs()
      + '<div class="proto-banner"><b>跟订单预约管理首页的"今日工作任务"是什么关系？</b>那边是你打开后台第一眼看到的总览，什么都有（预约+商品订单混在一起，方便快速处理）；这里是专门给要出门跑上门服务的医师用的——只看预约、按区域分组方便规划顺路顺序、能看到详细地址、还能收订金、快速跳到这个患者的病历和处方。简单说：想知道"今天有什么事"看那边，想知道"今天怎么跑"用这里。<br><br><b>"按顺路程度排序"这里做的是按服务区域分组，不是真正的GPS路线优化。</b>要做到根据实际路程时间排序，需要真实的地图/地理编码API（比如Google Maps Distance Matrix），这个项目目前没有对接，需要真实的API Key才能往下做——但对单个医师一天通常不超过6-8单的量来说，按区域分组已经能大幅减少来回跑同一片区域的情况，是一个务实的替代方案。</div>'
      + '<div class="card">'
      + (areaOrder.length ? areaOrder.map(function(area){
          var stopsHtml = byArea[area].map(function(b){
            stopCounter++;
            return '<div class="stop-card"><div class="stop-num">'+stopCounter+'</div><div class="stop-info">'
              + '<div class="sname">'+b.name+' · '+b.slot+'</div>'
              + '<div class="smeta">'+b.contact+' · '+(b.need||'')+'</div>'
              + '<div class="saddr">'+b.area+' '+(b.addressDetail||'')+'</div>'
              + '<div class="deposit-row"><span style="font-size:12.5px;">预订订金</span>'
              + (b.depositStatus==='paid'
                  ? '<span class="deposit-status paid">已收订金 RM'+b.depositAmount.toFixed(2)+'</span>'
                  : '<span class="deposit-status unpaid">未收订金</span> <button type="button" class="btn-secondary request-deposit-btn" data-id="'+b.id+'" style="padding:5px 12px;font-size:12px;">请求订金</button>')
              + '</div>'
              + '<div class="quick-links-row" style="margin-top:8px;display:flex;gap:8px;">'
              + '<a href="VINATH_电子病历_概念示意.html?patientPhone='+encodeURIComponent(b.contact)+'&patientName='+encodeURIComponent(b.name)+'" target="_blank" style="font-size:12px;color:var(--clay);text-decoration:none;font-weight:700;">查看电子病历 →</a>'
              + '<a href="VINATH_电子处方_概念示意.html" target="_blank" style="font-size:12px;color:var(--clay);text-decoration:none;font-weight:700;">开具处方 →</a>'
              + '</div>'
              + '</div></div>';
          }).join('');
          return '<div class="area-group-label">'+area+'</div>' + stopsHtml;
        }).join('') : '<div class="empty-state">今天在您名下暂时没有预约</div>')
      + '</div></div>';
    document.getElementById('app').innerHTML = html;
    wireTabs();

    document.querySelectorAll('.request-deposit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ openDepositModal(this.getAttribute('data-id')); });
    });
  }

  var pendingDepositBookingId = null;
  async function openDepositModal(bookingId){
    pendingDepositBookingId = bookingId;
    document.getElementById('depositAmountInput').value = '30';
    var methodSel = document.getElementById('depositMethodInput');
    var methods = [];
    try {
      var res = await fetch(API_BASE + '/payment-methods');
      methods = res.ok ? await res.json() : [];
    } catch(e){}
    methodSel.innerHTML = methods.length ? methods.map(function(m){
      var label = m.type==='bank_transfer' ? '银行转账（'+m.bankName+'）' : 'DuitNow';
      return '<option value="'+m.id+'">'+label+'</option>';
    }).join('') : '<option value="">尚未在内容管理配置付款方式</option>';
    document.getElementById('depositModalOverlay').style.display = 'flex';
  }
  document.getElementById('cancelDepositBtn').addEventListener('click', function(){
    document.getElementById('depositModalOverlay').style.display = 'none';
  });
  document.getElementById('confirmDepositBtn').addEventListener('click', async function(){
    var amount = Number(document.getElementById('depositAmountInput').value);
    if(!amount || amount<=0){ showToast('请输入有效金额'); return; }
    // [stated] 这里只是模拟"发起收订金"这个动作和状态流转——跟购物车结算的付款方式是同一套
    // （银行转账/DuitNow，都在内容管理后台配置），客户实际转账后，需要人工核对到账情况，
    // 这里的"已收订金"只是医师/管理员自己标记，不是系统自动确认收款。
    var btn = this;
    btn.disabled = true;
    try {
      var res = await fetch(API_BASE + '/admin/bookings/' + pendingDepositBookingId + '/deposit', {
        method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
        body: JSON.stringify({ amount: amount, method: document.getElementById('depositMethodInput').value })
      });
      if(!res.ok){
        var err = await res.json();
        showToast(err.error || '操作失败，请重试');
        btn.disabled = false;
        return;
      }
      document.getElementById('depositModalOverlay').style.display = 'none';
      showToast('已标记为已收订金');
      render();
    } catch(e){
      showToast('连不上服务器，请检查网络后重试');
    }
    btn.disabled = false;
  });

  render();
})();
</script>
</body>
</html>
