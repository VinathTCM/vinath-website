`## Privacy Policy — English Version

Last updated: 9 September 2026

VINATH TCM HEALTH CARE ("we", "us", or "our") respects and values your personal data. This Privacy Policy explains what information we collect, why we collect it, how we use and protect it, and the rights you have. This policy is prepared in accordance with the Malaysian Personal Data Protection Act 2010 (PDPA) and the Personal Data Protection Regulations 2013.

### 1. Information We Collect

**1.1 When placing orders**
Name, contact number or email address, delivery address; if paying via bank transfer/DuitNow, also includes the payment screenshot you voluntarily upload (used to verify payment, see "Special Note on Payment Screenshots" below).

**1.2 When booking home consultations**
Name, contact number (phone only, no email collected), voluntarily provided description of needs, and TCM diagnosis/medical history records taken by the physician during the home visit.

**1.3 When checking orders or bookings**
Order number or booking number + contact information (used to verify identity; we do not have an account login system).

**1.4 When browsing the website**
Our website is hosted as static pages. We do not use cookie trackers and do not collect browsing behavior data. We only collect the above information when you actively submit a form.

### 2. Special Note on Health-Related Information

When booking a home consultation, you may describe symptoms or previous medical conditions to the physician. Such information is classified as sensitive personal data under PDPA that requires more careful handling:

- Only used by the attending physician for this and follow-up consultations;
- Will not be provided to third parties without your consent (except as required by law);
- You may contact customer service at any time to request access to, correction of, or deletion of your medical history;
- The electronic medical record system maintains access logs recording who accessed which record and when.

### 3. How We Use Your Information (PDPA Seven Principles)

Under PDPA, we commit to the following seven data protection principles:

1. **General Principle**: Personal data is collected and processed only on a lawful and fair basis, and with your knowledge and consent.
2. **Notice and Choice Principle**: At the time of collection, we inform you of the purpose of collection, categories of data recipients, and your rights.
3. **Disclosure Principle**: We do not disclose your personal data to third parties without your consent (except as required by law or for logistics delivery).
4. **Security Principle**: We take reasonable technical and organizational measures to protect the security of your data.
5. **Retention Principle**: We retain data only for as long as necessary to fulfill the purpose of collection (see "Data Retention Period" below).
6. **Data Integrity Principle**: We take reasonable measures to ensure personal data is accurate, complete, and up-to-date.
7. **Access Principle**: You have the right to access and correct the personal data we hold about you.

Specific uses include: processing and delivering orders; arranging/confirming/reminding home consultation appointments; responding to your inquiries and customer service requests; fulfilling legal, tax, and accounting obligations (such as issuing receipts/invoices). We do not sell your personal data to third parties.

### 4. Data Retention Period

| Data Type | Retention Period | Basis |
|---|---|---|
| Medical/health records | 7 years from last consultation | Medical industry practice and potential liability limitation period |
| Financial/transaction records (receipts, invoices, payment vouchers) | 7 years | Section 82A of the Malaysian Income Tax Act 1967 requires business records to be retained for 7 years |
| Order/booking records | 2 years | Required for after-sales and dispute resolution |
| Customer service communication records | 2 years | Service quality traceability |

Data exceeding the retention period will be securely deleted or anonymized.

### 5. Data Storage and Protection

Your information is stored on our backend server (Render platform, located in Singapore data center) and SQLite database. Website static pages are hosted on GitHub Pages (which does not store any user data), and the domain is registered with Exabytes (Malaysia).

We take the following measures to protect your data:
- Server access requires authentication, only authorized personnel may access;
- Electronic medical records have role-based access control (senior admin/junior practitioner level visibility);
- Medical record access maintains audit logs;
- Data transmission uses HTTPS encryption.

### 6. Cross-Border Data Transfer

Our backend server is located in Singapore, and your data may be stored and processed in Singapore. Singapore has been recognized by the Malaysian Personal Data Protection Commissioner (PDP Commissioner) as a jurisdiction with an adequate level of data protection. We ensure that data transferred across borders remains protected under this Privacy Policy and PDPA.

### 7. Circumstances of Sharing Information with Third Parties

We only share your information with third parties in the following circumstances:
- **Logistics/delivery companies**: Only provide information necessary for delivery (name, phone, address), no health information;
- **When required by law or regulatory authorities**: In accordance with legal process or government requests;
- **Upon business transfer**: In the event of a merger, acquisition, or asset sale, your data may be transferred as part of the transaction, and we will notify you in advance.

Currently, the website's payment methods are direct bank transfer or DuitNow transfer, which do not go through any third-party payment gateway (such as credit card acquirers or e-wallet payment service providers) — your payment information will not be handled by any such third party, and we do not collect or store your bank card number, online banking password, or other sensitive payment credentials.

### 8. Special Note on Payment Screenshots

When paying by bank transfer or DuitNow, you need to complete the transfer in your own banking app/e-wallet and then upload a screenshot of the successful payment as proof. This screenshot may contain your own bank account information (such as the last four digits of the account, transfer time, etc.) — we only use it to verify whether the payment for this order has been received. After verification, it will not be used for any other purpose, nor will it be publicly displayed. The screenshot is stored with the order record, and the retention period is the same as the order record (2 years).

### 9. Data Breach Notification

In the event of a security breach involving your personal data, we will notify affected individuals and the Malaysian Personal Data Protection Commissioner (as required by law) within 72 hours of discovery, and take reasonable measures to mitigate the impact.

### 10. Children's Privacy

Our services are not directed at minors under 18. If you are under 18, please use our services with a parent or guardian, and have the parent or guardian provide personal data.

### 11. Your Rights

Under PDPA, you have the following rights:
1. **Right of access**: Access the personal data we hold about you;
2. **Right of correction**: Request correction of inaccurate or incomplete personal data;
3. **Right to erasure**: Request deletion of your personal data (subject to records required by law to be retained, such as financial records requiring 7 years);
4. **Right to withdraw consent**: Withdraw consent previously given for processing;
5. **Right to restrict processing**: Request restriction of processing of personal data;
6. **Right to data portability**: Request your data in a structured, commonly used format.

To exercise the above rights, please contact us via:
- Customer service WhatsApp: +6011-4579 9499
- Email: vinathtcm@outlook.com

We will respond within 21 working days of receiving the request. Access or correction requests may incur a reasonable administrative fee (if applicable).

### 12. Changes to This Policy

We may update this Privacy Policy from time to time. Material changes will be notified to you through website announcements or the contact information you provided. Continued use of our services constitutes your agreement to the updated policy.

## Dasar Privasi — Versi Bahasa Melayu

Tarikh kemas kini terakhir: 9 September 2026

VINATH TCM HEALTH CARE ("kami") menghormati dan menghargai data peribadi anda. Dasar Privasi ini menerangkan maklumat apa yang kami kumpulkan, mengapa kami mengumpulkannya, bagaimana kami menggunakan dan melindunginya, serta hak-hak yang anda miliki. Dasar ini disediakan selaras dengan Akta Perlindungan Data Peribadi 2010 (PDPA) Malaysia dan Peraturan-Peraturan Perlindungan Data Peribadi 2013.

### 1. Maklumat Yang Kami Kumpulkan

**1.1 Apabila membuat pesanan**
Nama, nombor telefon atau alamat e-mel, alamat penghantaran; jika membayar melalui pindahan bank/DuitNow, turut termasuk tangkapan skrin pembayaran yang anda muat naik secara sukarela (digunakan untuk mengesahkan pembayaran, lihat "Nota Khas Mengenai Tangkapan Skrin Pembayaran" di bawah).

**1.2 Apabila menempah perundingan rumah**
Nama, nombor telefon (telefon sahaja, tiada e-mel dikumpulkan), penerangan keperluan yang diberikan secara sukarela, dan rekod diagnosis/perubatan TCM yang diambil oleh doktor semasa lawatan rumah.

**1.3 Apabila menyemak pesanan atau tempahan**
Nombor pesanan atau nombor tempahan + maklumat hubungan (digunakan untuk mengesahkan identiti; kami tidak mempunyai sistem log masuk akaun).

**1.4 Apabila melayari laman web**
Laman web kami dihoskan sebagai halaman statik. Kami tidak menggunakan penjejak cookie dan tidak mengumpulkan data tingkah laku pelayaran. Kami hanya mengumpulkan maklumat di atas apabila anda menyerahkan borang secara aktif.

### 2. Nota Khas Mengenai Maklumat Berkaitan Kesihatan

Apabila menempah perundingan rumah, anda mungkin menerangkan simptom atau keadaan perubatan terdahulu kepada doktor. Maklumat sedemikian diklasifikasikan sebagai data peribadi sensitif di bawah PDPA yang memerlukan pengendalian yang lebih berhati-hati:

- Hanya digunakan oleh doktor yang merawat untuk perundingan ini dan susulan;
- Tidak akan diberikan kepada pihak ketiga tanpa persetujuan anda (kecuali seperti yang diperlukan oleh undang-undang);
- Anda boleh menghubungi khidmat pelanggan pada bila-bila masa untuk meminta akses kepada, pembetulan, atau penghapusan rekod perubatan anda;
- Sistem rekod perubatan elektronik mengekalkan log akses yang merekodkan siapa yang mengakses rekod mana dan bila.

### 3. Bagaimana Kami Menggunakan Maklumat Anda (Tujuh Prinsip PDPA)

Di bawah PDPA, kami komited kepada tujuh prinsip perlindungan data berikut:

1. **Prinsip Umum**: Data peribadi dikumpulkan dan diproses hanya atas asas yang sah dan adil, dan dengan pengetahuan serta persetujuan anda.
2. **Prinsip Notis dan Pilihan**: Pada masa pengumpulan, kami memaklumkan anda tentang tujuan pengumpulan, kategori penerima data, dan hak-hak anda.
3. **Prinsip Pendedahan**: Kami tidak mendedahkan data peribadi anda kepada pihak ketiga tanpa persetujuan anda (kecuali seperti yang diperlukan oleh undang-undang atau untuk penghantaran logistik).
4. **Prinsip Keselamatan**: Kami mengambil langkah teknikal dan organisasi yang munasabah untuk melindungi keselamatan data anda.
5. **Prinsip Pengekalan**: Kami mengekalkan data hanya selama yang diperlukan untuk memenuhi tujuan pengumpulan (lihat "Tempoh Pengekalan Data" di bawah).
6. **Prinsip Integriti Data**: Kami mengambil langkah munasabah untukk memastikan data peribadi adalah tepat, lengkap, dan terkini.
7. **Prinsip Akses**: Anda mempunyai hak untuk mengakses dan membetulkan data peribadi yang kami pegang tentang anda.

Kegunaan khusus termasuk: memproses dan menghantar pesanan; mengatur/mengesahkan/mengingatkan tempahan perundingan rumah; menjawab pertanyaan dan permintaan khidmat pelanggan anda; memenuhi obligasi undang-undang, cukai, dan perakaunan (seperti mengeluarkan resit/invois). Kami tidak menjual data peribadi anda kepada pihak ketiga.

### 4. Tempoh Pengekalan Data

| Jenis Data | Tempoh Pengekalan | Asas |
|---|---|---|
| Rekod perubatan/kesihatan | 7 tahun dari perundingan terakhir | Amalan industri perubatan dan tempoh had liabiliti berpotensi |
| Rekod kewangan/transaksi (resit, invois, baucar pembayaran) | 7 tahun | Seksyen 82A Akta Cukai Pendapatan 1967 Malaysia memerlukan rekod perniagaan dikekalkan selama 7 tahun |

| Rekod komunikasi khidmat pelanggan | 2 tahun | Kebolehkesanan kualiti perkhidmatan |

Data yang melebihi tempoh pengekalan akan dipadamkan atau dinyahidentitikan dengan selamat.

### 5. Penyimpanan dan Perlindungan Data

Maklumat anda disimpan pada pelayan backend kami (platform Render, terletak di pusat data Singapura) dan pangkalan data SQLite. Halaman statik laman web dihoskan pada GitHub Pages (yang tidak menyimpan sebarang data pengguna), dan domain didaftarkan dengan Exabytes (Malaysia).

Kami mengambil langkah berikut untuk melindungi data anda:
- Akses pelayan memerlukan pengesahan, hanya kakitangan yang diberi kuasa boleh mengakses;
- Rekod perubatan elektronik mempunyai kawalan akses berdasarkan peranan (tahap penglihatan pentadbir kanan/pengamalan muda);
- Akses rekod perubatan mengekalkan log audit;
- Penghantaran data menggunakan penyulitan HTTPS.

### 6. Pemindahan Data Merentas Sempadan

Pelayan backend kami terletak di Singapura, dan data anda mungkin disimpan dan diproses di Singapura. Singapura telah diiktiraf oleh Pesuruhjaya Perlindungan Data Peribadi Malaysia (PDP Commissioner) sebagai bidang kuasa dengan tahap perlindungan data yang mencukupi. Kami memastikan data yang dipindahkan merentas sempadan kekal dilindungi di bawah Dasar Privasi ini dan PDPA.

### 7. Keadaan Perkongsian Maklumat dengan Pihak Ketiga

Kami hanya berkongsi maklumat anda dengan pihak ketiga dalam keadaan berikut:
- **Syarikat logistik/penghantaran**: Hanya menyediakan maklumat yang diperlukan untuk penghantaran (nama, telefon, alamat), tiada maklumat kesihatan;
- **Apabila diperlukan oleh undang-undang atau pihak berkuasa kawal selia**: Selaras dengan proses undang-undang atau permintaan kerajaan;
- **Apabila pemindahan perniagaan**: Sekiranya berlaku penggabungan, pemerolehan, atau penjualan aset, data anda mungkin dipindahkan sebagai sebahagian daripada transaksi, dan kami akan memaklumkan anda terlebih dahulu.

Pada masa ini, kaedah pembayaran laman web adalah pindahan bank terus atau pindahan DuitNow, yang tidak melalui sebarang gerbang pembayaran pihak ketiga (seperti pemeroleh kad kredit atau pembekal perkhidmatan pembayaran e-dompet) — maklumat pembayaran anda tidak akan dikendalikan oleh pihak ketiga sedemikian, dan kami tidak mengumpul atau menyimpan nombor kad bank anda, kata laluan perbankan dalam talian, atau kelayakan pembayaran sensitif yang lain.

### 8. Nota Khas Mengenai Tangkapan Skrin Pembayaran

Apabila membayar melalui pindahan bank atau DuitNow, anda perlu melengkapkan pindahan dalam aplikasi bank/e-dompet anda sendiri dan kemudian memuat naik tangkapan skrin pembayaran berjaya sebagai bukti. Tangkapan skrin ini mungkin mengandungi maklumat akaun bank anda sendiri (seperti empat digit terakhir akaun, masa pindahan, dll.) — kami hanya menggunakannya untuk mengesahkan sama ada pembayaran untuk pesanan ini telah diterima. Selepas pengesahan, ia tidak akan digunakan untuk tujuan lain, mahupun dipaparkan secara awam. Tangkapan skrin disimpan bersama rekod pesanan, dan tempoh pengekalan adalah sama dengan rekod pesanan (2 tahun).

  async function getPolicyDocs(){
    var merged = {};
    try {
      var res = await fetch(API_BASE + '/site-settings/policy_pages');
      var saved = res.ok ? await res.json() : null;
      POLICY_DOCS.forEach(function(key){ merged[key] = (saved && saved[key]) || POLICY_DEFAULTS[key]; });
    } catch(e){
      POLICY_DOCS.forEach(function(key){ merged[key] = POLICY_DEFAULTS[key]; });
    }
    return merged;
  }

  // very small "markdown-lite" renderer matching the admin editor's own convention:
  // blank line = paragraph break, a line starting with "## " = a sub-heading
  function renderContent(text){
    var lines = text.replace(/\r\n/g,'\n').split('\n');
    var html = '';
    var para = [];
    function flush(){
      if(para.length){ html += '<p>'+para.join('\n')+'</p>'; para = []; }
    }
    lines.forEach(function(line){
      if(line.trim()===''){ flush(); }
      else if(line.indexOf('## ')===0){ flush(); html += '<h3>'+line.slice(3)+'</h3>'; }
      else { para.push(line); }
    });
    flush();
    return html;
  }

  function escapeHtml(s){
    var d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }

  var docs = await getPolicyDocs();

  document.getElementById('policyTabs').innerHTML = POLICY_DOCS.map(function(key){
    return '<a href="#'+key+'" class="policy-tab" data-doc="'+key+'">'+escapeHtml(docs[key].title)+'</a>';
  }).join('');
  document.getElementById('footerLinks').innerHTML = POLICY_DOCS.map(function(key){
    return '<a href="#'+key+'" data-doc="'+key+'">'+escapeHtml(docs[key].title)+'</a>';
  }).join('');
  document.getElementById('policyDocs').innerHTML = POLICY_DOCS.map(function(key){
    var doc = docs[key];
    return '<article class="policy-doc" id="doc-'+key+'">'
      + '<h1>'+escapeHtml(doc.title)+'</h1>'
      + renderContent(doc.content)
      + '</article>';
  }).join('');

  function showDoc(key){
    if(POLICY_DOCS.indexOf(key)===-1) key = POLICY_DOCS[0];
    document.querySelectorAll('.policy-doc').forEach(function(el){ el.classList.toggle('active', el.id==='doc-'+key); });
    document.querySelectorAll('[data-doc]').forEach(function(el){ el.classList.toggle('active', el.getAttribute('data-doc')===key); });
    window.scrollTo({top:0, behavior:'instant'});
  }
  document.querySelectorAll('[data-doc]').forEach(function(el){
    el.addEventListener('click', function(e){
      e.preventDefault();
      var key = this.getAttribute('data-doc');
      history.replaceState(null, '', '#'+key);
      showDoc(key);
    });
  });
  showDoc(window.location.hash ? window.location.hash.slice(1) : POLICY_DOCS[0]);
})();

<script>
(function(){
  var API_BASE = window.VINATH_API_BASE || 'https://api.vinathtcm.com/api';
  // ChatMessageYes any 匿名访客都能Submit  content ， manage 员Open for 话时会看 to ——不转义就直接拼进innerHTML
  //  话，访客 can  at Message里塞HTML/脚本， at  manage 员已Login  browse 里执Row（ storage 型XSS).
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var CUSTOMER_ID_KEY = 'vinath_customer_chat_id';
  var pollTimer = null;
  var currentThread = null;
  var currentMessages = [];

  function getCustomerId(){
    try {
      var id = localStorage.getItem(CUSTOMER_ID_KEY);
      if(!id){ id = 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem(CUSTOMER_ID_KEY, id); }
      return id;
    } catch(e){ return 'cust_temp'; }
  }
  // Customer端第一次OpenChat面板时调用——后端会自动 process "这 personal Yes不Yes第一次来"、要不要插入欢迎语，
  // 前端不用再自己判断这些
  async function ensureMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/ensure-thread', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerId: getCustomerId() })
      });
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ console.error('Chat init failed:', e); return null; }
  }
  async function refreshMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/threads/' + getCustomerId());
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ return null; }
  }

  function renderMessages(){
    var body = document.getElementById('vhChatBody');
    var sub = document.getElementById('vhChatSub');
    if(!currentThread || !currentMessages.length){
      body.innerHTML = '<div class="vh-chat-empty">Hello, feel free to leave a message here and we will reply as soon as possible.</div>';
    } else {
      body.innerHTML = currentMessages.map(function(m){
        return '<div class="vh-chat-msg '+m.from+'">'+escapeHtml(m.text)+'</div>';
      }).join('');
      body.scrollTop = body.scrollHeight;
    }
    if(currentThread) sub.textContent = 'Chatting with ' + currentThread.assignedToName + '';
    updateBadge();
  }
  function updateBadge(){
    var badge = document.getElementById('vhChatBadge');
    var panelOpen = document.getElementById('vhChatPanel').classList.contains('open');
    if(currentThread && currentThread.unreadForCustomer && !panelOpen){
      badge.style.display = 'flex'; badge.textContent = '1';
    } else {
      badge.style.display = 'none';
    }
  }

  document.getElementById('vhChatFab').addEventListener('click', async function(){
    var panel = document.getElementById('vhChatPanel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      await ensureMyThread();
      renderMessages();
    }
    updateBadge();
  });
  document.getElementById('vhChatClose').addEventListener('click', function(){
    document.getElementById('vhChatPanel').classList.remove('open');
  });
  async function sendMsg(){
    var input = document.getElementById('vhChatInput');
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    input.disabled = true;
    try {
      await fetch(API_BASE + '/chat/threads/' + getCustomerId() + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      await refreshMyThread();
      renderMessages();
    } catch(e){ console.error('Send failed:', e); }
    input.disabled = false;
    input.focus();
  }
  document.getElementById('vhChatSend').addEventListener('click', sendMsg);
  document.getElementById('vhChatInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendMsg(); });

  // poll for admin replies / handoff changes while the widget is on screen
  pollTimer = setInterval(async function(){
    if(!currentThread) return; // 还没Open过Chat面板，没 necessary 轮询
    await refreshMyThread();
    renderMessages();
  }, 4000);
})();
</script>
