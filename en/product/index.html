<style>

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; min-height:100vh; background:#F7F3EC; font-family:"Noto Sans SC","PingFang SC",sans-serif; color:#3B2E22; }

:root{
  --tan:#C9A876; --tan-deep:#A07A45; --espresso:#3B2E22; --espresso-soft:#6E5F4E;
  --clay:#BC6E4E; --white-warm:#FFFDF9; --cream:#F7F3EC; --line:rgba(59,46,34,.10); --shadow:rgba(59,46,34,.13);
  --amber:#B8863C; --amber-soft:rgba(184,134,60,.13);
  --font-serif:"Noto Serif SC","Songti SC","STSong",serif;
  --font-en:"Cormorant Garamond",Georgia,serif;
  --pad: clamp(18px, 4.5vw, 44px);
}

.page{ max-width:760px; margin:0 auto; position:relative; }

.vh-header{ display:flex; align-items:center; justify-content:space-between; padding: clamp(16px,3vw,24px) var(--pad) clamp(14px,2.5vw,18px); }
.vh-header .side{ display:flex; align-items:center; gap:10px; min-width:0; }
.vh-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:clamp(24px,4vw,28px); letter-spacing:.15em; color:var(--espresso); white-space:nowrap; cursor:pointer; transition:letter-spacing .3s ease; }
.vh-tm{ font-variant:normal; font-size:.34em; vertical-align:super; opacity:.65; margin-left:1px; }
.vh-footer{ border-top:1px solid var(--line); margin-top:60px; padding:36px var(--pad) 30px; }
.vh-footer-top{ margin-bottom:16px; }
.vh-footer-brand{ font-family:var(--font-en); font-variant:small-caps; font-weight:600; font-size:15px; letter-spacing:.12em; color:var(--espresso); }
.vh-footer-bottom{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--espresso-soft); opacity:.8; }
.vh-footer-my{ font-weight:600; letter-spacing:.03em; white-space:nowrap; }
@media (max-width:480px){ .vh-footer-bottom{ flex-direction:column; align-items:flex-start; gap:5px; } }
.vh-brand:hover{ letter-spacing:.26em; }
.vh-icons{ display:flex; gap:18px; flex:none; }
.vh-ibtn{ display:flex; align-items:center; justify-content:center; color:var(--espresso); cursor:pointer; transition:opacity .15s, transform .15s; flex:none; position:relative; }
.vh-ibtn:hover{ opacity:.65; } .vh-ibtn:active{ transform:scale(.9); }
.cart-badge{ position:absolute; top:-7px; right:-9px; background:var(--clay); color:#fff; font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px; }
.vh-acct-wrap{ position:relative; display:flex; }
.vh-acct-menu{ position:absolute; top:calc(100% + 12px); right:-6px; background:var(--white-warm); border-radius:14px; box-shadow:0 14px 34px rgba(59,46,34,.18);
  padding:8px; min-width:140px; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:60; }
.vh-acct-menu.open{ opacity:1; pointer-events:auto; }
.vham-item{ padding:11px 14px; font-size:14px; border-radius:9px; cursor:pointer; color:var(--espresso); white-space:nowrap; }
.vham-item:hover{ background:var(--cream); }

.breadcrumb{ padding:0 var(--pad) 14px; font-size:13.5px; color:var(--espresso-soft); }
.breadcrumb .bc-link{ color:var(--tan-deep); cursor:pointer; font-weight:600; }
.breadcrumb .bc-link:hover{ text-decoration:underline; }
.breadcrumb .sep{ margin:0 7px; opacity:.5; }
.breadcrumb .bc-current{ color:var(--espresso-soft); }

.content{ padding: 4px var(--pad) clamp(48px,6vw,64px); }

/* ---- hero carousel ---- */
.pd-hero{ width:100%; aspect-ratio:5/4; border-radius:20px; overflow:hidden; position:relative; box-shadow:0 6px 22px var(--shadow); touch-action:pan-y; margin-bottom:22px; }
.pd-hero-track{ display:flex; width:100%; height:100%; transition:transform .4s cubic-bezier(.22,.61,.36,1); }
.pd-hero-slide{ flex:0 0 100%; height:100%; position:relative; background:linear-gradient(135deg,#F3EFE6,#EAE2D2); }
.pd-hero-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
.pd-hero-slide .pt-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--tan-deep); }
.pd-hero-slide .pt-icon svg{ width:18%; height:18%; }
.pd-dots{ position:absolute; bottom:14px; left:0; right:0; display:flex; justify-content:center; gap:6px; z-index:2; }
.pd-dot{ width:6px; height:6px; border-radius:3px; background:rgba(255,255,255,.55); transition:width .25s, background .25s; }
.pd-dot.on{ width:18px; background:#fff; }
.pd-hero-nav{ position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; background:rgba(255,253,249,.88); display:flex; align-items:center; justify-content:center; color:var(--espresso); cursor:pointer; z-index:2; transition:opacity .2s; box-shadow:0 2px 8px var(--shadow); }
.pd-hero-nav.prev{ left:12px; } .pd-hero-nav.next{ right:12px; }
.pd-hero-nav.hide{ opacity:0; pointer-events:none; }
.pd-oos-badge{ position:absolute; top:14px; left:14px; background:rgba(40,31,22,.85); color:#FDF8F0; font-size:12px; padding:5px 12px; border-radius:14px; font-weight:600; z-index:2; }
.pd-wish{ position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:50%; background:rgba(255,253,249,.92); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:2; box-shadow:0 2px 8px var(--shadow); }
.pd-wish svg{ stroke:var(--espresso-soft); transition:.15s; }
.pd-wish.on svg{ fill:var(--clay); stroke:var(--clay); }

/* ---- title/buy block ---- */
.pd-type{ font-size:12px; font-weight:700; color:var(--tan-deep); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
.pd-name{ font-family:var(--font-serif); font-weight:700; font-size:clamp(26px,5vw,32px); margin-bottom:10px; }
.pd-desc{ font-size:15px; color:var(--espresso-soft); line-height:1.8; margin-bottom:22px; }

.pd-variants{ display:flex; gap:10px; margin-bottom:18px; }
.pd-variant{ flex:1; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; cursor:pointer; transition:.15s; }
.pd-variant.on{ border-color:var(--clay); background:rgba(188,110,78,.07); }
.pd-variant .vv-lbl{ font-size:12.5px; color:var(--espresso-soft); font-weight:600; }
.pd-variant .vv-price{ font-family:var(--font-serif); font-weight:700; font-size:17px; margin-top:3px; }

.pd-qty-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.pd-qty-label{ font-size:13px; font-weight:700; color:var(--espresso-soft); }
.pd-stepper{ display:flex; align-items:center; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; }
.pd-step-btn{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--espresso); font-size:17px; background:var(--white-warm); user-select:none; }
.pd-qty-num{ width:42px; text-align:center; font-weight:700; font-size:15px; }

.pd-oos-msg{ font-size:13px; color:var(--clay); background:rgba(188,110,78,.08); border-radius:10px; padding:10px 14px; margin-bottom:16px; }
.pd-add{ width:100%; background:var(--espresso); color:#fff; border:none; padding:16px; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer; transition:opacity .15s; }
.pd-add:hover{ opacity:.9; } .pd-add:disabled{ opacity:.4; cursor:not-allowed; }

/* ---- content sections ---- */
.pd-section{ margin-top:40px; }
.pd-section-title{ font-family:var(--font-serif); font-weight:700; font-size:19px; margin-bottom:16px; }

.pd-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.pd-tag{ font-size:12.5px; padding:6px 13px; border-radius:16px; background:var(--white-warm); border:1px solid var(--line); color:var(--espresso-soft); }
.pd-journey-link{ font-size:13.5px; color:var(--tan-deep); cursor:pointer; font-weight:600; }
.pd-journey-link:hover{ text-decoration:underline; }
.pd-no-tag{ font-size:13.5px; color:var(--espresso-soft); font-style:italic; }

.pd-form-row{ display:flex; gap:8px; align-items:baseline; margin-bottom:16px; font-size:14px; }
.pd-form-row .fl{ color:var(--espresso-soft); flex:none; }
.pd-herb-label{ font-size:11.5px; font-weight:700; color:var(--espresso-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:9px; }
.pd-herb-chips{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:18px; }
.pd-herb-chip{ font-size:14px; font-weight:600; padding:7px 15px; border-radius:16px; background:var(--white-warm); border:1px solid var(--line); color:var(--espresso); }
.pd-usage-box{ background:var(--white-warm); border-radius:14px; padding:16px 18px; font-size:14.5px; line-height:1.85; color:var(--espresso); }
.pd-usage-box b{ color:var(--tan-deep); }

.pd-safety{ background:transparent; border:1.5px dashed var(--tan); border-radius:16px; padding:18px 20px; font-size:13px; line-height:1.9; color:var(--espresso-soft); }
.pd-safety li{ margin-bottom:6px; }
.pd-safety ul{ margin:0; padding-left:18px; }

.related-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:14px; }
.related-card{ cursor:pointer; }
.related-thumb{ width:100%; aspect-ratio:4/3; border-radius:12px; overflow:hidden; position:relative; box-shadow:0 3px 10px var(--shadow); background:linear-gradient(135deg,#F3EFE6,#EAE2D2); }
.related-thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease; }
.related-thumb .pt-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--tan-deep); transition:transform .35s ease; }
.related-thumb .pt-icon svg{ width:26%; height:26%; }
.related-card:hover .related-thumb img, .related-card:hover .related-thumb .pt-icon{ transform:scale(1.08); }
.related-name{ font-family:var(--font-serif); font-weight:700; font-size:13.5px; margin-top:8px; }
.related-price{ font-size:12px; color:var(--tan-deep); font-weight:600; margin-top:2px; }

.not-found{ text-align:center; padding:80px 20px; color:var(--espresso-soft); }

.vh-toast{ position:fixed; left:50%; bottom:22px; transform:translate(-50%,10px); background:rgba(40,31,22,.94); color:#FDF8F0; font-size:15px; padding:11px 20px;
  border-radius:20px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:70; max-width:88vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.vh-toast.show{ opacity:1; transform:translate(-50%,0); }
</style>

  // [stated bug fix] same gap as 商店 had — this page ran off its own frozen product copy with
  // zero connection to 商品管理. Now overlays the shared catalog onto this page's own copy before
  // building the id-index below, so edits made in the admin tool (price/stock/desc/etc.) show up
  // here too.
  function mergeCatalogFromStorage(){
    try {
      var raw = localStorage.getItem('vinath_product_catalog');
      if(!raw) return;
      var byId = {};
      JSON.parse(raw).forEach(function(c){ byId[c.id] = c; });
      PRODUCTS.forEach(function(p){
        var c = byId[p.id];
        if(!c) return;
        if(typeof c.stockQty === 'number'){ p.stockQty = c.stockQty; p.inStock = c.stockQty > 0; }
        if(c.name) p.name = c.name;
        if(c.nameEn !== undefined) p.nameEn = c.nameEn;
        if(typeof c.price === 'number') p.price = c.price;
        if(c.type) p.type = c.type;
        if(typeof c.trial === 'number') p.trial = c.trial;
        if(c.desc !== undefined) p.desc = c.desc;
        if(typeof c.active === 'boolean') p.active = c.active;
        if(typeof c.featured === 'boolean') p.featured = c.featured;
        if(c.tags) p.tags = c.tags;
        if(c.journeys) p.journeys = c.journeys;
        if(c.form !== undefined) p.form = c.form;
        if(c.herbs) p.herbs = c.herbs;
        if(c.usage !== undefined) p.usage = c.usage;
        if(c.imgs && c.imgs.length) p.imgs = c.imgs;
      });
    } catch(e){}
  }
  // [stated] 这个文items后面几百行有不少直接依赖 PRODUCTS_BY_ID / product 已经就绪的同步代码，
  // 分散得比较开，贸然大范围改成异步回调风险较高。这里用同步XHR请求(虽然是过时写法，
  // 但只在页面刚打开这一下用，不影响交互流畅度)，保持原来的代码结构不用大动，
  // 只把数据来源从写死的数组换成真实后端。
  var API_BASE = window.VINATH_API_BASE || 'https://api.vinathtcm.com/api';
  (function loadProductsFromBackendSync(){
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', API_BASE + '/products', false); // false = 同步
      xhr.send(null);
      if(xhr.status === 200){
        var backendProducts = JSON.parse(xhr.responseText);
        PRODUCTS.length = 0;
        backendProducts.forEach(function(p){
          PRODUCTS.push({ id:p.id, name:p.name, nameEn:p.name_en, type:p.type, price:p.price,
            trial:(typeof p.trial_price === 'number' ? p.trial_price : p.price),
            desc:p.description, active:p.active, inStock:p.stock_qty > 0, stockQty:p.stock_qty,
            featured:p.featured, imgs:p.images||[], form:'', herbs:[], usage:p.usage_note||'',
            journeys:[], tags:[] });
        });
      }
    } catch(e){ console.error('连接后端失败:', e); }
  })();

  var TAG_LOOKUP = {};
  Object.keys(TAG_DATA).forEach(function(journey){
    TAG_DATA[journey].forEach(function(g){
      g.tags.forEach(function(tag){ TAG_LOOKUP[tag] = {journey:journey, cond:g.cond}; });
    });
  });
  var PRODUCTS_BY_ID = {};
  PRODUCTS.forEach(function(p){ PRODUCTS_BY_ID[p.id] = p; });

  function cartFromURL(){
    var raw = new URLSearchParams(window.location.search).get('cart');
    if(!raw) return [];
    return raw.split(',').map(function(chunk){
      var parts = chunk.split(':'); var id = parts[0];
      return id ? {id:id, variant:(parts[1]==='t'?'trial':'full'), qty:Number(parts[2])||1} : null;
    }).filter(Boolean);
  }
  function cartToParam(items){ return items.map(function(it){ return it.id+':'+(it.variant==='trial'?'t':'f')+':'+it.qty; }).join(','); }
  function withCart(url, items){
    var cartStr = cartToParam(items);
    if(!cartStr) return url;
    var hashIdx = url.indexOf('#');
    var hash = hashIdx === -1 ? '' : url.slice(hashIdx);
    var base = hashIdx === -1 ? url : url.slice(0, hashIdx);
    return base + (base.indexOf('?')===-1 ? '?' : '&') + 'cart=' + encodeURIComponent(cartStr) + hash;
  }
  var cartItems = cartFromURL();
  function cartTotalQty(){ return cartItems.reduce(function(s,it){ return s+it.qty; }, 0); }
  function updateCartBadge(){
    var total = cartTotalQty();
    var badge = document.getElementById('cartBadge');
    badge.textContent = total;
    badge.style.display = total > 0 ? 'flex' : 'none';
  }

  var params = new URLSearchParams(window.location.search);
  var productId = params.get('id');
  // ---- 收藏/心愿单: per-browser/per-device, same as the shopping cart (no login system exists) ----
  var WISHLIST_KEY = 'vinath_wishlist';
  function getWishlist(){
    try { var raw = localStorage.getItem(WISHLIST_KEY); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
  }
  function saveWishlist(list){ try { localStorage.setItem(WISHLIST_KEY, JSON.stringify(list)); } catch(e){} }
  function isWishlisted(id){ return getWishlist().indexOf(id) !== -1; }
  function toggleWishlist(id){
    var list = getWishlist();
    var idx = list.indexOf(id);
    var isAdding = idx===-1;
    if(isAdding) list.push(id); else list.splice(idx,1);
    saveWishlist(list);
    // 这条收藏/Cancel收藏动作同时上报给后端做匿名聚合统计（"这items商品现在有多少人收藏着"）；
    // 客户自己的收藏列表本身还是留在本地——这个项目没有真实客户账号体系，没法做到真正跨设备同步
    if(product){
      fetch(API_BASE + '/analytics/wishlist-event', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId:id, productName:product.name, action: isAdding?'add':'remove' })
      }).catch(function(){});
    }
  }

  var product = PRODUCTS_BY_ID[productId];

  if(product){
    fetch(API_BASE + '/analytics/pageview', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ page: 'Product Details-' + product.name })
    }).catch(function(){});
    // 商品关注度统计——记录停留时长，方便后台看"用户对哪些商品感兴趣（停留时间较长）"；
    // 离开/切到后台标签页/关闭页面都会触发一次，只记一次，避免重复计入。用 fetch 搭配
    // keepalive:true（不是 navigator.sendBeacon）——实测过 sendBeacon 在这个环境下发出的请求
    // 在网络层直接失败，根本到不了服务端；keepalive就是fetch专门为"页面卸载前仍要发出去"
    // 这种场景设计的选项，跟这个项目里其他地方一直稳定工作的fetch用的是同一套机制。
    (function(){
      var startTime = Date.now();
      var logged = false;
      function logInterest(){
        if(logged) return;
        logged = true;
        fetch(API_BASE + '/analytics/product-interest', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
          body: JSON.stringify({ productId: product.id, productName: product.name, dwellMs: Date.now()-startTime })
        }).catch(function(){});
      }
      window.addEventListener('beforeunload', logInterest);
      document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') logInterest(); });
    })();
  }

  var selectedVariant = 'full';
  var qty = 1;
  var imgIdx = 0;
  var pdImgs = [];

  function renderNotFound(){
    document.getElementById('breadcrumb').innerHTML = '<span class="bc-link" id="bcHome">Home</span><span class="sep">›</span><span class="bc-link" id="bcShop">商店</span><span class="sep">›</span><span class="bc-current">商品未找到</span>';
    document.getElementById('mainContent').innerHTML = '<div class="not-found">没有找到这个商品，可能已下架或链接有误。</div>';
    bindHeaderNav();
  }

  function renderPdImage(){
    document.getElementById('pdTrack').style.transform = 'translateX(-'+(imgIdx*100)+'%)';
    document.querySelectorAll('.pd-dot').forEach(function(d,i){ d.classList.toggle('on', i===imgIdx); });
    var prevBtn = document.getElementById('pdPrev'), nextBtn = document.getElementById('pdNext');
    if(prevBtn) prevBtn.classList.toggle('hide', imgIdx===0 || pdImgs.length<2);
    if(nextBtn) nextBtn.classList.toggle('hide', imgIdx===pdImgs.length-1 || pdImgs.length<2);
  }
  function goPdImg(i){ imgIdx = Math.max(0, Math.min(pdImgs.length-1, i)); renderPdImage(); }

  function buildHero(){
    var hasImgs = product.imgs && product.imgs.length;
    pdImgs = hasImgs ? product.imgs.slice() : [null];
    var slides = pdImgs.map(function(src){
      return '<div class="pd-hero-slide">' + (src ? '<img src="'+src+'" alt="'+product.name+'">' : '<div class="pt-icon">'+(ICON[product.type]||GENERIC_CAT_ICON)+'</div>') + '</div>';
    }).join('');
    var dots = pdImgs.length>1 ? pdImgs.map(function(_,i){ return '<span class="pd-dot'+(i===0?' on':'')+'"></span>'; }).join('') : '';
    return '<div class="pd-hero" id="pdHero">'
      + (!product.inStock ? '<div class="pd-oos-badge">暂时Out of Stock</div>' : '')
      + '<span class="pd-wish'+(isWishlisted(product.id)?' on':'')+'" id="pdWishBtn"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9C.5 8 2 4 6 4c2 0 3.5 1 4 2 .5-1 2-2 4-2 4 0 5.5 4 3.5 8-2.5 4.5-9.5 9-9.5 9z"/></svg></span>'
      + '<div class="pd-hero-track" id="pdTrack">'+slides+'</div>'
      + '<div class="pd-hero-nav prev hide" id="pdPrev"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg></div>'
      + '<div class="pd-hero-nav next hide" id="pdNext"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5l7 7-7 7"/></svg></div>'
      + '<div class="pd-dots">'+dots+'</div></div>';
  }

  function buildFormulaSection(){
    if(!product.herbs || !product.herbs.length) return '';
    var chips = product.herbs.map(function(h){ return '<span class="pd-herb-chip">'+h.herb+'</span>'; }).join('');
    return '<div class="pd-section"><div class="pd-section-title">Formula & Usage</div>'
      + '<div class="pd-form-row"><span class="fl">剂型</span><span>'+product.form+'</span></div>'
      + '<div class="pd-herb-label">Ingredients</div>'
      + '<div class="pd-herb-chips">'+chips+'</div>'
      + '<div class="pd-usage-box"><b>用法：</b>'+product.usage+'</div>'
      + '</div>';
  }

  function buildSafetySection(){
    var items = [];
    if(product.type === 'plaster'){
      items.push('首次使用建议先小面积试敷，观察是否有皮肤sensitivity反应；皮肤破损或有炎症的部位禁用。');
    } else if(product.type === 'tea'){
      items.push('本品为药食同源材料的日常wellness配伍，并非诊断治疗用药；症状持续或加重，建议及时咨询专业医师。');
    } else if(product.type === 'soak'){
      items.push('Topical Use煎汤，menstrual period或阴道出血期间请暂停使用。');
    } else if(product.type === 'mask'){
      items.push('使用前建议先在耳后或手腕内侧小范围试用，无不适再用于面部。');
    }
    if(product.herbs && product.herbs.some(function(h){ return CAUTION_HERBS.indexOf(h.herb)!==-1; })){
      items.push('配方中含activate blood类药材，孕期请勿使用，如有疑问建议先咨询医师。');
    }
    items.push('中医讲究syndrome differentiation论治、因人而异，如需更精准的个性化方案，建议通过「Meet Now」预约一对一咨询。');
    return '<div class="pd-section"><div class="pd-section-title">Usage Notes</div><div class="pd-safety"><ul>'
      + items.map(function(i){ return '<li>'+i+'</li>'; }).join('')
      + '</ul></div></div>';
  }

  function buildRelatedSection(){
    var related = PRODUCTS.filter(function(p){
      return p.id !== product.id && p.active && p.type === product.type;
    });
    if(!related.length) return '';
    var cards = related.slice(0, 8).map(function(p){
      var hasImg = p.imgs && p.imgs[0];
      return '<div class="related-card" data-id="'+p.id+'">'
        + '<div class="related-thumb">' + (hasImg ? '<img src="'+p.imgs[0]+'" alt="'+p.name+'">' : '<div class="pt-icon">'+(ICON[p.type]||GENERIC_CAT_ICON)+'</div>') + '</div>'
        + '<div class="related-name">'+p.name+'</div><div class="related-price">MYR '+p.trial+' 起</div></div>';
    }).join('');
    return '<div class="pd-section"><div class="pd-section-title">同类商品 · '+TYPE_LABEL[product.type]+'</div><div class="related-grid">'+cards+'</div></div>';
  }

  function render(){
    document.getElementById('breadcrumb').innerHTML = '<span class="bc-link" id="bcHome">Home</span><span class="sep">›</span><span class="bc-link" id="bcShop">商店</span><span class="sep">›</span><span class="bc-current">'+product.name+'</span>';

    var html = buildHero();
    html += '<div class="pd-type">'+TYPE_LABEL[product.type]+'</div>';
    html += '<div class="pd-name">'+product.name+'</div>';
    html += '<div class="pd-desc">'+product.desc+'</div>';

    html += '<div class="pd-variants">'
      + '<div class="pd-variant on" data-v="full"><div class="vv-lbl">正装</div><div class="vv-price">MYR '+product.price+'</div></div>'
      + '<div class="pd-variant" data-v="trial"><div class="vv-lbl">试用装</div><div class="vv-price">MYR '+product.trial+'</div></div>'
      + '</div>';

    html += '<div class="pd-qty-row"><div class="pd-qty-label">Quantity</div>'
      + '<div class="pd-stepper"><div class="pd-step-btn" id="pdMinus">－</div><div class="pd-qty-num" id="pdQtyNum">1</div><div class="pd-step-btn" id="pdPlus">＋</div></div></div>';

    if(!product.inStock) html += '<div class="pd-oos-msg">这款暂时Out of Stock，补货后会自动恢复上架。</div>';
    html += '<button class="pd-add" id="pdAdd"'+(product.inStock?'':' disabled')+'>'+(product.inStock?'Add to Cart':'暂时Out of Stock')+'</button>';

    html += buildFormulaSection();
    html += buildSafetySection();
    html += buildRelatedSection();

    document.getElementById('mainContent').innerHTML = html;
    bindPageEvents();
    updateCartBadge();
  }

  function bindPageEvents(){
    document.querySelectorAll('.pd-variant').forEach(function(v){
      v.addEventListener('click', function(){
        selectedVariant = this.getAttribute('data-v');
        document.querySelectorAll('.pd-variant').forEach(function(x){ x.classList.remove('on'); });
        this.classList.add('on');
      });
    });
    document.getElementById('pdMinus').addEventListener('click', function(){
      qty = Math.max(1, qty-1);
      document.getElementById('pdQtyNum').textContent = qty;
    });
    document.getElementById('pdPlus').addEventListener('click', function(){
      qty += 1;
      document.getElementById('pdQtyNum').textContent = qty;
    });
    var addBtn = document.getElementById('pdAdd');
    if(addBtn){
      addBtn.addEventListener('click', function(){
        if(!product.inStock) return;
        var existing = cartItems.find(function(it){ return it.id===product.id && it.variant===selectedVariant; });
        if(existing){ existing.qty += qty; } else { cartItems.push({id:product.id, variant:selectedVariant, qty:qty}); }
        updateCartBadge();
        var variantLbl = selectedVariant==='trial' ? '试用装' : '正装';
        showToast('已Add to Cart：'+product.name+'（'+variantLbl+'）×'+qty);
      });
    }
    var prevBtn = document.getElementById('pdPrev'), nextBtn = document.getElementById('pdNext');
    if(prevBtn) prevBtn.addEventListener('click', function(){ goPdImg(imgIdx-1); });
    if(nextBtn) nextBtn.addEventListener('click', function(){ goPdImg(imgIdx+1); });
    var wishBtn = document.getElementById('pdWishBtn');
    if(wishBtn) wishBtn.addEventListener('click', function(){
      toggleWishlist(product.id);
      wishBtn.classList.toggle('on');
    });
    var hero = document.getElementById('pdHero');
    if(hero){
      var sx=0, dx=0, touching=false;
      var track = document.getElementById('pdTrack');
      hero.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; dx=0; touching=true; track.style.transition='none'; }, {passive:true});
      hero.addEventListener('touchmove', function(e){
        if(!touching) return;
        dx = e.touches[0].clientX - sx;
        var eff = dx;
        if((imgIdx===0 && dx>0) || (imgIdx===pdImgs.length-1 && dx<0)) eff = dx*0.35;
        track.style.transform = 'translateX(calc(-'+(imgIdx*100)+'% + '+eff+'px))';
      }, {passive:true});
      hero.addEventListener('touchend', function(){
        touching=false; track.style.transition='';
        if(Math.abs(dx)>40){ dx<0 ? goPdImg(imgIdx+1) : goPdImg(imgIdx-1); } else { renderPdImage(); }
        dx=0;
      });
    }
    document.querySelectorAll('.related-card').forEach(function(c){
      c.addEventListener('click', function(){
        window.location.href = withCart('/product/?id=' + this.getAttribute('data-id'), cartItems);
      });
    });
    bindHeaderNav();
  }

  function bindHeaderNav(){
    document.getElementById('brandBtn').addEventListener('click', function(){ window.location.href = withCart('/', cartItems); });
    document.getElementById('bcHome').addEventListener('click', function(){ window.location.href = withCart('/', cartItems); });
    document.getElementById('bcShop').addEventListener('click', function(){ window.location.href = withCart('/shop/', cartItems); });
    document.getElementById('searchBtn').addEventListener('click', function(){ showToast('Search · Coming soon'); });
    var vhAcctMenu = document.getElementById('vhAcctMenu');
  document.getElementById('acctBtn').addEventListener('click', function(e){
    e.stopPropagation();
    vhAcctMenu.classList.toggle('open');
  });
  document.getElementById('vhamOrder').addEventListener('click', function(){
    window.location.href = withCart('/orders/', cartItems);
  });
  document.getElementById('vhamBooking').addEventListener('click', function(){
    window.location.href = withCart('/bookings/', cartItems);
  });
  document.addEventListener('click', function(){ vhAcctMenu.classList.remove('open'); });
  vhAcctMenu.addEventListener('click', function(e){ e.stopPropagation(); });
    document.getElementById('cartBtn').addEventListener('click', function(){
      if(!cartItems.length){ showToast('Cart is empty'); return; }
      var encoded = cartItems.map(function(it){ return it.id+':'+(it.variant==='trial'?'t':'f')+':'+it.qty; }).join(',');
      window.location.href = '/checkout/?cart=' + encodeURIComponent(encoded);
    });
  }

  var toast = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  if(product){ render(); } else { renderNotFound(); }
})();
</script>

<script>
(function(){
  var API_BASE = window.VINATH_API_BASE || 'https://api.vinathtcm.com/api';
  // 聊天消息是任何匿名访客都能Submit的内容，管理员打开对话时会看到——不转义就直接拼进innerHTML
  // 的话，访客可以在消息里塞HTML/脚本，在管理员已登录的浏览器里执行（存储型XSS）。
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var CUSTOMER_ID_KEY = 'vinath_customer_chat_id';
  var pollTimer = null;
  var currentThread = null;
  var currentMessages = [];

  function getCustomerId(){
    try {
      var id = localStorage.getItem(CUSTOMER_ID_KEY);
      if(!id){ id = 'cust_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem(CUSTOMER_ID_KEY, id); }
      return id;
    } catch(e){ return 'cust_temp'; }
  }
  // 客户端第一次打开聊天面板时调用——后端会自动处理"这个人是不是第一次来"、要不要插入欢迎语，
  // 前端不用再自己判断这些
  async function ensureMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/ensure-thread', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerId: getCustomerId() })
      });
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ console.error('Chat init failed:', e); return null; }
  }
  async function refreshMyThread(){
    try {
      var res = await fetch(API_BASE + '/chat/threads/' + getCustomerId());
      if(!res.ok) return null;
      var data = await res.json();
      currentThread = data.thread;
      currentMessages = data.messages;
      return currentThread;
    } catch(e){ return null; }
  }

  function renderMessages(){
    var body = document.getElementById('vhChatBody');
    var sub = document.getElementById('vhChatSub');
    if(!currentThread || !currentMessages.length){
      body.innerHTML = '<div class="vh-chat-empty">Hello, feel free to leave a message here and we will reply as soon as possible.</div>';
    } else {
      body.innerHTML = currentMessages.map(function(m){
        return '<div class="vh-chat-msg '+m.from+'">'+escapeHtml(m.text)+'</div>';
      }).join('');
      body.scrollTop = body.scrollHeight;
    }
    if(currentThread) sub.textContent = 'Chatting with ' + currentThread.assignedToName + '';
    updateBadge();
  }
  function updateBadge(){
    var badge = document.getElementById('vhChatBadge');
    var panelOpen = document.getElementById('vhChatPanel').classList.contains('open');
    if(currentThread && currentThread.unreadForCustomer && !panelOpen){
      badge.style.display = 'flex'; badge.textContent = '1';
    } else {
      badge.style.display = 'none';
    }
  }

  document.getElementById('vhChatFab').addEventListener('click', async function(){
    var panel = document.getElementById('vhChatPanel');
    panel.classList.toggle('open');
    if(panel.classList.contains('open')){
      await ensureMyThread();
      renderMessages();
    }
    updateBadge();
  });
  document.getElementById('vhChatClose').addEventListener('click', function(){
    document.getElementById('vhChatPanel').classList.remove('open');
  });
  async function sendMsg(){
    var input = document.getElementById('vhChatInput');
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    input.disabled = true;
    try {
      await fetch(API_BASE + '/chat/threads/' + getCustomerId() + '/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
      });
      await refreshMyThread();
      renderMessages();
    } catch(e){ console.error('Send failed:', e); }
    input.disabled = false;
    input.focus();
  }
  document.getElementById('vhChatSend').addEventListener('click', sendMsg);
  document.getElementById('vhChatInput').addEventListener('keydown', function(e){ if(e.key==='Enter') sendMsg(); });

  // poll for admin replies / handoff changes while the widget is on screen
  pollTimer = setInterval(async function(){
    if(!currentThread) return; // 还没打开过聊天面板，没必要轮询
    await refreshMyThread();
    renderMessages();
  }, 4000);
})();
</script>
