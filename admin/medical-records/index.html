<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINATH · 电子病历</title>
<style>
:root{
  --clay:#BC6E4E; --clay-soft:rgba(188,110,78,.12);
  --tan:#C9A876; --line:#E6E1D6; --ink:#332A21; --ink-soft:#7A6F60;
  --white:#FFFFFF; --shadow:0 3px 14px rgba(51,42,33,.07);
  --amber:#B8863C; --amber-soft:rgba(184,134,60,.13);
  --font-serif:"Noto Serif SC",serif;
}
*{box-sizing:border-box;}
body{ margin:0; font-family:"Noto Sans SC",sans-serif; background:#FBF8F3; color:var(--ink); }
.wrap{ max-width:1080px; margin:0 auto; padding:26px 20px 80px; }
h1{ font-family:var(--font-serif); font-size:22px; margin:0 0 4px; }
.sub{ color:var(--ink-soft); font-size:13.5px; margin-bottom:20px; }
.proto-banner{ background:var(--amber-soft); border:1px solid rgba(184,134,60,.3); border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.65; color:#6B4E1E; margin-bottom:22px; }
.card{ background:var(--white); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; margin-bottom:16px; }
.section-title{ font-weight:700; font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.section-title .zh-tag{ background:var(--clay); color:#fff; font-size:11px; padding:2px 8px; border-radius:100px; font-weight:700; }
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-bottom:7px; }
.field input[type=text], .field textarea, .field select{ width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font-family:inherit; font-size:13.5px; }
.field textarea{ min-height:70px; resize:vertical; }
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:7px 14px; border:1.5px solid var(--line); border-radius:100px; font-size:13px; cursor:pointer; transition:.15s; background:#fff; }
.chip.on{ border-color:var(--clay); background:var(--clay-soft); color:var(--clay); font-weight:700; }
.custom-input{ width:100%; margin-top:9px; padding:8px 12px; border:1.5px dashed var(--line); border-radius:9px; font-family:inherit; font-size:12.5px; color:var(--ink); background:#FBF8F3; }
.custom-input::placeholder{ color:var(--ink-soft); }
.custom-input:focus{ border-color:var(--clay); background:#fff; outline:none; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }
.btn-primary{ background:var(--clay); color:#fff; border:none; border-radius:10px; padding:11px 22px; font-size:14px; font-weight:700; cursor:pointer; }
.btn-primary:hover{ opacity:.9; }
.btn-secondary{ background:none; border:1.5px solid var(--line); color:var(--ink); border-radius:10px; padding:10px 20px; font-size:13.5px; cursor:pointer; }
.top-actions{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
.patient-search{ display:flex; gap:8px; }
.patient-search input{ padding:10px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:13.5px; width:220px; }
.patient-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border:1.5px solid var(--line); border-radius:12px; margin-bottom:8px; cursor:pointer; transition:.15s; }
.patient-row:hover{ border-color:var(--clay); background:var(--clay-soft); }
.patient-row .pname{ font-weight:700; font-size:14.5px; }
.patient-row .pmeta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
.empty-state{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px; }
.body-diagram-wrap{ display:flex; gap:20px; flex-wrap:wrap; }
.body-svg-box{ flex:none; text-align:center; }
.body-view-toggle{ display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
.body-view-toggle .chip{ padding:5px 16px; }
.acu-point{ cursor:pointer; }
.acu-point circle{ fill:var(--tan); stroke:var(--white); stroke-width:1.5; transition:.15s; }
.acu-point:hover circle{ fill:var(--clay); r:6; }
.acu-point.selected circle{ fill:var(--clay); stroke:var(--amber); stroke-width:2; }
.acu-point-label{ font-size:8px; fill:var(--ink-soft); pointer-events:none; }
.selected-points-list{ flex:1; min-width:260px; }
.point-tag{ background:var(--clay-soft); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
.point-tag-hd{ display:flex; align-items:center; justify-content:space-between; }
.point-tag .pname{ font-weight:700; font-size:13.5px; color:var(--clay); }
.point-tag select{ font-size:12.5px; padding:5px 8px; border-radius:7px; border:1.5px solid var(--line); margin-left:8px; }
.point-tag .remove-pt{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:0 4px; }
.point-tag .pt-notes{ width:100%; margin-top:7px; padding:6px 10px; border:1.5px solid var(--line); border-radius:7px; font-family:inherit; font-size:12px; box-sizing:border-box; }
.point-tag .pt-method-other{ width:120px; margin-left:6px; padding:5px 8px; border:1.5px solid var(--line); border-radius:7px; font-family:inherit; font-size:12px; }
.photo-upload-grid{ display:flex; flex-wrap:wrap; gap:12px; }
.photo-box{ width:96px; height:96px; border-radius:12px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position:relative; background:var(--white); }
.photo-box img{ width:100%; height:100%; object-fit:cover; }
.photo-box .del-photo{ position:absolute; top:3px; right:3px; background:rgba(0,0,0,.55); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; cursor:pointer; }
.photo-box span{ font-size:11px; color:var(--ink-soft); text-align:center; padding:0 6px; }
.photo-box img.zoomable, .timeline-photos img.zoomable{ cursor:zoom-in; }
#photoLightbox{ position:fixed; inset:0; background:rgba(0,0,0,.78); display:none; align-items:center; justify-content:center; z-index:999; cursor:zoom-out; }
#photoLightbox img{ max-width:92vw; max-height:90vh; border-radius:10px; box-shadow:0 8px 40px rgba(0,0,0,.5); }
.timeline{ position:relative; padding-left:22px; }
.timeline::before{ content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line); }
.timeline-item{ position:relative; margin-bottom:22px; }
.timeline-item-clickable{ cursor:pointer; border-radius:10px; padding:8px 10px; margin-left:-10px; transition:.15s; }
.timeline-item-clickable:hover{ background:var(--clay-soft); }
.timeline-edit-hint{ float:right; color:var(--clay); font-weight:700; opacity:0; transition:.15s; }
.timeline-item-clickable:hover .timeline-edit-hint{ opacity:1; }
.timeline-item::before{ content:''; position:absolute; left:-22px; top:4px; width:11px; height:11px; border-radius:50%; background:var(--clay); border:2px solid var(--white); box-shadow:0 0 0 1.5px var(--clay); }
.timeline-date{ font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
.type-badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:100px; margin-right:8px; letter-spacing:.02em; }
.tb-record{ background:var(--clay-soft); color:var(--clay); }
.tb-booking{ background:var(--amber-soft); color:var(--amber); }
.tb-rx{ background:rgba(122,139,111,.18); color:#5A7350; }
.timeline-photos{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.timeline-photos img{ width:64px; height:64px; object-fit:cover; border-radius:8px; }
.warn{ color:#B0503A; font-size:12.5px; margin-top:6px; display:none; }
.warn.show{ display:block; }
.login-gate{ max-width:480px; margin:80px auto; text-align:center; padding:0 20px; }
.admin-toast{ position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:12px 22px; border-radius:100px; font-size:13.5px; box-shadow:0 10px 28px rgba(0,0,0,.22); z-index:200; opacity:0; pointer-events:none; transition:.25s; }
.admin-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
.vinath-admin-nav{ background:#332A21; }
.vinath-admin-nav-inner{ max-width:1200px; margin:0 auto; display:flex; gap:2px; padding:0 20px; overflow-x:auto; }
.van-item{ color:rgba(255,255,255,.62); font-size:13px; padding:13px 14px; text-decoration:none; white-space:nowrap; border-bottom:2.5px solid transparent; display:inline-block; }
.van-item:hover{ color:#fff; }
.van-item.current{ color:#fff; border-bottom-color:#BC6E4E; font-weight:700; }
/* ---- 合并后的工具 Tab（病历 / 协定方） ---- */
.tool-tabs{ display:flex; gap:8px; margin-bottom:18px; }
.tool-tab{ padding:9px 20px; border:1.5px solid var(--line); border-radius:100px; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; background:#fff; transition:.15s; }
.tool-tab.on{ border-color:var(--clay); background:var(--clay-soft); color:var(--clay); }
/* ---- 处方区块（病历表单内嵌 / 独立开方视图共用） ---- */
.rx-enable-row{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:var(--ink); cursor:pointer; margin-bottom:4px; }
.rx-enable-row input{ width:17px; height:17px; accent-color:var(--clay); }
.herb-item-row{ display:grid; grid-template-columns:1.6fr .8fr 1.4fr auto; gap:8px; margin-bottom:8px; align-items:center; }
@media (max-width:640px){ .herb-item-row{ grid-template-columns:1fr; } }
.herb-item-row input{ padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px; }
.remove-herb{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:17px; }
.rx-from-formula{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.rx-from-formula select{ padding:8px 10px; border:1.5px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px; flex:1 1 180px; }
.rx-from-formula .btn-small{ background:var(--clay-soft); color:var(--clay); border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; }
/* ---- 协定方列表 ---- */
.formula-row{ border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.formula-row-hd{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.formula-row .fname{ font-weight:700; font-size:14.5px; }
.formula-row .fmeta{ font-size:12px; color:var(--ink-soft); margin-top:3px; }
.formula-actions{ display:flex; gap:8px; }
.formula-actions button{ background:none; border:1.5px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 12px; font-size:12.5px; cursor:pointer; }
.formula-actions button.f-edit{ color:var(--clay); border-color:var(--clay); }
.formula-actions button.f-del{ color:#B0503A; border-color:rgba(176,80,58,.4); }
.f-type-badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:100px; background:var(--amber-soft); color:var(--amber); margin-right:6px; }
.warn{ color:#B0503A; font-size:12.5px; margin-top:6px; display:none; }
.warn.show{ display:block; }

</style>

<body>

<div class="vinath-admin-nav" id="vinathAdminNav"></div>
<div id="app"></div>
<div class="admin-toast" id="adminToast"></div>

<script>
if(window.history.scrollRestoration) window.history.scrollRestoration = "manual";
window.scrollTo(0,0);

(function(){
  async function renderVinathAdminNav(navAdmin){
    if(!navAdmin) return;
    var ALL_ADMIN_TOOLS = [
      {label:'订单预约管理', file:'/admin/orders/', roles:['senior','practitioner','fulfillment','support']},
      {label:'商品管理', file:'/admin/products/', roles:['senior']},
      {label:'内容管理', file:'/admin/content/', roles:['senior']},
      {label:'电子病历', file:'/admin/medical-records/', roles:['senior','practitioner'], gated:'medicalRecords'},
      {label:'电子处方', file:'/admin/prescriptions/', roles:['senior','practitioner'], gated:'prescriptions'},
      {label:'电子收据', file:'/admin/receipts/', roles:['senior','practitioner'], gated:'receipts'},
      {label:'智能排班', file:'/admin/schedule/', roles:['senior','practitioner']}
    ];
    var myRole = navAdmin.type==='senior' ? 'senior' : (navAdmin.adminType||'practitioner');
    var visible = ALL_ADMIN_TOOLS.filter(function(t){ return t.roles.indexOf(myRole)!==-1; });
    // I类执业医师看到的导航栏，要跟实际的功能开关状态一致——开关没打开的工具，不该在导航栏
    // 里出现让人点了才发现进不去。大管理员不受这个开关影响，不用过滤。
    if(myRole==='practitioner'){
      try {
        var apiBase = window.VINATH_API_BASE || 'https://api.vinathtcm.com/api';
        var res = await fetch(apiBase + '/site-settings/module_access');
        var access = res.ok ? (await res.json() || {}) : {};
        visible = visible.filter(function(t){ return !t.gated || access[t.gated]===true; });
      } catch(e){ console.error('拉取功能开关状态失败:', e); }
    }
    var currentFile = decodeURIComponent(window.location.pathname.split('/').pop());
    var navEl = document.getElementById('vinathAdminNav');
    if(!navEl) return;
    navEl.innerHTML = '<div class="vinath-admin-nav-inner">' + visible.map(function(t){
      return (currentFile === t.file) ? '<span class="van-item current">'+t.label+'</span>' : '<a class="van-item" href="'+t.file+'">'+t.label+'</a>';
    }).join('') + '<a class="van-item van-logout" href="javascript:void(0)" style="margin-left:auto;color:rgba(255,255,255,.9);font-weight:600;">退出登录</a>' + '</div>';
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById('adminToast');
    el.textContent = msg;
    el.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
  }

  // === 复用订单预约管理已有的登录会话（同一浏览器内，两个页面共享localStorage） ===
  function getCurrentAdmin(){
    try { var raw = localStorage.getItem('vinath_current_admin'); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  var cur = getCurrentAdmin();
  var isPractitioner = cur && (cur.type==='senior' || (cur.type==='junior' && (cur.adminType||'practitioner')==='practitioner'));
  var isJuniorPractitioner = cur && cur.type==='junior' && (cur.adminType||'practitioner')==='practitioner';
  var isSenior = cur && cur.type==='senior';

  if(!isPractitioner){
    document.getElementById('app').innerHTML =
      '<div class="wrap"><div class="login-gate"><h1>请先登录</h1>'
      + '<div class="sub" style="margin-top:10px;">电子病历只对执业医师（大管理员 / I类小管理员）开放。请先在 <a href="/admin/orders/" style="color:var(--clay);font-weight:700;">订单预约管理</a> 页面登录，登录后回到这个页面即可看到内容——同一个浏览器里，两边共享登录状态。</div></div></div>';
    return;
  }
  renderVinathAdminNav(cur);
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function treatName(t){
    if(!t) return '';
    return t.nameEn ? t.name + ' (' + t.nameEn + ')' : t.name;
  }
  function calcAge(dob){
    if(!dob) return '';
    var d = new Date(dob);
    if(isNaN(d.getTime())) return '';
    var now = new Date();
    var age = now.getFullYear() - d.getFullYear();
    var m = now.getMonth() - d.getMonth();
    if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
    return (age >= 0) ? age : '';
  }
  function printName(t){
    if(!t) return '';
    return t.nameEn ? t.nameEn : t.name;

  function herbEn(name){
    if(!name) return '';
    if(HERB_EN[name]) return HERB_EN[name];
    for(var i=0;i<HERB_PREFIXES.length;i++){
      var p = HERB_PREFIXES[i];
      if(name.indexOf(p)===0 && HERB_EN[name.slice(p.length)]) return HERB_EN[name.slice(p.length)];
    }
    return '';
  }
  function herbLineEn(line){
    if(!line) return '';
    return line.replace(/[\u4e00-\u9fff]+/g, function(cn){
      return herbEn(cn) || cn;

  // 打印项目名（收据用）：英文优先；中药行给英文类型标签+保留中文药材名
  function rxPrintName(t){
    if(!t) return '';
    if(t.nameEn) return t.nameEn;
    var nm = t.name || '';
    if(TREATMENT_EN[nm]) return TREATMENT_EN[nm];
    if(nm.indexOf('中药') === 0 || nm.indexOf('药材费') === 0){
      var ci = nm.indexOf('：');
      var herbs = ci >= 0 ? herbLineEn(nm.slice(ci + 1)) : '';
      var kind = (nm.indexOf('颗粒') >= 0 || herbs.indexOf('Granules') >= 0) ? 'Granules' : (nm.indexOf('代煎') >= 0 ? 'Decoction' : (nm.indexOf('丸') >= 0 ? 'Pills' : 'Herbal Medicine'));
      return (kind === 'Herbal Medicine' ? 'Herbal Medicine' : 'Herbal Medicine (' + kind + ')') + (herbs ? ' - ' + herbs.replace(/、/g, ', ') : '');
    }
    if(nm.indexOf('电子处方') === 0) return 'Herbal Prescription';
    return nm;
  }

    var urlParams = new URLSearchParams(window.location.search);

  // 打开开关。被拒绝的话直接换成清晰的提示页面，不会误显示成"还没有任何病历记录"这种容易
  // 让人误会的空状态。
  async function checkModuleAccess(){
    try {
      var res = await fetch(API_BASE + '/admin/medical-records/patients', { headers: { 'Authorization': 'Bearer ' + authToken } });
      if(res.status === 403){
        document.getElementById('app').innerHTML =
          '<div class="wrap"><div class="login-gate"><h1>这个功能还没有对你开放</h1>'
          + '<div class="sub" style="margin-top:10px;">电子病历目前只开放给大管理员使用，I类执业医师是否能用由大管理员按需开关——如果需要用到这个工具，请联系大管理员开启。</div></div></div>';
        return true;
      }
      return false;
    } catch(e){ return false; } // 网络错误等其它情况不拦，交给后面各自的请求自己处理
  }

  // 历史数据里 treatmentPoints/treatments/photos 可能存成 JSON 字符串或对象，统一规范成数组，
  // 避免时间轴/表单渲染时 .map 崩溃导致整页空白
  function normArrField(v){
    if(Array.isArray(v)) return v;
    if(typeof v === 'string'){
      try { var parsed = JSON.parse(v); return Array.isArray(parsed) ? parsed : []; } catch(e){ return []; }
    }
    return [];
  }

  async function fetchRecordsForPatient(phone){
    if(!authToken) return [];
    try {
      var res = await fetch(API_BASE + '/admin/medical-records?patientPhone=' + encodeURIComponent(phone), { headers: { 'Authorization': 'Bearer ' + authToken } });
      if(!res.ok) return [];
      var records = await res.json();
      // data字段(JSON blob)展开合并到病历对象本身,让下面几百行原有的字段读写方式(r.chiefComplaint等)不用大改
      return records.map(function(r){
        var merged = Object.assign({ id:r.id, patientPhone:r.patient_phone, patientName:r.patient_name,
          practitionerId:r.practitioner_id, practitionerName:r.practitioner_name, visitDate:r.visit_date, createdAt:r.created_at }, r.data);
        // 保留后端附加的处方回填信息（编辑病历/再次开方/报表统计用）
        if(r.lastRx) merged.lastRx = r.lastRx;
        if(r.linkedBookingId) merged.linkedBookingId = r.linkedBookingId;
        merged.treatmentPoints = normArrField(merged.treatmentPoints);
        merged.treatments = normArrField(merged.treatments);
        merged.photos = normArrField(merged.photos);
        return merged;
      });
    } catch(e){ console.error('拉取病历失败:', e); return []; }
  }

      var d = rec.data || rec; // merged后treatments在病历对象顶层
      var treatments = (Array.isArray(d.treatments) ? d.treatments : []).map(function(t){ return { name: t.name, nameEn: t.nameEn||'', qty: Number(t.qty)||1, price: Number(t.price)||0 }; });

    }

    function compressPhoto(file, maxDim, quality, cb){
      // 输出 WebP 质量85 全图（最长边1280px）+ 200px 缩略图；不支持 WebP 时回退 JPEG
      var reader = new FileReader();
      reader.onload = function(ev){
        var img = new Image();
        img.onload = function(){
          try {
            function drawTo(maxEdge, q){
              var sc = Math.min(1, maxEdge / Math.max(img.width, img.height));
              var w = Math.max(1, Math.round(img.width * sc));
              var h = Math.max(1, Math.round(img.height * sc));
              var cv = document.createElement('canvas');
              cv.width = w; cv.height = h;
              var c = cv.getContext('2d');
              c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h);
              c.drawImage(img, 0, 0, w, h);
              var out = cv.toDataURL('image/webp', q);
              if(out.indexOf('data:image/webp') !== 0){ out = cv.toDataURL('image/jpeg', q); }
              return out;
            }
            cb({ full: drawTo(maxDim, quality), thumb: drawTo(200, 0.7) });
          } catch(err) { cb(null); }
        };
        img.onerror = function(){ cb(null); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }
    // 照片前端压缩：后端接口 body 上限 13MB，手机原图 base64 膨胀约 1.33 倍，多张照片很容易
    // 超限导致保存 413 失败。这里压到最长边 1280px / JPEG 0.72，单张约 100-300KB，多张也不会超限。
    document.getElementById('photoFileInput').addEventListener('change', function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      compressPhoto(f, 1280, 0.85, function(res){
        if(!res){ showToast('照片压缩失败，请重试或换一张'); return; }
        r.photos.push({photoType:pendingPhotoType, photoUrl:res.full, photoThumb:res.thumb, uploadedBy:'practitioner', takenAt:new Date().toISOString()});
        renderPhotoGrid();
      });
      this.value = '';
    });

    function renderRhxSuggest(inp, sug, q){
      q = (q||'').trim().toLowerCase();
      if(!q){ sug.style.display='none'; return; }
      var names = Object.keys(HERB_PRICE_MAP || {});
      if(!names.length){ sug.style.display='none'; return; }
      var hits = [];
      for(var i=0;i<names.length && hits.length<10;i++){
        var n = names[i];
        if(n.toLowerCase().indexOf(q) >= 0){ hits.push(n); continue; }
        var py = HERB_PY_MAP[n];
        if(py && (py.py.indexOf(q) >= 0 || py.ini.indexOf(q) >= 0)){ hits.push(n); }
      }
      if(!hits.length){ sug.style.display='none'; return; }
      sug.innerHTML = hits.map(function(h){ return '<div data-rhs-pick="'+h.replace(/"/g,'&quot;')+'" style="padding:7px 10px;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f0f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+h+'</div>'; }).join('');

      sug.querySelectorAll('[data-rhs-pick]').forEach(function(opt){

      var mode = document.getElementById('rxDispenseMRInput').value;
      var doses = Number(document.getElementById('rxDosesMRInput').value) || 1;
      var ddInp = document.getElementById('rxDecoctDosesMRInput');

        var dd = ddInp ? Number(ddInp.value) || doses : doses;
        var fee = 8 * dd;
        hint.textContent = '饮片代煎费 RM8/剂 × ' + dd + ' 剂 = RM' + fee.toFixed(2) + (dd !== doses ? '（中药费仍按总剂数 ' + doses + ' 剂计算）' : '（随处方自动计入中药费）');

    // 核心保存逻辑：病历 + 处方，返回 {ok, savedMrId, rxItems, treatments}
    async function saveRecordCore(){
      var ok = false, savedMrId = null, rxItems = [], treatments = [];
      r.visitDate = document.getElementById('visitDateInput').value.trim() || new Date().toISOString().slice(0,10);
      r.visitType = document.getElementById('visitTypeInput').value;
      r.gender = document.getElementById('patientGenderInput') ? document.getElementById('patientGenderInput').value : '';
      r.dateOfBirth = document.getElementById('patientDobInput') ? document.getElementById('patientDobInput').value : '';
      r.age = r.dateOfBirth ? calcAge(r.dateOfBirth) : '';
      r.voiceNotes = document.getElementById('voiceNotesInput').value.trim();
      r.chiefComplaint = document.getElementById('chiefComplaintInput').value.trim();
      r.presentIllness = document.getElementById('presentIllnessInput').value.trim();
      r.medicalHistory = document.getElementById('medicalHistoryInput').value.trim();
      r.pulseNotes = document.getElementById('pulseNotesInput').value.trim();
      r.tcmDiagnosis = document.getElementById('tcmDiagnosisInput').value.trim();
      r.syndromePattern = document.getElementById('syndromePatternInput').value.trim();
      r.treatmentPlan = document.getElementById('treatmentPlanInput').value.trim();
      if(!r.chiefComplaint){ showToast('请至少填写"主诉"再保存'); return { ok:false }; }

      // data里打包的是除了"患者是谁/哪次就诊/谁看的"这几个用来查询筛选的字段之外的全部具体问诊内容——
      // 这类字段还可能随实际使用继续调整，整体存JSON，不用为每次调整字段都写数据库迁移
      var dataPayload = {};
      ['visitType','voiceNotes','chiefComplaint','presentIllness','medicalHistory','pulseNotes','pulseType',
       'tongueBodyColor','tongueBodyColorCustom','tongueCoating','tongueCoatingCustom','tongueShape','tongueShapeCustom',
       'constitutionType','constitutionTypeCustom','tcmDiagnosis','syndromePattern','treatmentPlan','treatmentPoints','photos',
       'gender','dateOfBirth','age'
      ].forEach(function(k){ if(r[k]!==undefined) dataPayload[k] = r[k]; });
      if(rxDraft.treatments && rxDraft.treatments.length) dataPayload.treatments = rxDraft.treatments;

      try {
        var url = r.id ? API_BASE + '/admin/medical-records/' + r.id : API_BASE + '/admin/medical-records';
        var res = await fetch(url, {
          method: r.id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
          body: JSON.stringify({ patientPhone: r.patientPhone, patientName: r.patientName, visitDate: r.visitDate, data: dataPayload })
        });
        if(!res.ok){ showToast('保存失败，请重试'); return { ok:false }; }
        var savedRecord = await res.json();
        savedMrId = savedRecord && savedRecord.id;
        if(rxDraft.enabled){
          rxItems = rxDraft.items.filter(function(it){ return it.herbName && String(it.herbName).trim() && it.dosageGrams; });
          treatments = rxDraft.treatments || [];
          if(rxItems.length || treatments.length){
            var rxPayload = { patientName: r.patientName, patientPhone: r.patientPhone, medicalRecordId: savedMrId || null, bookingId: rxDraft.bookingId || null, formulaType: rxDraft.formulaType, items: rxItems, usageInstructions: rxDraft.usageInstructions || '', treatments: treatments, doses: Number(rxDraft.doses) || 1, decoctDoses: Number(rxDraft.decoctDoses) || 0, dispenseMode: rxDraft.dispenseMode || 'herb_pickup' };
            try {
              // [fixed] 编辑已有病历且已有处方时更新原处方，避免每次编辑保存都新建一条重复处方
              var editRx = !!(r.id && r.lastRx && r.lastRx.id);
              var rxRes = await fetch(editRx ? (API_BASE + '/admin/prescriptions/' + encodeURIComponent(r.lastRx.id)) : (API_BASE + '/admin/prescriptions'), { method: editRx ? 'PUT' : 'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken}, body: JSON.stringify(rxPayload) });
              ok = true;
              showToast(rxRes.ok ? '病历与处方已保存' : '病历已保存，但处方提交失败');
              // 治疗项目写回预约：当日交易报表 / 预约记录 / 病历管理面板都能统计到
              if(rxRes.ok && rxDraft.bookingId && treatments.length){
                try {
                  await fetch(API_BASE + '/admin/bookings/' + encodeURIComponent(rxDraft.bookingId) + '/treatments', {
                    method:'PUT', headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
                    body: JSON.stringify({ treatments: treatments })
                  });
                } catch(e3){}
              }
            } catch(e2){ ok = true; showToast('病历已保存，但处方提交失败'); }
          } else {
            ok = true;
            showToast('病历已保存（未填写处方药材，未提交处方）');
          }
        } else {
          ok = true;
          showToast('病历已保存');
        }
        activePatientPhone = r.patientPhone;
        return { ok: ok, savedMrId: savedMrId, rxItems: rxItems, treatments: treatments, doses: Number(rxDraft.doses) || 1, decoctDoses: Number(rxDraft.decoctDoses) || 0, dispenseMode: rxDraft.dispenseMode || 'herb_pickup' };
      } catch(e){
        showToast('连不上服务器，请检查网络后重试');
        return { ok:false };
      }
    }

    // [fixed] 防连点：保存进行中禁用按钮，避免用户重复点击产生重复处方/重复收据
    var savingNow = false;
    document.getElementById('saveRecordBtn').addEventListener('click', async function(){
      if(savingNow) return; savingNow = true;
      var btn = this; btn.disabled = true;
      var res = await saveRecordCore();
      savingNow = false; btn.disabled = false;
      if(res && res.ok){ view = 'timeline'; render(); }
    });
    document.getElementById('saveAndPrintBtn').addEventListener('click', async function(){
      if(savingNow) return; savingNow = true;
      var btn = this; btn.disabled = true;
      var result = await saveRecordCore();
      savingNow = false; btn.disabled = false;
      if(!result || !result.ok) return;
      openInvoicePrint(result, r.patientName, r.patientPhone);
    });
  }

      if(result.rxItems && result.rxItems.length){

        // 小票只显示价格库里已定价的中药：没定价的不显示、不计入金额（只填了名字用于联想，无售价）
        var pricedRx = (result.rxItems || []).filter(function(it){ return it.herbName && ((hpm[it.herbName] || 0) > 0); });
        if(pricedRx.length){
          var herbSummary = pricedRx.map(function(it){ return it.herbName + ' ' + it.dosageGrams + 'g'; }).join('、');
          var herbAmount = 0;
          var herbDoses = Number(result.doses) || 1;
          pricedRx.forEach(function(it){ var ppg = hpm[it.herbName] || 0; if(ppg > 0) herbAmount += ppg * (Number(it.dosageGrams) || 0) * herbDoses; });
          herbAmount = Math.round(herbAmount * 100) / 100;
          var herbPerDose = Math.round((herbAmount / herbDoses) * 100) / 100;
          items.push({ name: '中药费（电子处方' + (isDecoct ? '·代煎' : '') + '）：' + herbSummary, qty: herbDoses, price: herbPerDose });
        }
        if(isDecoct){
          var doses = Number(result.doses) || 1;
          var dd = Number(result.decoctDoses) || doses;
          if(dd > 0) items.push({ name: 'Decoction Fee', qty: dd, price: 8 });
        }
      }
      if(!items.length){ showToast('本次就诊没有可打印的治疗项目或药材，未生成发票'); return; }
      try {
        var treatTotal = items.filter(function(it){ return it.price > 0; }).reduce(function(s,it){ return s + it.price * (it.qty||1); }, 0);
        var herbTotal = items.filter(function(it){ return it.price === 0; }).reduce(function(s,it){ return s + it.price * (it.qty||1); }, 0);
        var res = await fetch(API_BASE + '/admin/receipts', {
          method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
          body: JSON.stringify({
            patientName: patientName, patientPhone: patientPhone,
            practitionerId: (cur && cur.id) || null,
            practitionerNameSnapshot: (cur && cur.name) || 'VINATH TCM',
            items: { consultation: 0, transport: 0, medication: 0, other: treatTotal },
            lineItems: items,
            paymentMethod: 'cash', paymentStatus: 'paid'
          })
        });
        if(!res.ok){ var ej = await res.json().catch(function(){ return {}; }); showToast('发票保存失败：' + (ej.error || res.status)); return; }
        var receipt = await res.json();
        if(size){ doPrintReceipt(receipt, size); } else { showPrintChooser(receipt); }
      } catch(e){ showToast('发票保存失败，请检查网络'); }
    }
    function showPrintChooser(receipt){
      // [fixed] 弹窗唯一化：防止重复保存并打印时叠加多个全屏遮罩，画面越来越暗、按钮被盖住
      var oldOv = document.getElementById('printChooser'); if(oldOv) oldOv.remove();
      var ov = document.createElement('div');
      ov.id = 'printChooser';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = '<div style="background:#fff;border-radius:14px;padding:26px 30px;text-align:center;min-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.2);">'
        + '<div style="font-size:16px;font-weight:700;margin-bottom:4px;">发票已保存</div>'
        + '<div style="font-size:13px;color:#6B7280;margin-bottom:18px;">' + escapeHtml(receipt.receipt_no) + ' · ' + money(receipt.total_amount) + '</div>'
        + '<div style="display:flex;flex-direction:column;gap:10px;">'
        + '<button class="btn-primary" id="print58Btn" style="padding:12px;">打印 58mm 小票</button>'
        + '<button class="btn-primary" id="printA4Btn" style="padding:12px;background:#3A3F42;">打印 A4 发票</button>'
        + '<button class="btn-secondary" id="printCloseBtn" style="padding:10px;">暂不打印</button>'
        + '</div></div>';
      document.body.appendChild(ov);
      ov.addEventListener('click', function(ev){ if(ev.target === ov){ ov.remove(); view = 'timeline'; render(); } });
      ov.querySelector('#print58Btn').addEventListener('click', function(){ doPrintReceipt(receipt, '58'); });
      ov.querySelector('#printA4Btn').addEventListener('click', function(){ doPrintReceipt(receipt, 'a4'); });
      ov.querySelector('#printCloseBtn').addEventListener('click', function(){ ov.remove(); view = 'timeline'; render(); });
    }
    function doPrintReceipt(receipt, size){
      setPrintPageSize(size);
      fillPrintArea(receipt, size);
      document.body.classList.remove('print-58','print-a4');
      document.body.classList.add(size === '58' ? 'print-58' : 'print-a4');
      var ov = document.getElementById('printChooser'); if(ov) ov.remove();
      setTimeout(function(){
        window.print();
        document.body.classList.remove('print-58','print-a4');
        view = 'timeline'; render();
      }, 250);
    }

        var type = document.getElementById('fTypeInput').value;
        var usage = document.getElementById('fUsageInput').value.trim();
        var validItems = f.items.filter(function(it){ return it.herbName && String(it.herbName).trim() && it.dosageGrams; });
        if(!name){ showToast('请填写协定方名称'); return; }
        if(!validItems.length){ showToast('请至少填写一味药材及剂量'); return; }
        var btn = this; btn.disabled = true;
        try {
          var url = API_BASE + '/admin/personal-formulas' + (f.id ? '/' + f.id : '');
          var res = await fetch(url, { method: f.id ? 'PUT' : 'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+authToken},
            body: JSON.stringify({ name:name, formulaType:type, items:validItems, usageInstructions:usage }) });
          if(!res.ok){ showToast('保存失败，请重试'); btn.disabled = false; return; }
          showToast('协定方已保存');
          editingFormula = null;
          renderFormulas();
        } catch(e){ showToast('连不上服务器，请检查网络后重试'); btn.disabled = false; }
      });
    } else {
      document.getElementById('fNewBtn').addEventListener('click', function(){ editingFormula = {}; renderFormulas(); });
      document.querySelectorAll('[data-fedit]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = this.getAttribute('data-fedit');
          for(var i=0;i<formulas.length;i++){ if(formulas[i].id===id){ editingFormula = formulas[i]; break; } }
          renderFormulas();
        });
      });
      document.querySelectorAll('[data-fdel]').forEach(function(btn){
        btn.addEventListener('click', async function(){
          var id = this.getAttribute('data-fdel');
          if(!confirm('确定删除这个协定方？删除后不可恢复。')) return;
          try {
            await fetch(API_BASE + '/admin/personal-formulas/' + id, { method:'DELETE', headers:{'Authorization':'Bearer '+authToken} });
            showToast('已删除');
            renderFormulas();
          } catch(e){ showToast('删除失败，请重试'); }
        });
      });
    }
  }

  initFromBackend();
})();
</script>
